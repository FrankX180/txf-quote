name: probe-mis

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe TAIFEX MIS from GitHub runner
        run: |
          echo "--- POST getQuoteList (MT1) ---"
          code=$(curl -s -o /tmp/o -w "%{http_code}" -X POST \
            "https://mis.taifex.com.tw/futures/api/getQuoteList" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -H "Origin: https://mis.taifex.com.tw" \
            -H "Referer: https://mis.taifex.com.tw/futures/RegularSession/EquityIndices/FuturesDomestic/" \
            -d '{"MarketType":"1","SymbolType":"F","KindID":"1","CID":"","ExpireMonth":"","PageNo":1}')
          echo "HTTP $code"
          head -c 500 /tmp/o
          echo ""
          echo "--- GET site root ---"
          curl -s -o /dev/null -w "site HTTP %{http_code}\n" "https://mis.taifex.com.tw/futures/"
