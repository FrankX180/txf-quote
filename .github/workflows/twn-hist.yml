name: twn-hist
# 富台（SGX TWN）1 分 K 存檔：不套休市閘門（台灣連假 SGX 照常交易，缺了就是走勢缺口）
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/fetch_twn_hist.py"
      - "scripts/merge_twn_hist.py"
      - ".github/workflows/twn-hist.yml"
concurrency:
  group: twn-hist
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install websocket-client
        run: pip install websocket-client==1.8.0
      - name: Fetch SGX TWN 1m history (TradingView)
        run: python scripts/fetch_twn_hist.py
      - name: Commit twn-hist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/twn-hist.json data/twn-hist-meta.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "富台歷史 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          branch="${GITHUB_REF_NAME:-master}"
          for i in 1 2 3 4 5 6; do
            if git push origin "HEAD:refs/heads/${branch}"; then
              # 真的推上去了才算成功：rebase 半途中斷時 push 會是 no-op，也照樣印 push ok
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${branch}")" ]; then
                echo "push ok (attempt ${i})"
                exit 0
              fi
              echo "WARN push reported ok but remote tip mismatch; retrying" >&2
            fi
            echo "push rejected; rebase retry ${i}"
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then
              # 衝突時不取單邊：rebase 中 `--ours`＝upstream、`--theirs`＝本次 commit，
              # 不管取哪邊都一定丟資料（另一邊獨有的 bar）。改為按時間戳聯集兩側。
              echo "WARN rebase conflict; merging both sides by timestamp" >&2
              MERGE_PY=scripts/merge_twn_hist.py
              if [ ! -f "$MERGE_PY" ]; then
                # 第一次部署時 upstream 還沒這支腳本（rebase 已 checkout 到 upstream），從本次 commit 取。
                # 注意：`|| true` 會讓失敗留下空檔，而 `python 空檔` 的 exit code 是 0，
                # 等於「合併成功」把衝突標記推上去（2026-11-10 審查 S04#10）。所以驗大小。
                if ! git show "3:${MERGE_PY}" > /tmp/merge_twn_hist.py 2>/dev/null || [ ! -s /tmp/merge_twn_hist.py ]; then
                  git rebase --abort || true
                  echo "cannot recover merge script from stage 3; aborting this run" >&2
                  exit 1
                fi
                MERGE_PY=/tmp/merge_twn_hist.py
              fi
              if ! python "$MERGE_PY"; then
                git rebase --abort || true
                echo "merge failed; aborting this run" >&2
                exit 1
              fi
              # 合併後必須可解析：有衝突標記就別 commit（寧可紅燈，也不要推壞 JSON）
              if ! python -c "import json,sys;json.load(open('data/twn-hist.json',encoding='utf-8'))"; then
                git rebase --abort || true
                echo "merged twn-hist.json is not valid JSON; aborting" >&2
                exit 1
              fi
              git add data/twn-hist.json data/twn-hist-meta.json
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort || true
                echo "rebase could not continue; aborting this run" >&2
                exit 1
              fi
            fi
            sleep $((i * 2))
          done
          echo "push failed after retries" >&2
          exit 1
