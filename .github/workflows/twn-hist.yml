name: twn-hist
# 富台（SGX TWN）1 分 K 存檔：不套休市閘門（台灣連假 SGX 照常交易，缺了就是走勢缺口）
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/fetch_twn_hist.py"
      - ".github/workflows/twn-hist.yml"
concurrency:
  group: twn-hist
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install websocket-client
        run: pip install websocket-client==1.8.0
      - name: Fetch SGX TWN 1m history (TradingView)
        run: python scripts/fetch_twn_hist.py
      - name: Commit twn-hist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/twn-hist.json data/twn-hist-meta.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "富台歷史 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          branch="${GITHUB_REF_NAME:-master}"
          for i in 1 2 3 4 5 6; do
            if git push origin "HEAD:refs/heads/${branch}"; then
              # 真的推上去了才算成功：rebase 半途中斷時 push 會是 no-op，也照樣印 push ok
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${branch}")" ]; then
                echo "push ok (attempt ${i})"
                exit 0
              fi
              echo "WARN push reported ok but remote tip mismatch; retrying" >&2
            fi
            echo "push rejected; rebase retry ${i}"
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then
              # 保留本次 run 的版本（--ours）：它已經含舊檔＋這次新抓的資料；
              # 用 --theirs 會拿 upstream 的舊檔，静默丟掉 upstream 獨有的歷史
              echo "WARN rebase conflict; keeping this run's data files" >&2
              git checkout --ours -- data/twn-hist.json data/twn-hist-meta.json || true
              git add data/twn-hist.json data/twn-hist-meta.json || true
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort || true
                echo "rebase could not continue; aborting this run" >&2
                exit 1
              fi
            fi
            sleep $((i * 2))
          done
          echo "push failed after retries" >&2
          exit 1
