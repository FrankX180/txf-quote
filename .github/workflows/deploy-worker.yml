name: deploy-worker

# 雲端部署 Cloudflare Worker（不需任何本機檔案、不需本機憑證）。
# 憑證：repo secret `CLOUDFLARE_API_KEY` = Cloudflare **Global API Key**
#       （deploy_worker.py 用 X-Auth-Key 驗證，故要 Global Key，不是 scoped API Token）。
# 只在 worker/yahoo-quote.js 變動時自動部署；亦可 workflow_dispatch 手動觸發。
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "worker/yahoo-quote.js"

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check secret
        env:
          CFKEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          if [ -z "$CFKEY" ]; then
            echo "::error::repo secret CLOUDFLARE_API_KEY 未設定，無法雲端部署 Worker（設定後重跑本 workflow）"
            exit 1
          fi
      - name: Deploy Worker (yahoo-quote.js + D1 + cron)
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: python scripts/deploy_worker.py
