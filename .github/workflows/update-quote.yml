name: update-quote
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/fetch_quote.py"
      - "scripts/fetch_minute.py"
      - "scripts/fetch_uncovered.py"
      - "scripts/fetch_kline.py"
      - "scripts/when.py"
      - "scripts/fetch_imb.py"
      - ".github/workflows/update-quote.yml"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Yahoo WTX quote and 5-level book
        run: python scripts/fetch_quote.py
      - name: Fetch Yahoo WTX 1m/5m/15m
        run: python scripts/fetch_minute.py
        continue-on-error: true
      - name: Fetch Yahoo FITX uncovered
        run: python scripts/fetch_uncovered.py
        continue-on-error: true
      - name: Fetch MoneyDJ FITX daily/week/month K
        run: python scripts/fetch_kline.py
        continue-on-error: true
      - name: Fetch cloud imb (R2 via Worker)
        run: python scripts/fetch_imb.py
        continue-on-error: true
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/history-night.json data/history-day.json data/kline-minute.json data/uncovered.json data/kline-daily.json data/imb-*.json data/imb-latest.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "行情快照 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
