name: update-quote
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/fetch_quote.py"
      - "scripts/fetch_minute.py"
      - "scripts/fetch_uncovered.py"
      - "scripts/fetch_tmf_retail.py"
      - "scripts/fetch_kline.py"
      - "scripts/when.py"
      - "scripts/fetch_imb.py"
      - ".github/workflows/update-quote.yml"
# 排程／push 重疊時只留最新一場，避免互搶 data/*.json
concurrency:
  group: update-quote
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Yahoo WTX quote and 5-level book
        run: python scripts/fetch_quote.py
      - name: Fetch Yahoo WTX 1m/5m/15m
        run: python scripts/fetch_minute.py
        continue-on-error: true
      # uncovered 長歷史靠 scripts 合併 repo 舊檔維持（不需本機 PG／開機）
      - name: Fetch Yahoo FITX uncovered
        env:
          WEBSHARE_PROXIES: ${{ secrets.WEBSHARE_PROXIES }}
        run: python scripts/fetch_uncovered.py
        continue-on-error: true
      - name: Fetch TAIFEX TMF retail long-short ratio
        env:
          WEBSHARE_PROXIES: ${{ secrets.WEBSHARE_PROXIES }}
        run: python scripts/fetch_tmf_retail.py
        continue-on-error: true
      - name: Fetch MoneyDJ FITX daily/week/month K
        run: python scripts/fetch_kline.py
        continue-on-error: true
      - name: Fetch cloud imb (R2 via Worker)
        run: python scripts/fetch_imb.py
        continue-on-error: true
      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/history-night.json data/history-day.json \
                  data/kline-minute.json data/uncovered.json data/tmf_retail.json \
                  data/kline-daily.json data/imb-*.json data/imb-latest.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "行情快照 $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # 與本機／其他 job 搶寫時：rebase 後保留「本次抓到的 data」再推
          branch="${GITHUB_REF_NAME:-master}"
          for i in 1 2 3 4 5 6; do
            if git push origin "HEAD:refs/heads/${branch}"; then
              echo "push ok (attempt ${i})"
              exit 0
            fi
            echo "push rejected; rebase retry ${i}"
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then
              # rebase 衝突：ours=遠端舊檔、theirs=本次 commit；要本次 data
              git checkout --theirs -- data || true
              git add data || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            sleep $((i * 2))
          done
          echo "push failed after retries" >&2
          exit 1
