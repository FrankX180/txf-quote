<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台指期 TXF — 即時看盤</title>
  <style>
    :root {
      --up: #d32f2f;
      --dn: #1b8a3e;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f3f4f6;
      --card: #fff;
    }
    * { box-sizing: border-box; }
    html {
      background: var(--bg);
      overflow-x: hidden;
    }
    body {
      width: 650px;
      max-width: 650px;
      margin: 0 auto;
      overflow-x: hidden;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: #111827;
    }
    @media (max-width: 650px) {
      body { width: 100%; max-width: 100%; }
    }
    .wrap {
      width: 100%;
      max-width: 650px;
      min-width: 0;
      margin: 10px auto;
      padding: 0 12px;
      overflow: hidden;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 10px;
      min-width: 0;
      overflow: hidden;
    }
    .chipline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
    .rowlab { font-size: 13px; font-weight: 800; color: #111; min-width: 2.4em; }
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 10px;
      align-items: start;
    }
    .hero-head { min-width: 0; }
    .hero-mid { min-width: 0; }
    .title-row { display: flex; align-items: center; gap: 8px; }
    .title { font-size: 20px; font-weight: 800; }
    .pxrow { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
    .pxmeta { padding-bottom: 0; }
    #minik {
      position: relative;
      width: 100%;
      height: 118px;
    }
    .px { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin: 2px 0 0; }
    .sub { font-size: 13px; color: var(--muted); }
    .sessico {
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; width: 56px; cursor: pointer;
      font-size: 24px; line-height: 1; user-select: none;
    }
    .sumtxt { flex: 1; min-width: 0; }
    .grid {
      display: block;
      min-width: 0;
    }
    .side, .side table, .side .sub, .side .oi, .side .bar-labs {
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    .side { display: block; margin-top: 12px; }
    .side-top {
      display: block;
    }
    .side-oi {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .imbrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 8px 0 0;
    }
    .imb {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
    }
    .imb-l, .imb-r {
      min-width: 4.2em;
      font-size: 13px;
      font-weight: 800;
    }
    .imb-l { text-align: left; }
    .imb-r { text-align: right; }
    .meta {
      display: flex;
      align-items: center;
      gap: 0;
      font-size: 13px;
      line-height: 1.7;
      color: #374151;
    }
    canvas { width: 100%; height: 320px; display: block; touch-action: none; }
    .chips { margin: 4px 0 8px; }
    .chip, .mode {
      background: #f3f4f6; border: 0; border-radius: 4px; padding: 4px 10px;
      font-size: 13px; cursor: pointer; font-weight: 600; color: #374151;
    }
    .chip.on, .mode.on { background: #b91c1c; color: #fff; }
    #khost { width: 100%; height: 320px; display: none; }
    table.q { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.q td { padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
    table.q td:nth-child(2), table.q td:nth-child(4) { text-align: right; font-variant-numeric: tabular-nums; }
    table.q td:nth-child(2) { padding-right: 8px; }
    table.q td:nth-child(3) { padding-left: 8px; }
    .oi { margin-top: 0; font-size: 13px; }
    .oi h4 { margin: 0 0 4px; font-size: 13px; }
    .oi table { width: 100%; border-collapse: collapse; }
    .oi td, .oi th { padding: 3px 2px; border-bottom: 1px solid #f3f4f6; text-align: right; font-variant-numeric: tabular-nums; }
    .oi tr.tot td { border-top: 1px solid #6b7280; }
    .oi td:first-child, .oi th:first-child { text-align: left; color: #6b7280; }
    table.q td.lab { color: #6b7280; }
    .ob { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 0; table-layout: fixed; font-weight: 700; }
    .ob col.c-qty { width: 18px; }
    .ob col.c-bar { width: auto; }
    .ob col.c-px { width: 58px; }
    .ob td { padding: 2px 3px; font-variant-numeric: tabular-nums; }
    .ob .bid { color: var(--up); }
    .ob .ask { color: var(--dn); }
    .ob .lab.bid { color: var(--up); text-align: left; }
    .ob .lab.ask { color: var(--dn); text-align: right; }
    .ob .qty.bid { text-align: left; }
    .ob .qty.ask { text-align: right; }
    .ob .bar-bid { text-align: right; }
    .ob .bar-ask { text-align: left; }
    .ob .pxb { color: var(--up); text-align: right; white-space: nowrap; font-size: 14px; font-weight: 700; }
    .ob .pxa { color: var(--dn); text-align: left; white-space: nowrap; font-size: 14px; font-weight: 700; }
    .ob .rng { text-align: right; font-size: 12px; font-weight: 400; color: #374151; white-space: nowrap; }
    .bar-wrap {
      position: relative;
      display: flex;
      height: 22px;
      border-radius: 4px;
      overflow: hidden;
      margin: 4px 0 2px;
      background: #eee;
    }
    .bar-wrap::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      border-left: 2px dashed #fff;
      transform: translateX(-1px);
      pointer-events: none;
      z-index: 2;
    }
    .bar-in { background: var(--dn); }
    .bar-out { background: var(--up); }
    .bar-labs {
      position: absolute; inset: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 8px; font-size: 14px; font-weight: 700; color: #fff;
      pointer-events: none;
    }
    .up { color: var(--up); }
    .dn { color: var(--dn); }
    .flat { color: #111; }
    .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
    .live { font-size: 11px; margin-left: 8px; color: #9ca3af; }
    .live.on { color: #16a34a; }
    .szbar { display: block; height: 14px; background: var(--dn); max-width: 100%; }
    .szbar.r { background: var(--up); margin-left: auto; }
    .ver {
      text-align: right;
      padding: 0 2px 8px;
      font-size: 11px;
      color: #9ca3af;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="hero" id="hero">
        <div class="hero-head">
          <div class="title-row">
            <div class="title" id="name">台指期</div>
            <span class="live" id="live">未連線</span>
          </div>
          <div class="pxrow">
            <div class="px flat" id="last">—</div>
            <div class="pxmeta">
              <div class="sub" id="chgline"></div>
              <div class="sub" id="stamp">載入中…</div>
            </div>
          </div>
        </div>
        <div class="hero-mid">
          <div id="minik"></div>
        </div>
      </div>
    </div>

    <div class="card board">
      <div class="grid">
        <div>
          <div class="chips">
            <div class="chipline">
              <span class="rowlab">Ｋ線</span>
              <button class="chip" data-k="1" type="button">１分</button>
              <button class="chip" data-k="5" type="button">５分</button>
              <button class="chip" data-k="15" type="button">１５</button>
              <button class="chip" data-k="30" type="button">３０</button>
              <button class="chip" data-k="d" type="button">日Ｋ</button>
              <button class="chip" data-k="w" type="button">週Ｋ</button>
            </div>
            <div class="chipline">
              <span class="rowlab">走勢</span>
              <button class="chip on" data-line="0" type="button">當日</button>
              <button class="chip" data-line="2" type="button">２日</button>
              <button class="chip" data-line="3" type="button">３日</button>
              <button class="chip" data-line="4" type="button">４日</button>
              <button class="chip" data-line="5" type="button">５日</button>
            </div>
          </div>
          <div class="meta" id="sumline"></div>
          <canvas id="chart" width="720" height="280"></canvas>
          <div id="khost"></div>
        </div>
        <div class="side">
          <div class="side-top">
            <div>
              <table class="ob" id="ob"></table>
              <div class="bar-wrap">
                <div class="bar-in" id="barIn" style="width:50%"></div>
                <div class="bar-out" id="barOut" style="width:50%"></div>
                <div class="bar-labs">
                  <span id="inTxt">內盤 —</span>
                  <span id="outTxt">外盤 —</span>
                </div>
              </div>
              <div class="imbrow">
                <span class="imb-l dn" id="inPct">—</span>
                <div class="imb" id="imb"></div>
                <span class="imb-r up" id="outPct">—</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="side-oi">
        <div class="oi" id="oi-inst"></div>
        <div class="oi" id="oi-top"></div>
      </div>
    </div>
    <div class="ver">v20260814-0083</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/klinecharts@9/dist/umd/klinecharts.min.js"></script>
  <script>
    let session = "night";
    let snap = null;
    let hist = { night: [], day: [] };
    let live = false;
    let daySpan = 0;
    let chartMode = "line";
    let kInt = "1";
    let dailyPack = { night: [], day: [], daily: [], week: [] };
    let uncover = { inst: [], top: [], date: "" };
    let minutePack = {
      night_1m: [], day_1m: [],
      night_5m: [], day_5m: [],
      night_15m: [], day_15m: [],
    };
    let kchart = null;
    let miniChart = null;
    let hoverIdx = null;
    let holding = false;
    let holdTimer = null;
    let lineHit = null;
    let lastTot = null;
    let liveTimer = null;
    let klineTimer = null;
    let staleHits = 0;
    let probeOnly = false;
    let lastSig = "";
    const LIVE = "https://wtx.19850926.xyz/";
    const LB_KEY = "txfLastBook";
    const STALE_KEY = "txfStalePause";
    const IMB_KEY = "txfImbMin";
    // 每分鐘 1 根：該分鐘內最後一次 5 秒的 外盤-內盤
    let imbBars = { night: [], day: [] };

    const $ = (id) => document.getElementById(id);
    function dateKey(d) {
      if (d == null || d === "") return "";
      return String(d).replace(/-/g, "").slice(0, 8);
    }

    function raw(v) {
      if (v && typeof v === "object") v = v.raw;
      return n(v);
    }

    function n(v) {
      if (v === "" || v == null) return null;
      const x = Number(String(v).replace(/,/g, ""));
      return Number.isFinite(x) ? x : null;
    }
    function fmt(v, d = 0) {
      if (v == null || v === "") return "—";
      const x = Number(v);
      if (!Number.isFinite(x)) return String(v);
      return x.toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    function cls(diff) {
      if (diff == null || diff === 0) return "flat";
      return diff > 0 ? "up" : "dn";
    }
    function arrow(diff) {
      if (diff == null || diff === 0) return "";
      return diff > 0 ? "▲" : "▼";
    }

    function q() {
      if (!snap) return null;
      if (session === "merge") return snap.night || snap.day;
      return snap[session];
    }

    function sessOHLC() {
      const rows = minuteSeries();
      if (!rows.length) return null;
      let o = rows[0].open, h = -Infinity, l = Infinity, c = rows[rows.length - 1].close;
      rows.forEach((b) => {
        const hh = b.high != null ? b.high : b.close;
        const ll = b.low != null ? b.low : b.close;
        if (hh > h) h = hh;
        if (ll < l) l = ll;
      });
      if (!(h > -Infinity)) return null;
      return { o: o != null ? o : rows[0].close, h, l, c };
    }

    function render() {
      const x = q();
      if (!x) {
        $("stamp").textContent = "尚無資料";
        return;
      }
      const so = (session !== liveSess()) ? sessOHLC() : null;
      const last = so ? so.c : n(x.CLastPrice);
      const ref = n(x.CRefPrice);
      const openPx = so ? so.o : n(x.COpenPrice);
      const highPx = so ? so.h : n(x.CHighPrice);
      const lowPx = so ? so.l : n(x.CLowPrice);
      let diff = n(x.CDiff);
      let rate = n(x.CDiffRate);
      if (diff == null && last != null && ref != null) {
        diff = last - ref;
        rate = ref ? (diff / ref) * 100 : 0;
      }
      $("name").textContent = String(x.DispCName || "台指期")
        .replace(/\s*WTX&\s*/g, "")
        .replace(/近一/g, "")
        .trim();
      $("last").className = "px " + cls(diff);
      $("last").textContent = last == null ? "—" : fmt(last, 0);
      $("chgline").className = "sub " + cls(diff);
      $("chgline").textContent =
        last == null ? "" : `${arrow(diff)} ${fmt(Math.abs(diff), 0)} (${diff >= 0 ? "" : ""}${fmt(rate, 2)}%)`;
      $("stamp").textContent = fmtTime(x.CDate, x.CTime);
      $("sumline").innerHTML =
        `<span class="sessico" id="sessToggle" title="${session === "day" ? "日盤，點一下切夜盤" : "夜盤，點一下切日盤"}">${session === "day" ? "☀️" : "🌙"}</span>` +
        `<div class="sumtxt">` +
        `股價 <b>${fmt(last, 0)}</b> <span class="${cls(diff)}">${arrow(diff)} ${fmt(diff, 0)}(${fmt(rate, 2)}%)</span>` +
        `　總口數 ${fmt(x.CTotalVolume)}<br>` +
        `昨收 ${fmt(x.CRefPrice)}　開盤 ${fmt(openPx)}　最高 <span class="up">${fmt(highPx)}</span>　最低 <span class="dn">${fmt(lowPx)}</span>` +
        `</div>`;

      let bidTot = 0, askTot = 0;
      const levels = [1, 2, 3, 4, 5];
      levels.forEach((i) => {
        bidTot += n(x["CBidSize" + i]) || 0;
        askTot += n(x["CAskSize" + i]) || 0;
      });
      const tot = bidTot + askTot;
      const pin = tot ? (bidTot / tot) * 100 : 50;
      $("barIn").style.width = pin + "%";
      $("barOut").style.width = (100 - pin) + "%";
      const inn = n(x.inMarket), outv = n(x.outMarket);
      if (inn != null && outv != null && inn + outv > 0) {
        const pin2 = (inn / (inn + outv)) * 100;
        $("barIn").style.width = pin2 + "%";
        $("barOut").style.width = (100 - pin2) + "%";
        $("inTxt").textContent = "內盤 " + fmt(inn);
        $("outTxt").textContent = "外盤 " + fmt(outv);
        if ($("inPct")) $("inPct").textContent = pin2.toFixed(1) + "%";
        if ($("outPct")) $("outPct").textContent = (100 - pin2).toFixed(1) + "%";
        const net = outv - inn;
        const imb = $("imb");
        if (imb) {
          if (net > 0) {
            imb.className = "imb up";
            imb.textContent = "外盤向上買超 +" + fmt(net) + " 口";
          } else if (net < 0) {
            imb.className = "imb dn";
            imb.textContent = "內盤向下賣超 " + fmt(net) + " 口";
          } else {
            imb.className = "imb";
            imb.textContent = "內外盤持平 0 口";
          }
        }
      } else {
        $("inTxt").textContent = "委買 " + fmt(bidTot);
        $("outTxt").textContent = "委賣 " + fmt(askTot);
        if ($("inPct")) $("inPct").textContent = pin.toFixed(1) + "%";
        if ($("outPct")) $("outPct").textContent = (100 - pin).toFixed(1) + "%";
        if ($("imb")) $("imb").textContent = "";
      }

      let maxSz = 1;
      levels.forEach((i) => {
        maxSz = Math.max(maxSz, n(x["CBidSize" + i]) || 0, n(x["CAskSize" + i]) || 0);
      });
      let ob = `<colgroup><col class="c-qty"><col class="c-bar"><col class="c-px"><col class="c-px"><col class="c-bar"><col class="c-qty"></colgroup>`;
      const amp = (highPx != null && lowPx != null) ? Math.abs(highPx - lowPx) : null;
      const ampPct = (amp != null && openPx) ? (amp / openPx) * 100 : null;
      const ampTxt = amp == null ? "" : ("震幅" + Math.round(amp) + "點(" + (ampPct == null ? "—" : ampPct.toFixed(1) + "%") + ")");
      ob += `<tr><td class="lab bid"></td><td></td><td class="pxb">買價</td><td class="pxa">賣價</td><td colspan="2" class="rng">${ampTxt}</td></tr>`;
      levels.forEach((i) => {
        const bs = n(x["CBidSize" + i]) || 0;
        const asz = n(x["CAskSize" + i]) || 0;
        const bw = Math.round((bs / maxSz) * 100);
        const aw = Math.round((asz / maxSz) * 100);
        ob += `<tr>
          <td class="qty bid">${fmt(x["CBidSize" + i])}</td>
          <td class="bar-bid"><span class="szbar r" style="width:${bw}%"></span></td>
          <td class="pxb">${fmt(x["CBidPrice" + i])}</td>
          <td class="pxa">${fmt(x["CAskPrice" + i])}</td>
          <td class="bar-ask"><span class="szbar" style="width:${aw}%"></span></td>
          <td class="qty ask">${fmt(x["CAskSize" + i])}</td>
        </tr>`;
      });
      $("ob").innerHTML = ob;
      $("live").className = "live" + (live ? " on" : "");
      $("live").textContent = live ? "LIVE" : "快照";
      renderOi();
      drawMiniK();
      draw();
    }

    function signed(v) {
      if (v == null) return "—";
      const x = Number(v);
      const c = x > 0 ? "up" : x < 0 ? "dn" : "flat";
      return `<span class="${c}">${fmt(x)}</span>`;
    }

    function renderOi() {
      const left = $("oi-inst");
      const right = $("oi-top");
      if (!left || !right) return;
      const inst = uncover.inst || [];
      const top = uncover.top || [];
      if (inst.length) {
        let h = `<h4>${uncover.date ? uncover.date + "｜" : ""}法人未平倉</h4>`;
        h += `<table><tr><th></th><th>多單</th><th>空單</th><th>淨額</th></tr>`;
        inst.forEach((r) => {
          const nm = String(r.name || "")
            .replace("外資及陸資", "外")
            .replace("投信", "投")
            .replace("自營商", "自")
            .replace("三大法人合計", "總");
          h += `<tr class="${nm === "總" ? "tot" : ""}"><td>${nm}</td><td class="up">${fmt(r.long)}</td><td class="dn">${fmt(r.short)}</td><td>${signed(r.net)}</td></tr>`;
        });
        h += `</table>`;
        left.innerHTML = h;
      } else left.innerHTML = "";
      if (top.length) {
        const r = top[0];
        let h = `<h4>${r.type || "前十大交易人合計"}</h4>`;
        h += `<table><tr><th></th><th>部位數</th><th>百分比</th></tr>`;
        h += `<tr><td>買方</td><td>${fmt(r.long)}</td><td>${r.longPct == null ? "—" : fmt(r.longPct, 1) + "%"}</td></tr>`;
        h += `<tr><td>賣方</td><td>${fmt(r.short)}</td><td>${r.shortPct == null ? "—" : fmt(r.shortPct, 1) + "%"}</td></tr>`;
        const net = (n(r.long) || 0) - (n(r.short) || 0);
        h += `<tr><td>淨部位</td><td>${signed(net)}</td><td></td></tr>`;
        if (r.open != null) h += `<tr><td>非沖銷部位</td><td>${fmt(r.open)}</td><td></td></tr>`;
        h += `</table>`;
        right.innerHTML = h;
      } else right.innerHTML = "";
    }

    function fmtTime(d, t) {
      if (!d) return "—";
      const ds = String(d);
      const ts = String(t || "000000").padStart(6, "0");
      return `${ds.slice(4, 6)}/${ds.slice(6, 8)} ${ts.slice(0, 2)}:${ts.slice(2, 4)}:${ts.slice(4, 6)}`;
    }

    function liveSess() {
      const hm = new Date().getHours() * 100 + new Date().getMinutes();
      if (hm >= 845 && hm <= 1345) return "day";
      return "night";
    }
    function marketOpen() {
      const d = new Date();
      const dow = d.getDay();
      const hm = d.getHours() * 100 + d.getMinutes();
      if (dow === 0) return false;
      if (dow === 6) return hm < 510;
      // align when.py: day 08:45-13:45, night 14:55-05:10
      if (hm >= 845 && hm <= 1345) return true;
      if (hm >= 1455 || hm < 510) return true;
      return false;
    }
    function sessionOpenAt() {
      const d = new Date();
      const hm = d.getHours() * 100 + d.getMinutes();
      const o = new Date(d);
      if (hm >= 845 && hm <= 1345) {
        o.setHours(8, 45, 0, 0);
        return o.getTime();
      }
      if (hm >= 1455) {
        o.setHours(14, 55, 0, 0);
        return o.getTime();
      }
      // after midnight night session opened previous calendar day 14:55
      o.setDate(o.getDate() - 1);

    function lastDates(nDays) {

    function minuteSeries() {
      const { m1, m5, m15 } = packBars();
      const n = daySpan < 1 ? 1 : daySpan;
      const keep = lastDates(n);
      const take = (rows) => rows.filter((b) => keep.indexOf(dateKey(b.date)) >= 0);
      if (n <= 1) {
        const a = take(m1);
        return a.length >= 2 ? a : take(m5);
      }
      const have5 = {};
      m5.forEach((b) => { have5[dateKey(b.date)] = true; });
      const out = [];
      keep.slice().reverse().forEach((d) => {
        const src = have5[d] ? m5 : m15;
        src.forEach((b) => { if (dateKey(b.date) === d) out.push(b); });
      });
      if (out.length >= 2) return out;
      const t15 = take(m15);
      if (t15.length >= 2) return t15;
      return take(m5).length ? take(m5) : take(m1);

    function mergeBarLists(a, b) {
      const by = {};
      (a || []).concat(b || []).forEach((row) => {
        if (row && row.timestamp) by[row.timestamp] = row;

      return Object.keys(by).sort((x, y) => x - y).map((k) => by[k]);

    function fillMinutes(bars) {
      if (!bars || bars.length < 2) return bars || [];
      const step = 60000;
      const out = [bars[0]];
      for (let i = 1; i < bars.length; i++) {
        const prev = out[out.length - 1];
        const b = bars[i];
        const hole = b.timestamp - prev.timestamp;
        if (hole > step * 1.5 && hole <= 150000) {
          for (let t = prev.timestamp + step; t < b.timestamp - 30000; t += step) {
            out.push({
              timestamp: t, open: prev.close, high: prev.close, low: prev.close, close: prev.close,
              volume: 0, date: prev.date, session: prev.session,
            });
          }
        }
        out.push(b);
      }
      return out;
    }

    const MIN_KEYS = ["night_1m","day_1m","night_5m","day_5m","night_15m","day_15m"];

    function trimBars(rows, n) {

    function linePoints() {

    function sessRange(pts) {

    function mergeDaily() {
      const by = {};
      (dailyPack.night || []).concat(dailyPack.day || []).forEach((b) => {
        const d = b.date || b.timestamp;
        if (!by[d]) {

        }
        const o = by[d];
        o.high = Math.max(o.high, b.high);
        o.low = Math.min(o.low, b.low);
        o.close = b.close;
        o.volume = (o.volume || 0) + (b.volume || 0);
        if ((b.timestamp || 0) > (o.timestamp || 0)) o.timestamp = b.timestamp;

    }

    function resample(bars, ms) {
      const out = [];
      let cur = null;
      (bars || []).forEach((b) => {
        const slot = Math.floor(b.timestamp / ms) * ms;
        if (!cur || cur.timestamp !== slot) {
          if (cur) out.push(cur);
          cur = {
            timestamp: slot,
            open: b.open, high: b.high, low: b.low, close: b.close,
            volume: b.volume || 0, date: b.date,
          };
        } else {
          cur.high = Math.max(cur.high, b.high);
          cur.low = Math.min(cur.low, b.low);
          cur.close = b.close;
          cur.volume += b.volume || 0;

    function foldDaily(bars, keyFn) {

      (bars || []).forEach((b) => {
        const k = keyFn(b);
        if (!by[k]) {
          by[k] = {
            timestamp: b.timestamp,
            open: b.open, high: b.high, low: b.low, close: b.close,
            volume: b.volume || 0, date: b.date,
          };
          return;
        }
        const o = by[k];
        o.high = Math.max(o.high, b.high);
        o.low = Math.min(o.low, b.low);
        o.close = b.close;
        o.volume += b.volume || 0;

      return Object.keys(by).sort().map((k) => by[k]);

    function weekKey(b) {

    function fitCanvas(c, cssH) {
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(1, Math.round(c.clientWidth || c.width));
      const h = cssH || Math.max(1, Math.round(c.clientHeight || 280));
      c.style.height = h + "px";
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
      const ctx = c.getContext("2d");

    function draw() {
      const lineOn = chartMode === "line";
      $("chart").style.display = lineOn ? "block" : "none";
      $("khost").style.display = lineOn ? "none" : "block";
      if (!lineOn) {
        renderK();
        return;
      }
      const c = $("chart");
      const multi0 = daySpan >= 2;
      const showImb = !multi0;
      const { ctx, w, h } = fitCanvas(c, showImb ? 320 : 280);
      ctx.clearRect(0, 0, w, h);
      const pts = linePoints();
      if (pts.length < 2) {
        ctx.fillStyle = "#9ca3af";
        ctx.font = "14px sans-serif";
        ctx.fillText("走勢累積中…", 16, h / 2);
        return;
      }
      const prices = pts.map((p) => p.px);
      const qx0 = q();
      const so0 = sessOHLC();
      const useQ = session === liveSess() && daySpan < 2;
      const open = daySpan >= 2 ? prices[0] : (useQ ? (n(qx0 && qx0.COpenPrice) || prices[0]) : (so0 ? so0.o : prices[0]));
      const hi = Math.max(...prices, open, useQ ? (n(qx0 && qx0.CHighPrice) ?? -Infinity) : (so0 ? so0.h : -Infinity));
      const lo = Math.min(...prices, open, useQ ? (n(qx0 && qx0.CLowPrice) ?? Infinity) : (so0 ? so0.l : Infinity));
      let yPad = daySpan >= 2 ? 50 : 100;
      let mx = Math.ceil((hi + yPad) / 100) * 100;
      let mn = Math.floor((lo - yPad) / 100) * 100;
      if (!(mx > mn)) { mx = mn + 200; }
      let yStep = 100;
      while ((mx - mn) / yStep > 5) yStep += 100;
      const { t0, t1 } = sessRange(pts);
      const multi = daySpan >= 2;
      const padL = 56, padR = 33, padT = 10, padB = multi ? 8 : 22;
      const imbH = showImb && !multi ? 52 : 0;
      const imbGap = imbH ? 6 : 0;
      const cw = w - padL - padR;
      const ch = h - padT - padB - imbH - imbGap;
      const imbTop = padT + ch + imbGap;
      const xAtI = (i, t) => multi
        ? padL + (i / Math.max(1, pts.length - 1)) * cw
        : padL + ((t - t0) / (t1 - t0)) * cw;
      const yAt = (p) => padT + (1 - (p - mn) / (mx - mn)) * ch;

      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#6b7280";
      ctx.font = "11px sans-serif";
      for (let pv = mn; pv <= mx; pv += yStep) {
        const y = Math.round(yAt(pv)) + 0.5;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(w - padR, y);
        ctx.stroke();
        ctx.fillText(pv.toLocaleString("zh-TW"), 4, y + 4);
      }
      ctx.textAlign = "center";
      if (!multi) {
        const hour0 = new Date(t0);
        hour0.setMinutes(0, 0, 0);
        if (hour0.getTime() < t0) hour0.setHours(hour0.getHours() + 1);
        const spanMs = t1 - t0;
        const hourStep = spanMs > 72 * 3600000 ? 12 : spanMs > 20 * 3600000 ? 4 : 1;
        for (let t = hour0.getTime(); t <= t1; t += 3600000 * hourStep) {
          const x = Math.round(xAtI(0, t)) + 0.5;
          ctx.beginPath();
          ctx.moveTo(x, padT);
          ctx.lineTo(x, padT + ch);
          ctx.stroke();
          ctx.fillText(String(new Date(t).getHours()).padStart(2, "0"), x, h - 6);
        }
      }
      ctx.textAlign = "left";

      const yOpen = Math.round(yAt(open)) + 0.5;
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = "#9ca3af";
      ctx.beginPath();
      ctx.moveTo(padL, yOpen);
      ctx.lineTo(w - padR, yOpen);
      ctx.stroke();
      ctx.setLineDash([]);

      let gap = Infinity;
      if (!multi) {
        let step = 60000;
        if (pts.length >= 2 && pts[1].time && pts[0].time) {
          step = Math.max(60000, pts[1].time - pts[0].time);
        }
        gap = step * 2.5;
      }
      const runs = [];
      let run = [];
      for (let i = 0; i < pts.length; i++) {
        if (!multi && i && pts[i].time && pts[i - 1].time && pts[i].time - pts[i - 1].time > gap) {
          if (run.length >= 2) runs.push(run);
          run = [];
        }
        run.push({ x: xAtI(i, pts[i].time), y: yAt(pts[i].px), px: pts[i].px });
      }
      if (run.length >= 2) runs.push(run);

      const gUp = ctx.createLinearGradient(0, padT, 0, yOpen);
      gUp.addColorStop(0, "rgba(211,47,47,0.32)");
      gUp.addColorStop(1, "rgba(211,47,47,0.00)");
      const gDn = ctx.createLinearGradient(0, yOpen, 0, padT + ch);
      gDn.addColorStop(0, "rgba(27,138,62,0.00)");
      gDn.addColorStop(1, "rgba(27,138,62,0.32)");

      function areaPath(seg) {
        ctx.beginPath();
        ctx.moveTo(seg[0].x, yOpen);
        seg.forEach((p) => ctx.lineTo(p.x, p.y));
        ctx.lineTo(seg[seg.length - 1].x, yOpen);
        ctx.closePath();
      }
      runs.forEach((seg) => {
        ctx.save();
        ctx.beginPath();
        ctx.rect(padL, padT, w - padL - padR, Math.max(0, yOpen - padT));
        ctx.clip();
        areaPath(seg);
        ctx.fillStyle = gUp;
        ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.beginPath();
        ctx.rect(padL, yOpen, w - padL - padR, Math.max(0, padT + ch - yOpen));
        ctx.clip();
        areaPath(seg);
        ctx.fillStyle = gDn;
        ctx.fill();
        ctx.restore();
      });

      ctx.lineWidth = 1;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      runs.forEach((seg) => {
        for (let i = 1; i < seg.length; i++) {
          const a = seg[i - 1], b = seg[i];
          if ((a.px - open) * (b.px - open) < 0 && b.px !== a.px) {
            const t = (open - a.px) / (b.px - a.px);
            const xm = a.x + (b.x - a.x) * t;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(xm, yOpen);
            ctx.strokeStyle = a.px >= open ? "#d32f2f" : "#1b8a3e";
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(xm, yOpen);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = b.px >= open ? "#d32f2f" : "#1b8a3e";
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = (a.px >= open || b.px >= open) ? "#d32f2f" : "#1b8a3e";
            ctx.stroke();
          }
        }
      });

      let hiI = 0, loI = 0, hiV = -Infinity, loV = Infinity;
      pts.forEach((p, i) => {
        const hv = p.high != null ? p.high : p.px;
        const lv = p.low != null ? p.low : p.px;
        if (hv > hiV) { hiV = hv; hiI = i; }
        if (lv < loV) { loV = lv; loI = i; }
      });
      function markExt(i, val, up) {
        const x = xAtI(i, pts[i].time);
        const y = yAt(val);
        ctx.fillStyle = up ? "#d32f2f" : "#1b8a3e";
        ctx.beginPath();
        ctx.moveTo(x, y);
        if (up) {
          ctx.lineTo(x - 4, y + 6);
          ctx.lineTo(x + 4, y + 6);
        } else {
          ctx.lineTo(x - 4, y - 6);
          ctx.lineTo(x + 4, y - 6);
        }
        ctx.closePath();
        ctx.fill();
        ctx.font = "11px sans-serif";
        ctx.textAlign = "center";
        const lab = Math.round(val).toLocaleString("zh-TW");
        const ty = up ? Math.max(padT + 11, y - 8) : Math.min(padT + ch - 2, y + 14);
        ctx.fillText(lab, Math.min(padL + cw - 20, Math.max(padL + 20, x)), ty);
      }
      if (hiV > -Infinity) markExt(hiI, hiV, true);
      if (loV < Infinity) markExt(loI, loV, false);

      const qx = q();
      const soBar = sessOHLC();
      const useQBar = session === liveSess() && daySpan < 2;
      const o = useQBar ? n(qx && qx.COpenPrice) : (soBar ? soBar.o : n(qx && qx.COpenPrice));
      const barH = useQBar ? n(qx && qx.CHighPrice) : (soBar ? soBar.h : n(qx && qx.CHighPrice));
      const barL = useQBar ? n(qx && qx.CLowPrice) : (soBar ? soBar.l : n(qx && qx.CLowPrice));
      const cl = useQBar ? n(qx && qx.CLastPrice) : (soBar ? soBar.c : n(qx && qx.CLastPrice));
      if ([o, barH, barL, cl].every((v) => v != null)) {
        const mid = Math.round(w - 14) + 0.5;
        const yH = yAt(barH), yL = yAt(barL);
        const yTop = yAt(Math.max(o, cl));
        const yBot = yAt(Math.min(o, cl));
        const col = cl >= o ? "#d32f2f" : "#1b8a3e";
        ctx.strokeStyle = col;
        ctx.fillStyle = col;
        ctx.lineWidth = 2;
        ctx.lineCap = "butt";
        ctx.beginPath();
        ctx.moveTo(mid, yH);
        ctx.lineTo(mid, yL);
        ctx.stroke();
        const bh = Math.max(2, yBot - yTop);
        ctx.fillRect(mid - 6.5, yTop, 13, bh);
      }

      // 副圖：每分鐘 1 根柱，寬 2；值＝該分鐘最後一次 5 秒 外盤-內盤
      if (showImb && !multi && imbH > 0) {
        const ibs = imbSeries().filter((b) => b.t >= t0 && b.t <= t1);
        const zeroY = Math.round(imbTop + imbH / 2) + 0.5;
        ctx.strokeStyle = "#e5e7eb";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padL, zeroY);
        ctx.lineTo(w - padR, zeroY);
        ctx.stroke();
        ctx.fillStyle = "#9ca3af";
        ctx.font = "10px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("內外差", 4, imbTop + 10);
        let maxAbs = 1;
        ibs.forEach((b) => {
          if (Math.abs(b.d) > maxAbs) maxAbs = Math.abs(b.d);
        });
        // 略放大頭，避免貼邊
        maxAbs = Math.max(maxAbs * 1.05, 1);
        const half = imbH / 2 - 2;
        ibs.forEach((b) => {
          const x = Math.round(xAtI(0, b.t + 30000));
          const y = zeroY - (b.d / maxAbs) * half;
          const top = Math.min(zeroY, y);
          const bh = Math.max(1, Math.abs(y - zeroY));
          ctx.fillStyle = b.d >= 0 ? "#d32f2f" : "#1b8a3e";
          ctx.fillRect(x - 1, top, 2, bh);
        });
        const last = ibs.length ? ibs[ibs.length - 1] : null;
        if (last) {
          ctx.fillStyle = last.d >= 0 ? "#d32f2f" : "#1b8a3e";
          ctx.font = "10px sans-serif";
          ctx.textAlign = "right";
          const lab = (last.d > 0 ? "+" : "") + Math.round(last.d);
          ctx.fillText(lab, w - padR, imbTop + 10);
        }
        ctx.textAlign = "left";
      }
      lineHit = { pts, xs: pts.map((p, i) => xAtI(i, p.time)) };
      if (holding && hoverIdx != null && pts[hoverIdx]) {
        const hp = pts[hoverIdx];
        const hx = xAtI(hoverIdx, hp.time);
        const hy = yAt(hp.px);
        ctx.save();
        ctx.strokeStyle = "#111827";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(hx + 0.5, padT);
        ctx.lineTo(hx + 0.5, padT + ch);
        ctx.moveTo(padL, hy + 0.5);
        ctx.lineTo(padL + cw, hy + 0.5);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(hx, hy, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = "#111827";
        ctx.fill();
        ctx.restore();
        const d = new Date(hp.time);
        const ds = (d.getMonth() + 1) + "/" + d.getDate() + " "
          + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
        const tip = ds + " " + Math.round(Number(hp.close != null ? hp.close : hp.px) || 0);
        ctx.font = "12px sans-serif";
        const tw = ctx.measureText(tip).width;
        let tx = hx + 8;
        if (tx + tw + 10 > w - 8) tx = hx - tw - 12;
        if (tx < padL) tx = padL;
        const ty = padT + 4;
        ctx.fillStyle = "rgba(255,255,255,0.92)";
        ctx.fillRect(tx - 4, ty, tw + 8, 18);
        ctx.fillStyle = "#111827";
        ctx.textAlign = "left";
        ctx.fillText(tip, tx, ty + 13);
      }
    }

    function nearestLine(clientX) {
      if (!lineHit || !lineHit.xs.length) return 0;
      const x = clientX - $("chart").getBoundingClientRect().left;
      let best = 0, bestD = 1e15;
      lineHit.xs.forEach((px, i) => {
        const d = Math.abs(px - x);
        if (d < bestD) { bestD = d; best = i; }
      });
      return best;
    }

    function bindLineHold() {
      const c = $("chart");
      if (!c || c.dataset.hold) return;
      c.dataset.hold = "1";
      c.addEventListener("pointerdown", (e) => {
        if (chartMode !== "line") return;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => {
          holding = true;
          hoverIdx = nearestLine(e.clientX);
          try { c.setPointerCapture(e.pointerId); } catch (err) {}
          draw();
        }, 320);
      });
      c.addEventListener("pointermove", (e) => {
        if (!holding) return;
        hoverIdx = nearestLine(e.clientX);
        draw();
      });
      function endHold() {
        clearTimeout(holdTimer);
        if (!holding) return;
        holding = false;
        hoverIdx = null;
        draw();
      }
      c.addEventListener("pointerup", endHold);
      c.addEventListener("pointercancel", endHold);
    }

    function liveDayBar() {
      const x = q();
      if (!x) return null;
      const c = n(x.CLastPrice);
      if (c == null) return null;
      const o = n(x.COpenPrice);
      const h = n(x.CHighPrice);
      const l = n(x.CLowPrice);
      const ds = String(x.CDate || "");
      const date = ds.length === 8 ? ds.slice(0, 4) + "-" + ds.slice(4, 6) + "-" + ds.slice(6, 8) : "";
      if (!date) return null;
      const p = date.split("-");
      const ts = Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 5, 45);
      return {
        timestamp: ts,
        open: o == null ? c : o,
        high: h == null ? c : h,
        low: l == null ? c : l,
        close: c,
        volume: n(x.CTotalVolume) || 0,
        date,
      };
    }

    function slimYahoo(d) {
      const last = raw(d.price);
      const ref = raw(d.regularMarketPreviousClose);
      let diff = raw(d.change);
      if (diff == null && last != null && ref != null) diff = last - ref;
      let rate = null;
      const cp = d.changePercent;
      if (typeof cp === "string" && cp.endsWith("%")) rate = parseFloat(cp);
      if (rate == null && diff != null && ref) rate = (diff / ref) * 100;
      const now = new Date();
      const q = {
        SymbolID: d.symbol || "WTX&",
        DispCName: d.symbolName || "台指期近一",
        DispEName: d.symbol || "WTX&",
        CLastPrice: last,
        COpenPrice: raw(d.regularMarketOpen),
        CHighPrice: raw(d.regularMarketDayHigh),
        CLowPrice: raw(d.regularMarketDayLow),
        CRefPrice: ref,
        CDiff: diff,
        CDiffRate: rate,
        CTotalVolume: raw(d.volume) != null ? raw(d.volume) : Math.round((raw(d.volumeK) || 0) * 1000),
        CDate: now.getFullYear() + String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0"),
        CTime: String(now.getHours()).padStart(2, "0") + String(now.getMinutes()).padStart(2, "0") + String(now.getSeconds()).padStart(2, "0"),
        inMarket: raw(d.inMarket) != null ? Math.round(raw(d.inMarket) * 1000) : "",
        outMarket: raw(d.outMarket) != null ? Math.round(raw(d.outMarket) * 1000) : "",
      };
      const book = d.orderbook || [];
      for (let i = 0; i < 5; i++) {
        const lvl = book[i] || {};
        q["CBidPrice" + (i + 1)] = raw(lvl.bid);
        q["CBidSize" + (i + 1)] = raw(lvl.bidVol);
        q["CAskPrice" + (i + 1)] = raw(lvl.ask);
        q["CAskSize" + (i + 1)] = raw(lvl.askVol);
      }
      return q;
    }

    function applyLive(rows) {
      const wtx = rows.find((x) => x.symbol === "WTX&") || rows[0];
      if (!wtx) return;
      const q0 = slimYahoo(wtx);
      const liveK = liveSess();
      snap = Object.assign({}, snap || {}, {
        fetchedAt: new Date().toLocaleString("zh-TW", { hour12: false }),
        source: "yahoo via wtx.19850926.xyz",
      });
      // 只覆寫當盤；另一盤 lastBook 不動
      snap[liveK] = q0;
      saveLastBook(liveK, q0);
      const px = n(q0.CLastPrice);
      const vol = n(q0.CTotalVolume) || 0;
      const inn = n(q0.inMarket);
      const outv = n(q0.outMarket);
      recordImb(liveK, inn, outv, Date.now());
      if (px) {
        const pt = {
          t: snap.fetchedAt,
          ts: Date.now(),
          time: q0.CTime,
          px,
          vol,
          in: inn,
          out: outv,
          d: inn != null && outv != null ? outv - inn : null,
        };
        const h = hist[liveK] || [];
        if (
          !h.length ||
          h[h.length - 1].px !== px ||
          h[h.length - 1].time !== pt.time ||
          h[h.length - 1].d !== pt.d
        ) {
          h.push(pt);
          if (h.length > 800) h.splice(0, h.length - 800);
          hist[liveK] = h;
        }
      }
      // 颱風／停市：開盤 3 分鐘後，價+量+時間都不變連續 10 次 → 改探測
      const sig = [px, vol, q0.CTime || ""].join("|");
      const grace = Date.now() - sessionOpenAt() >= 3 * 60 * 1000;
      if (grace && lastSig && sig === lastSig) {
        staleHits++;
      } else if (sig !== lastSig) {
        staleHits = 0;
        probeOnly = false;
      }
      lastSig = sig;
      if (staleHits >= 10) {
        probeOnly = true;
        try {
          localStorage.setItem(
            STALE_KEY,
            JSON.stringify({ date: new Date().toDateString(), sess: liveK, at: Date.now() })
          );
        } catch (e) {}
      }
      live = true;
      bumpLiveBar();
      render();
    }

    async function pollLive() {
      if (document.visibilityState !== "visible" || !marketOpen()) {
        live = false;
        if ($("live")) {
          $("live").className = "live";
          $("live").textContent = "快照";
        }
        return;
      }
      // 探測模式：每 3 分鐘才打一次（颱風／整日無量）
      if (probeOnly) {
        const mark = window.__txfProbeAt || 0;
        if (Date.now() - mark < 3 * 60 * 1000) return;
        window.__txfProbeAt = Date.now();
      }
      try {
        const rows = await fetch(LIVE).then((r) => r.json());
        if (Array.isArray(rows) && rows.length) applyLive(rows);
        // 約每 30 秒從雲端補齊完整當日分鐘柱（多人共用同一 R2）
        const mark = window.__txfImbCloudAt || 0;
        if (Date.now() - mark > 30000) {
          window.__txfImbCloudAt = Date.now();
          loadImbCloud().then(() => {
            if (chartMode === "line") draw();
          });
        }
      } catch (e) {
        live = false;
        if ($("live")) {
          $("live").className = "live";
          $("live").textContent = "快照";
        }
      }
    }

    function stopPoll() {

        liveTimer = null;
      }
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") startPoll();
      else stopPoll();
    });

    window.addEventListener("resize", () => {
      if (miniChart && miniChart.resize) miniChart.resize();
      miniFit36();
      if (kchart && kchart.resize) kchart.resize();
      draw();
    });
    bindLineHold();
    session = liveSess();
    markChips();
    loadLocal1m();
    loadImbBars();
    load();
    loadImbCloud().then(() => {
      if (chartMode === "line") draw();
    });
    loadKline();
    startPoll();
    klineTimer = setInterval(loadKline, 300000);
  </script>
</body>
</html>
