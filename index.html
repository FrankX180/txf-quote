    function slimYahoo(d) {
      const last = raw(d.price);
      const ref = raw(d.regularMarketPreviousClose);
      let diff = raw(d.change);
      if (diff == null && last != null && ref != null) diff = last - ref;
      let rate = null;
      const cp = d.changePercent;
      if (typeof cp === "string" && cp.endsWith("%")) rate = parseFloat(cp);
      if (rate == null && diff != null && ref) rate = (diff / ref) * 100;
      // 優先用奇摩成交時間（收盤後仍是 13:44:xx），勿用本機 wall clock
      let now = new Date();
      const rmt = d.regularMarketTime;
      if (typeof rmt === "string" && rmt) {
        const p = new Date(rmt);
        if (!isNaN(p.getTime())) now = p;
      } else if (typeof rmt === "number" && rmt > 1e9) {
        now = new Date(rmt < 1e12 ? rmt * 1000 : rmt);
      }
      const q = {
        SymbolID: d.symbol || "WTX&",
        DispCName: d.symbolName || "台指期近一",
        DispEName: d.symbol || "WTX&",
        CLastPrice: last,
        // 奇摩 stockList 開高低是混盤，先留空，由 patchQuoteOHLC 寫入當盤真值
        COpenPrice: "",
        CHighPrice: "",
        CLowPrice: "",
        CRefPrice: ref,
        CDiff: diff,
        CDiffRate: rate,
        CTotalVolume: raw(d.volume) != null ? raw(d.volume) : Math.round((raw(d.volumeK) || 0) * 1000),
        CDate: now.getFullYear() + String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0"),
        CTime: String(now.getHours()).padStart(2, "0") + String(now.getMinutes()).padStart(2, "0") + String(now.getSeconds()).padStart(2, "0"),
        inMarket: raw(d.inMarket) != null ? Math.round(raw(d.inMarket) * 1000) : "",
        outMarket: raw(d.outMarket) != null ? Math.round(raw(d.outMarket) * 1000) : "",
      };
      const book = d.orderbook || [];
      for (let i = 0; i < 5; i++) {
        const lvl = book[i] || {};
        q["CBidPrice" + (i + 1)] = raw(lvl.bid);
        q["CBidSize" + (i + 1)] = raw(lvl.bidVol);
        q["CAskPrice" + (i + 1)] = raw(lvl.ask);
        q["CAskSize" + (i + 1)] = raw(lvl.askVol);
      }
      return q;
    }

    function applyLive(rows) {
      const wtx = rows.find((x) => x.symbol === "WTX&") || rows[0];
      if (!wtx) return;
      const q0 = slimYahoo(wtx);
      const liveK = liveSess();
      snap = Object.assign({}, snap || {}, {
        fetchedAt: new Date().toLocaleString("zh-TW", { hour12: false }),
        source: "yahoo via wtx.19850926.xyz",
      });
      // 只覆寫當盤；另一盤 lastBook 不動
      snap[liveK] = q0;
      // lastBook 延後到 patchQuoteOHLC 之後再存
      const px = n(q0.CLastPrice);
      const vol = n(q0.CTotalVolume) || 0;
      const inn = n(q0.inMarket);
      const outv = n(q0.outMarket);
      recordImb(liveK, inn, outv, Date.now());
      if (px) {
        const pt = {
          t: snap.fetchedAt,
          ts: Date.now(),
          time: q0.CTime,
          px,
          vol,
          in: inn,
          out: outv,
          d: inn != null && outv != null ? outv - inn : null,
        };
        const h = hist[liveK] || [];
        if (
          !h.length ||
          h[h.length - 1].px !== px ||
          h[h.length - 1].time !== pt.time ||
          h[h.length - 1].d !== pt.d
        ) {
          h.push(pt);
          if (h.length > 800) h.splice(0, h.length - 800);
          hist[liveK] = h;
        }
      }
      // 颱風／停市：開盤 3 分鐘後，價+量+時間都不變連續 10 次 → 改探測
      const sig = [px, vol, q0.CTime || ""].join("|");
      const grace = Date.now() - sessionOpenAt() >= 3 * 60 * 1000;
      if (grace && lastSig && sig === lastSig) {
        staleHits++;
      } else if (sig !== lastSig) {
        staleHits = 0;
        probeOnly = false;
      }
      lastSig = sig;
      if (staleHits >= 10) {
        probeOnly = true;
        try {
          localStorage.setItem(
            STALE_KEY,
            JSON.stringify({ date: new Date().toDateString(), sess: liveK, at: Date.now() })
          );
        } catch (e) {}
      }
      live = true;
      touchSessTrack(liveK, px);
      bumpLiveBar();
      patchQuoteOHLC(liveK, px);
      // 存 lastBook 時已是修正後開高低
      saveLastBook(liveK, snap[liveK]);
      render();
    }

    async function pollLive() {
      if (document.visibilityState !== "visible") {
        live = false;
        if ($("live")) {
          $("live").className = "live";
          $("live").textContent = "快照";
        }
        return;
      }
      // 休市仍限速拉 Worker（GitHub snapshot 可能停很久；收盤價仍在奇摩）
      if (!marketOpen()) {
        live = false;
        if ($("live")) {
          $("live").className = "live";
          $("live").textContent = "快照";
        }
        const mark = window.__txfClosedPollAt || 0;
        if (Date.now() - mark < 30000) return;
        window.__txfClosedPollAt = Date.now();
        try {
          const rows = await fetch(LIVE).then((r) => r.json());
          if (Array.isArray(rows) && rows.length) {
            applyLive(rows);
            live = false;
            if ($("live")) {
              $("live").className = "live";
              $("live").textContent = "快照";
            }
          }
        } catch (e) {}
        return;
      }
      // 探測模式：每 3 分鐘才打一次（颱風／整日無量）
      if (probeOnly) {
        const mark = window.__txfProbeAt || 0;
        if (Date.now() - mark < 3 * 60 * 1000) return;
        window.__txfProbeAt = Date.now();
      }
      try {
        const rows = await fetch(LIVE).then((r) => r.json());
        if (Array.isArray(rows) && rows.length) applyLive(rows);
        // 約每 30 秒從雲端補齊完整當日分鐘柱（多人共用同一 R2）
        const mark = window.__txfImbCloudAt || 0;
        if (Date.now() - mark > 30000) {
          window.__txfImbCloudAt = Date.now();
          loadImbCloud().then(() => {
            if (chartMode === "line") draw();
          });
        }
      } catch (e) {
        live = false;
        if ($("live")) {
          $("live").className = "live";
          $("live").textContent = "快照";
        }
      }
    }

    async function load() {
      const [s, hn, hd, liveRows] = await Promise.all([
        gh("data/snapshot.json").then((r) => r.json()),
        gh("data/history-night.json").then((r) => (r.ok ? r.json() : [])).catch(() => []),
        gh("data/history-day.json").then((r) => (r.ok ? r.json() : [])).catch(() => []),
        fetch(LIVE)
          .then((r) => r.json())
          .catch(() => null),
      ]);
      if (!live) {
        snap = applyStoredBooks(s);
        hist.night = hn;
        hist.day = hd;
        render();
      } else if (s) {
        // live 已起：只回填另一盤五檔，不蓋當盤；污染則用本機 lastBook
        const sk = liveSess();
        const other = sk === "day" ? "night" : "day";
        snap = snap || {};
        if (!snap[other] && s[other]) snap[other] = Object.assign({}, s[other]);
        const fixed = applyStoredBooks({
          day: snap.day || s.day,
          night: snap.night || s.night,
        });
        if (fixed[other]) snap[other] = fixed[other];
      }
      // 開頁必打 Worker：snapshot 可能停在中午；收盤後也要最新收
      if (Array.isArray(liveRows) && liveRows.length) {
        applyLive(liveRows);
        if (!marketOpen()) {
          live = false;
          if ($("live")) {
            $("live").className = "live";
            $("live").textContent = "快照";
          }
        }
      }
    }

    function setSession(s) {
      session = s === "day" ? "day" : "night";
      if (session === "day") save1m();
      render();
    }
    $("sumline").onclick = (e) => {
      if (e.target.id === "sessToggle" || e.target.closest("#sessToggle")) {
        setSession(session === "day" ? "night" : "day");
      }
    };
    function markChips() {
      const kOn = chartMode === "k";
      const btnK = $("btnKMode");
      if (btnK) btnK.classList.toggle("on", kOn);
      const lg = $("lineGroup");
      const kg = $("kGroup");
      if (lg) lg.hidden = kOn;
      if (kg) kg.hidden = !kOn;
      document.querySelectorAll(".chip[data-k]").forEach((b) => {
        b.classList.toggle("on", kOn && b.getAttribute("data-k") === kInt);
      });
      document.querySelectorAll(".chip[data-line]").forEach((b) => {
        b.classList.toggle("on", !kOn && Number(b.getAttribute("data-line")) === daySpan);
      });
    }

    const btnKMode = $("btnKMode");
    if (btnKMode) {
      btnKMode.onclick = () => {
        if (chartMode === "k") {
          chartMode = "line";
        } else {
          chartMode = "k";
          if (!kInt) kInt = "1";
        }
        markChips();
        draw();
      };
    }

    document.querySelectorAll(".chip[data-k]").forEach((btn) => {
      btn.onclick = () => {
        chartMode = "k";
        kInt = btn.getAttribute("data-k");
        markChips();
        draw();
      };
    });
    document.querySelectorAll(".chip[data-line]").forEach((btn) => {
      btn.onclick = () => {
        chartMode = "line";
        daySpan = Number(btn.getAttribute("data-line"));
        markChips();
        draw();
      };
    });

    // Worker/Yahoo chart 1m → night_1m / day_1m（與 fetch_minute 相同盤別規則）
    function barsFromYahooChart(chart) {
      const tsList = (chart && chart.timestamp) || [];
      const q0 = (((chart && chart.indicators) || {}).quote || [{}])[0] || {};
      const opens = q0.open || [];
      const highs = q0.high || [];
      const lows = q0.low || [];
      const closes = q0.close || [];
      const vols = q0.volume || [];
      const night = [];
      const day = [];
      for (let i = 0; i < tsList.length; i++) {
        const c = closes[i];
        if (c == null) continue;
        const tsSec = +tsList[i];
        const ts = tsSec < 1e12 ? tsSec * 1000 : tsSec;
        const d = new Date(ts);
        const hm = d.getHours() * 100 + d.getMinutes();
        let sess = null;
        let sdate = null;
        if (hm >= 1500 || hm < 500) {
          const d0 = new Date(d.getTime());
          if (hm < 500) d0.setDate(d0.getDate() - 1);
          sdate =
            d0.getFullYear() +
            String(d0.getMonth() + 1).padStart(2, "0") +
            String(d0.getDate()).padStart(2, "0");
          sess = "night";
        } else if (hm >= 845 && hm <= 1345) {
          sdate =
            d.getFullYear() +
            String(d.getMonth() + 1).padStart(2, "0") +
            String(d.getDate()).padStart(2, "0");
          sess = "day";
        } else continue;
        const o = opens[i] != null ? +opens[i] : +c;
        const h = highs[i] != null ? +highs[i] : +c;
        const l = lows[i] != null ? +lows[i] : +c;
        const v = vols[i] != null ? Math.round(+vols[i] * 1000) : 0;
        const row = {
          timestamp: ts,
          open: o, high: h, low: l, close: +c,
          volume: v, date: sdate, session: sess,
        };
        if (sess === "night") night.push(row);
        else day.push(row);
      }
      return { night, day };
    }

    async function loadKline() {
      try {
        const pack = await gh("data/kline-daily.json").then((r) => r.json());
        dailyPack.night = pack.night || [];
        dailyPack.day = pack.day || [];
        dailyPack.daily = pack.daily || pack.night || [];
        dailyPack.week = pack.week || [];
      } catch (e) {}
      try {
        const m = await gh("data/kline-minute.json").then((r) => r.json());
        ["night_1m","day_1m","night_5m","day_5m","night_15m","day_15m"].forEach((k) => {
          minutePack[k] = mergeBarLists(minutePack[k], m[k] || []);
        });
        loadLocal1m();
        save1m();
        if (!minutePack.night_1m.length && (m.night || []).length) {
          minutePack.night_1m = m.night;
          minutePack.day_1m = m.day || [];
        }
        // GitHub 可能落後：每 5 分併 Worker 即時 1m（非每 5 秒）
        try {
          const y = await fetch(LIVE + "?kind=1m", { cache: "no-cache" }).then((r) =>
            r.ok ? r.json() : null
          );
          if (y && y.timestamp && y.timestamp.length) {
            const parts = barsFromYahooChart(y);
            minutePack.night_1m = mergeBarLists(minutePack.night_1m, parts.night);
            minutePack.day_1m = mergeBarLists(minutePack.day_1m, parts.day);
            save1m();
          }
        } catch (e2) {}
      } catch (e) {}
      try {
        uncover = await gh("data/uncovered.json").then((r) => r.json());
      } catch (e) {
        uncover = { inst: [], top: [], date: "" };
      }
      // 1 分到齊後寫回當盤開高低（震幅／摘要用）
      if (snap) {
        patchQuoteOHLC("day", n(snap.day && snap.day.CLastPrice));
        patchQuoteOHLC("night", n(snap.night && snap.night.CLastPrice));
      }
      renderOi();
      drawMiniK();
      render();
    }

    function visitorSid() {
      try {
        let s = localStorage.getItem(SID_KEY);
        if (s && /^[a-zA-Z0-9_-]{8,64}$/.test(s)) return s;
        s =
          "t" +
          Date.now().toString(36) +
          Math.random().toString(36).slice(2, 10);
        localStorage.setItem(SID_KEY, s);
        return s;
      } catch (e) {
        return "t" + Date.now().toString(36) + "x";
      }
    }
    function paintTraffic(st) {
      if (st) lastTraffic = st;
      const el = $("traffic");
      const s = lastTraffic;
      if (!el || !s) return;
      const mode = TRAFFIC_MODES[trafficMode] || "online";
      if (mode === "month") {
        const mPv = s.monthPv != null ? s.monthPv : "—";
        const mUv = s.monthUv != null ? s.monthUv : "—";
        el.textContent = "本月 " + mPv + " 次 / " + mUv + " 人";
      } else if (mode === "total") {
        const tPv = s.totalPv != null ? s.totalPv : "—";
        const tUv = s.totalUv != null ? s.totalUv : "—";
        el.textContent = "累計 " + tPv + " 次 / " + tUv + " 人";
      } else {
        const on = s.online != null ? s.online : "—";
        const uv = s.uv != null ? s.uv : "—";
        const peak = s.peak != null ? s.peak : "—";
        el.textContent = "在線" + on + "，今天" + uv + "/峰值" + peak;
      }
    }
    async function trafficPing(isHit) {
      try {
        const sid = visitorSid();
        const q =
          LIVE +
          "?kind=ping&sid=" +
          encodeURIComponent(sid) +
          (isHit ? "&hit=1" : "");
        const st = await fetch(q, { cache: "no-store" }).then((r) =>
          r.ok ? r.json() : null
        );
        if (st && st.ok) paintTraffic(st);
      } catch (e) {}
    }
    function startTraffic() {
      const el = $("traffic");
      if (el) {
        el.addEventListener("click", () => {
          trafficMode = (trafficMode + 1) % TRAFFIC_MODES.length;
          paintTraffic(null);
        });
      }
      trafficPing(true);
      setInterval(() => {
        if (document.visibilityState === "visible") trafficPing(false);
      }, 30000);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") trafficPing(false);
      });
    }
    function startPoll() {
      if (liveTimer) return;
      try {
        const st = JSON.parse(localStorage.getItem(STALE_KEY) || "null");
        if (st && st.date === new Date().toDateString() && st.sess === liveSess()) {
          probeOnly = true;
          staleHits = 10;
        }
      } catch (e) {}
      pollLive();
      liveTimer = setInterval(pollLive, 5000);
    }
    function stopPoll() {
      if (liveTimer) {
        clearInterval(liveTimer);
        liveTimer = null;
      }
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") startPoll();
      else stopPoll();
    });

    window.addEventListener("resize", () => {
      if (miniChart && miniChart.resize) miniChart.resize();
      miniFit36();
      if (kchart && kchart.resize) kchart.resize();
      draw();
    });
    bindLineHold();
    (function bindImbSideToggle() {
      function flip() {
        imbOutLeft = !imbOutLeft;
        try {
          localStorage.setItem(IMB_SIDE_KEY, imbOutLeft ? "out-left" : "in-left");
        } catch (e) {}
        render();
      }
      const w = $("barWrap");
      const r = $("imbRow");
      if (w) w.addEventListener("click", flip);
      if (r) r.addEventListener("click", flip);
    })();
    session = liveSess();
    markChips();
    loadLocal1m();
    loadImbBars();
    load();
    loadImbCloud().then(() => {
      if (chartMode === "line") draw();
    });
    loadKline();
    startPoll();
    startTraffic();
    klineTimer = setInterval(loadKline, 300000);
  </script>
