    function slimYahoo(d) {
      const last = raw(d.price);
      const ref = raw(d.regularMarketPreviousClose);
      let diff = raw(d.change);
      if (diff == null && last != null && ref != null) diff = last - ref;
      let rate = null;
      const cp = d.changePercent;
      if (typeof cp === "string" && cp.endsWith("%")) rate = parseFloat(cp);
      if (rate == null && diff != null && ref) rate = (diff / ref) * 100;
      // 優先用奇摩成交時間（收盤後仍是 13:44:xx），勿用本機 wall clock
      let now = new Date();
      const rmt = d.regularMarketTime;
      if (typeof rmt === "string" && rmt) {
        const p = new Date(rmt);
        if (!isNaN(p.getTime())) now = p;
      } else if (typeof rmt === "number" && rmt > 1e9) {
        now = new Date(rmt < 1e12 ? rmt * 1000 : rmt);
      }
      const q = {
        SymbolID: d.symbol || "WTX&",
        DispCName: d.symbolName || "台指期近一",
        DispEName: d.symbol || "WTX&",
        CLastPrice: last,
        // 奇摩 stockList 開高低是混盤，先留空，由 patchQuoteOHLC 寫入當盤真值
        COpenPrice: "",
        CHighPrice: "",
        CLowPrice: "",
        CRefPrice: ref,
        CDiff: diff,
        CDiffRate: rate,
        CTotalVolume: raw(d.volume) != null ? raw(d.volume) : Math.round((raw(d.volumeK) || 0) * 1000),
        CDate: now.getFullYear() + String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0"),
        CTime: String(now.getHours()).padStart(2, "0") + String(now.getMinutes()).padStart(2, "0") + String(now.getSeconds()).padStart(2, "0"),
        inMarket: raw(d.inMarket) != null ? Math.round(raw(d.inMarket) * 1000) : "",
        outMarket: raw(d.outMarket) != null ? Math.round(raw(d.outMarket) * 1000) : "",
      };
      const book = d.orderbook || [];
      for (let i = 0; i < 5; i++) {
        const lvl = book[i] || {};
        q["CBidPrice" + (i + 1)] = raw(lvl.bid);
        q["CBidSize" + (i + 1)] = raw(lvl.bidVol);
        q["CAskPrice" + (i + 1)] = raw(lvl.ask);
        q["CAskSize" + (i + 1)] = raw(lvl.askVol);
      }
      return q;
    }

    function applyLive(rows) {
      const wtx = rows.find((x) => x.symbol === "WTX&") || rows[0];
      if (!wtx) return;
      const q0 = slimYahoo(wtx);
      const nowTs = Date.now();
      const tradeSk = sessKindAt(nowTs); // day / night / closed（含周末）
      const bookSk = bookSessNow(); // 08:30 起可更新日盤五檔
      const freezeSk = liveSess();
      snap = Object.assign({}, snap || {}, {
        fetchedAt: new Date().toLocaleString("zh-TW", { hour12: false }),
        source: "yahoo via wtx.19850926.xyz",
      });
      const px = n(q0.CLastPrice);
      const vol = n(q0.CTotalVolume) || 0;
      const inn = n(q0.inMarket);
      const outv = n(q0.outMarket);
      let liveK = freezeSk;

      if (tradeSk === "day" || tradeSk === "night") {
        // 正式盤中：整包覆寫當盤（含五檔／內外盤）
        liveK = tradeSk;
        snap[tradeSk] = q0;
        recordImb(tradeSk, inn, outv, nowTs);
        if (px) {
          const pt = {
            t: snap.fetchedAt,
            ts: nowTs,
            time: q0.CTime,
            px,
            vol,
            in: inn,
            out: outv,
            d: inn != null && outv != null ? outv - inn : null,
          };
          const h = hist[tradeSk] || [];
          if (
            !h.length ||
            h[h.length - 1].px !== px ||
            h[h.length - 1].time !== pt.time ||
            h[h.length - 1].d !== pt.d
          ) {
            h.push(pt);
            if (h.length > 800) h.splice(0, h.length - 800);
            hist[tradeSk] = h;
          }
        }
        // 颱風／停市：開盤 3 分鐘後，價+量+時間都不變連續 10 次 → 改探測
        const sig = [px, vol, q0.CTime || ""].join("|");
        const grace = Date.now() - sessionOpenAt() >= 3 * 60 * 1000;
        if (grace && lastSig && sig === lastSig) {
          staleHits++;
        } else if (sig !== lastSig) {
          staleHits = 0;
          probeOnly = false;
        }
        lastSig = sig;
        if (staleHits >= 10) {

      } else if (bookSk) {

        liveK = bookSk;

        ["CLastPrice", "CRefPrice", "CDiff", "CDiffRate", "CTotalVolume", "CDate", "CTime", "inMarket", "outMarket"].forEach((k) => {
          if (q0[k] != null && q0[k] !== "") prev[k] = q0[k];
        });
        for (let i = 1; i <= 5; i++) {
          ["CBidPrice", "CBidSize", "CAskPrice", "CAskSize"].forEach((k) => {
            const key = k + i;

          });
        }
        snap[bookSk] = prev;
        patchQuoteOHLC(bookSk, px);
        saveLastBook(bookSk, snap[bookSk]);
      } else {
        // 休市／周末：只動凍結盤最新價；昨收／漲跌鎖定（奇摩收盤後 previousClose 會滾成夜盤基準）
        liveK = freezeSk;

        if (q0.CLastPrice != null && q0.CLastPrice !== "") prev.CLastPrice = q0.CLastPrice;
        healRefPrice(prev);

    // Worker/Yahoo chart 1m → night_1m / day_1m（與 fetch_minute 相同盤別規則）
    function barsFromYahooChart(chart) {
      const tsList = (chart && chart.timestamp) || [];
      const q0 = (((chart && chart.indicators) || {}).quote || [{}])[0] || {};
      const opens = q0.open || [];
      const highs = q0.high || [];
      const lows = q0.low || [];
      const closes = q0.close || [];
      const vols = q0.volume || [];
      const night = [];
      const day = [];
      for (let i = 0; i < tsList.length; i++) {
        const c = closes[i];
        if (c == null) continue;
        const tsSec = +tsList[i];
        const ts = tsSec < 1e12 ? tsSec * 1000 : tsSec;
        const d = new Date(ts);
        const hm = d.getHours() * 100 + d.getMinutes();
        let sess = null;
        let sdate = null;
        if (hm >= 1500 || hm < 500) {
          const d0 = new Date(d.getTime());
          if (hm < 500) d0.setDate(d0.getDate() - 1);
          sdate =
            d0.getFullYear() +
            String(d0.getMonth() + 1).padStart(2, "0") +
            String(d0.getDate()).padStart(2, "0");
          sess = "night";
        } else if (hm >= 845 && hm <= 1345) {
          sdate =
            d.getFullYear() +
            String(d.getMonth() + 1).padStart(2, "0") +
            String(d.getDate()).padStart(2, "0");
          sess = "day";
        } else continue;
        const o = opens[i] != null ? +opens[i] : +c;
        const h = highs[i] != null ? +highs[i] : +c;
        const l = lows[i] != null ? +lows[i] : +c;
        const v = vols[i] != null ? Math.round(+vols[i] * 1000) : 0;
        const row = {
          timestamp: ts,
          open: o, high: h, low: l, close: +c,
          volume: v, date: sdate, session: sess,
          source: "chart",
        };
        if (sess === "night") night.push(row);
        else day.push(row);
      }
      return { night, day };
    }

    // 當盤 1 分是否已從開盤附近接到現在（奇摩常缺 08:45 第一根 → 容許 3 分鐘）
    function live1mGap() {
      if (!marketOpen()) return false;
      const d = new Date();
      const hm = d.getHours() * 100 + d.getMinutes();
      // 日盤盤前 08:30–08:44：尚未正式成交，不催 1 分
      if (hm >= 830 && hm < 845) return false;
      const sk = liveSess();
      if (sk !== "day" && sk !== "night") return false;
      if (sessKindAt(Date.now()) !== sk) return false;
      const openMs = sessionOpenAt();
      const dstr = barDateAt(Math.max(openMs, Date.now() - 1000));
      const rows = (minutePack[sk + "_1m"] || [])
        .filter((b) => b && dateKey(b.date) === dstr)
        .slice()
        .sort((a, b) => a.timestamp - b.timestamp);
      if (!rows.length) return true;
      const first = rows[0].timestamp;
      // 第一根晚於開盤 +3 分 → 左端會空（對上內外盤從 08:45 就有柱）
      if (first > openMs + 3 * 60000) return true;
      const last = rows[rows.length - 1].timestamp;
      const nowSlot = Math.floor(Date.now() / 60000) * 60000;
      let endMs = nowSlot;
      if (sk === "day") {
        const end = new Date(openMs);
        end.setHours(13, 45, 0, 0);
        endMs = Math.min(nowSlot, end.getTime());
      } else {
        const end = new Date(openMs);
        end.setDate(end.getDate() + 1);
        end.setHours(5, 0, 0, 0);
        endMs = Math.min(nowSlot, end.getTime());
      }
      if (endMs - last > 3 * 60000) return true;
      return false;
    }

    async function ensureLive1m(force) {
      if (live1mBusy) return false;
      if (document.visibilityState !== "visible") return false;
      if (!force && !live1mGap()) return false;

      let ok = false;
      try {
        ok = await pullLive1m();

          if (snap) {
            patchQuoteOHLC("day", n(snap.day && snap.day.CLastPrice));
            patchQuoteOHLC("night", n(snap.night && snap.night.CLastPrice));
          }
          draw();
        }
      } finally {
        live1mBusy = false;
      }
      return ok;
    }

        dailyPack.day = pack.day || [];
        dailyPack.daily = pack.daily || pack.night || [];
        dailyPack.week = pack.week || [];
        dailyPack.month = pack.month || [];
      } catch (e) {}
      try {
        const m = await gh("data/kline-minute.json").then((r) => r.json());
        ["night_1m","day_1m","night_5m","day_5m","night_15m","day_15m"].forEach((k) => {
          minutePack[k] = mergeBarLists(minutePack[k], m[k] || []);
        });
        loadLocal1m();
        save1m();
        if (!minutePack.night_1m.length && (m.night || []).length) {
          minutePack.night_1m = m.night;
          minutePack.day_1m = m.day || [];
        }
        // GitHub 可能落後：併 Worker 即時 1m（開盤另有 startLive1mGuard 缺段重試）
        await pullLive1m();
      } catch (e) {}
      try {
        uncover = await gh("data/uncovered.json").then((r) => r.json());
      } catch (e) {
        uncover = { inst: [], top: [], date: "", today: null, history: [] };
      }
      try {
        let mx = null;
        let mxGh = null;
        try {
          mx = await fetch(LIVE + "?kind=tmf", { cache: "no-cache" }).then((r) =>
            r.ok ? r.json() : null
          );
        } catch (e) {
          mx = null;
        }
        try {
          mxGh = await gh("data/tmf_retail.json").then((r) => r.json());
        } catch (e) {
          mxGh = null;
        }
        // Worker 常只有近段；與 GitHub 全史（微台上市以來）合併，重疊日以 Worker 為準
        const map = {};
        function eat(pack) {
          (pack && pack.series ? pack.series : []).forEach(function (r) {
            if (!r || r.date == null) return;
            const v = r.ratio != null ? Number(r.ratio) : (r.retail != null ? Number(r.retail) : null);
            if (v == null || !isFinite(v)) return;
            map[String(r.date)] = v;
          });
        }
        eat(mxGh);
        eat(mx);
        mtxRetailByDate = map;
        mtxRetailDate = mx && mx.date
          ? String(mx.date)
          : mxGh && mxGh.date ? String(mxGh.date) : "";
      } catch (e) {
        mtxRetailByDate = {};
      }
      // 1 分到齊後寫回當盤開高低（震幅／摘要用）
      if (snap) {
        patchQuoteOHLC("day", n(snap.day && snap.day.CLastPrice));
        patchQuoteOHLC("night", n(snap.night && snap.night.CLastPrice));
      }
      renderOi();
      drawMiniK();
      render();
      if (chartMode === "k") draw();
    }

    function visitorSid() {
      try {
        let s = localStorage.getItem(SID_KEY);
        if (s && /^[a-zA-Z0-9_-]{8,64}$/.test(s)) return s;
        s =
          "t" +
          Date.now().toString(36) +
          Math.random().toString(36).slice(2, 10);
        localStorage.setItem(SID_KEY, s);
        return s;
      } catch (e) {
        return "t" + Date.now().toString(36) + "x";
      }
    }
    function paintTraffic(st) {
      if (st) lastTraffic = st;
      const el = $("traffic");
      const s = lastTraffic;
      if (!el || !s) return;
      const mode = TRAFFIC_MODES[trafficMode] || "online";
      if (mode === "month") {
        const mPv = s.monthPv != null ? s.monthPv : "—";
        const mUv = s.monthUv != null ? s.monthUv : "—";
        el.textContent = "本月 " + mPv + " 次 / " + mUv + " 人";
      } else if (mode === "total") {
        const tPv = s.totalPv != null ? s.totalPv : "—";
        const tUv = s.totalUv != null ? s.totalUv : "—";
        el.textContent = "累計 " + tPv + " 次 / " + tUv + " 人";
      } else {
        const on = s.online != null ? s.online : "—";
        const uv = s.uv != null ? s.uv : "—";
        const peak = s.peak != null ? s.peak : "—";
        el.textContent = "在線" + on + "，今天" + uv + "/峰值" + peak;
      }
    }
    async function trafficPing(isHit) {
      try {
        const sid = visitorSid();
        const q =
          LIVE +
          "?kind=ping&sid=" +
          encodeURIComponent(sid) +
          (isHit ? "&hit=1" : "");
        const st = await fetch(q, { cache: "no-store" }).then((r) =>
          r.ok ? r.json() : null
        );
        if (st && st.ok) paintTraffic(st);
      } catch (e) {}
    }
    function startTraffic() {
      const el = $("traffic");
      if (el) {
        el.addEventListener("click", () => {
          trafficMode = (trafficMode + 1) % TRAFFIC_MODES.length;
          paintTraffic(null);
        });
      }
      trafficPing(true);
      setInterval(() => {
        if (document.visibilityState === "visible") trafficPing(false);
      }, 30000);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") trafficPing(false);
      });
    }
    function startPoll() {
      if (liveTimer) return;
      try {
        const st = JSON.parse(localStorage.getItem(STALE_KEY) || "null");
        if (st && st.date === new Date().toDateString() && st.sess === liveSess()) {
          probeOnly = true;
          staleHits = 10;
        }
      } catch (e) {}
      pollLive();
      liveTimer = setInterval(pollLive, 5000);
    }
    function stopPoll() {
      if (liveTimer) {
        clearInterval(liveTimer);
        liveTimer = null;
      }
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        startPoll();
        ensureLive1m(true);
      } else stopPoll();
    });

    window.addEventListener("resize", () => {
      if (miniChart && miniChart.resize) miniChart.resize();
      miniFit36();
      if (kchart && kchart.resize) kchart.resize();
      draw();
    });
    bindLineHold();
    (function bindImbSideToggle() {
      function flip() {
        imbOutLeft = !imbOutLeft;
        try {
          localStorage.setItem(IMB_SIDE_KEY, imbOutLeft ? "out-left" : "in-left");
        } catch (e) {}
        render();
      }
      const w = $("barWrap");
      const r = $("imbRow");
      if (w) w.addEventListener("click", flip);
      if (r) r.addEventListener("click", flip);
    })();
    session = liveSess();
    markChips();
    (function purgeOldMinCache() {
      try {
        const VER = "1.85";
        if (localStorage.getItem("txfMinVer") !== VER) {
          localStorage.removeItem("txfMin");
          localStorage.removeItem("txf1m");
          localStorage.setItem("txfMinVer", VER);
        }
      } catch (e) {}
    })();
    loadLocal1m();
    loadImbBars();
    loadNightImbBase();
    load();
    loadImbCloud().then(async () => {
      if (sessKey() === "day") await refreshNightImbBase();
      if (chartMode === "line") draw();
    });
    loadKline();
    startLive1mGuard();
    startPoll();
    startTraffic();
    klineTimer = setInterval(loadKline, 300000);
  </script>
</body>
</html>
