<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台指期 TXF — 即時看盤</title>
  <style>
    :root {
      --up: #d32f2f;
      --dn: #1b8a3e;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f3f4f6;
      --card: #fff;
    }
    * { box-sizing: border-box; }
    html {
      background: var(--bg);
      overflow-x: hidden;
    }
    body {
      width: 650px;
      max-width: 650px;
      margin: 0 auto;
      overflow-x: hidden;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: #111827;
    }
    @media (max-width: 650px) {
      body { width: 100%; max-width: 100%; }
    }
    .wrap {
      width: 100%;
      max-width: 650px;
      min-width: 0;
      margin: 10px auto;
      padding: 0 12px;
      overflow: hidden;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 10px;
      min-width: 0;
      overflow: hidden;
    }
    .chipline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
    .chip-group { display: contents; }
    .chip-group[hidden] { display: none !important; }
    .rowlab { font-size: 13px; font-weight: 800; color: #111; min-width: 2.4em; }
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 10px;
      align-items: start;
    }
    .hero-head { min-width: 0; }
    .hero-mid { min-width: 0; }
    .title-row { display: flex; align-items: center; gap: 8px; }
    .title { font-size: 20px; font-weight: 800; }
    .pxrow { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
    .pxmeta { padding-bottom: 0; }
    #minik {
      position: relative;
      width: 100%;
      height: 118px;
    }
    .px { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin: 2px 0 0; }
    .sub { font-size: 13px; color: var(--muted); }
    .sessico {
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; width: 56px; cursor: pointer;
      font-size: 24px; line-height: 1; user-select: none;
    }
    .sumtxt { flex: 1; min-width: 0; }
    .grid {
      display: block;
      min-width: 0;
    }
    .side, .side table, .side .sub, .side .oi, .side .bar-labs {
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    .side { display: block; margin-top: 12px; }
    .side-top {
      display: block;
    }
    .side-oi {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .imbrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 8px 0 0;
    }
    .imb {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
    }
    .imb-l, .imb-r {
      min-width: 4.2em;
      font-size: 13px;
      font-weight: 800;
    }
    .imb-l { text-align: left; }
    .imb-r { text-align: right; }
    .meta {
      display: flex;
      align-items: center;
      gap: 0;
      font-size: 13px;
      line-height: 1.7;
      color: #374151;
    }
    canvas { width: 100%; height: 320px; display: block; touch-action: none; }
    .chips { margin: 4px 0 8px; }
    .chip, .mode {
      background: #f3f4f6; border: 0; border-radius: 4px; padding: 4px 10px;
      font-size: 13px; cursor: pointer; font-weight: 600; color: #374151;
    }
    .chip.on, .mode.on { background: #b91c1c; color: #fff; }
    #khost { width: 100%; height: 320px; display: none; }
    table.q { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.q td { padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
    table.q td:nth-child(2), table.q td:nth-child(4) { text-align: right; font-variant-numeric: tabular-nums; }
    table.q td:nth-child(2) { padding-right: 8px; }
    table.q td:nth-child(3) { padding-left: 8px; }
    .oi { margin-top: 0; font-size: 13px; }
    .oi h4 { margin: 0 0 4px; font-size: 13px; }
    .oi table { width: 100%; border-collapse: collapse; }
    .oi td, .oi th { padding: 3px 2px; border-bottom: 1px solid #f3f4f6; text-align: right; font-variant-numeric: tabular-nums; }
    .oi tr.tot td { border-top: 1px solid #6b7280; }
    .oi td:first-child, .oi th:first-child { text-align: left; color: #6b7280; }
    table.q td.lab { color: #6b7280; }
    .ob { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 0; table-layout: fixed; font-weight: 700; }
    .ob col.c-qty { width: 18px; }
    .ob col.c-bar { width: auto; }
    .ob col.c-px { width: 58px; }
    .ob td { padding: 2px 3px; font-variant-numeric: tabular-nums; }
    .ob .bid { color: var(--up); }
    .ob .ask { color: var(--dn); }
    .ob .lab.bid { color: var(--up); text-align: left; }
    .ob .lab.ask { color: var(--dn); text-align: right; }
    .ob .qty.bid { text-align: left; }
    .ob .qty.ask { text-align: right; }
    .ob .bar-bid { text-align: right; }
    .ob .bar-ask { text-align: left; }
    .ob .pxb { color: var(--up); text-align: right; white-space: nowrap; font-size: 14px; font-weight: 700; }
    .ob .pxa { color: var(--dn); text-align: left; white-space: nowrap; font-size: 14px; font-weight: 700; }
    .ob .rng { text-align: right; font-size: 12px; font-weight: 400; color: #374151; white-space: nowrap; }
    .bar-wrap {
      position: relative;
      display: flex;
      height: 22px;
      border-radius: 4px;
      overflow: hidden;
      margin: 4px 0 2px;
      background: #eee;
    }
    .bar-wrap::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      border-left: 2px dashed #fff;
      transform: translateX(-1px);
      pointer-events: none;
      z-index: 2;
    }
    .bar-in { background: var(--dn); }
    .bar-out { background: var(--up); }
    .bar-wrap { cursor: pointer; user-select: none; }
    .bar-wrap:active { opacity: 0.92; }
    .imbrow { cursor: pointer; user-select: none; }
    .bar-labs {
      position: absolute; inset: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 8px; font-size: 14px; font-weight: 700; color: #fff;
      pointer-events: none;
    }
    .up { color: var(--up); }
    .dn { color: var(--dn); }
    .flat { color: #111; }
    .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
    .live { font-size: 11px; margin-left: 8px; color: #9ca3af; }
    .live.on { color: #16a34a; }
    .szbar { display: block; height: 14px; background: var(--dn); max-width: 100%; }
    .szbar.r { background: var(--up); margin-left: auto; }
    .foot {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 0 2px 8px;
    }
    .ver {
      font-size: 11px;
      color: #9ca3af;
      user-select: none;
    }
    .foot-left {
      flex: 1;
      text-align: left;
      cursor: pointer;
    }
    .foot-mid {
      flex: 0 0 auto;
      text-align: center;
    }
    .foot-right {
      flex: 1;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="hero" id="hero">
        <div class="hero-head">
          <div class="title-row">
            <div class="title" id="name">台指期</div>
            <span class="live" id="live">未連線</span>
          </div>
          <div class="pxrow">
            <div class="px flat" id="last">—</div>
            <div class="pxmeta">
              <div class="sub" id="chgline"></div>
              <div class="sub" id="stamp">載入中…</div>
            </div>
          </div>
        </div>
        <div class="hero-mid">
          <div id="minik"></div>
        </div>
      </div>
    </div>

    <div class="card board">
      <div class="grid">
        <div>
          <div class="chips">
            <div class="chipline" id="chipRow">
              <button class="chip" id="btnKMode" type="button" title="切換 K 線／走勢">Ｋ線</button>
              <span class="chip-group" id="lineGroup">
                <button class="chip on" data-line="0" type="button">當日</button>
                <button class="chip" data-line="2" type="button">２日</button>
                <button class="chip" data-line="3" type="button">３日</button>
                <button class="chip" data-line="4" type="button">４日</button>
                <button class="chip" data-line="5" type="button">５日</button>
              </span>
              <span class="chip-group" id="kGroup" hidden>
                <button class="chip" data-k="1" type="button">１分</button>
                <button class="chip" data-k="5" type="button">５分</button>
                <button class="chip" data-k="15" type="button">１５</button>
                <button class="chip" data-k="30" type="button">３０</button>
                <button class="chip" data-k="d" type="button">日Ｋ</button>
                <button class="chip" data-k="w" type="button">週Ｋ</button>
              </span>
            </div>
          </div>
          <div class="meta" id="sumline"></div>
          <canvas id="chart" width="720" height="280"></canvas>
          <div id="khost"></div>
        </div>
        <div class="side">
          <div class="side-top">
            <div>
              <table class="ob" id="ob"></table>
              <div class="bar-wrap" id="barWrap" title="點一下：內外盤左右對調">
                <div id="barL" class="bar-out" style="width:50%"></div>
                <div id="barR" class="bar-in" style="width:50%"></div>
                <div class="bar-labs">
                  <span id="txtL">外盤 —</span>
                  <span id="txtR">內盤 —</span>
                </div>
              </div>
              <div class="imbrow" id="imbRow" title="點一下：內外盤左右對調">
                <span class="imb-l up" id="pctL">—</span>
                <div class="imb" id="imb"></div>
                <span class="imb-r dn" id="pctR">—</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="side-oi">
        <div class="oi" id="oi-inst"></div>
        <div class="oi" id="oi-top"></div>
      </div>
    </div>
    <div class="foot">
      <div class="ver foot-left" id="traffic" title="點一下切換：在線 → 本月 → 累計">在線—，今天—/峰值—</div>
      <div class="ver foot-mid">1.15</div>
      <div class="ver foot-right">浪大</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/klinecharts@9/dist/umd/klinecharts.min.js"></script>
  <script>
    let session = "night";
    let snap = null;
    let hist = { night: [], day: [] };
    let live = false;
    let daySpan = 0;
    let chartMode = "line";
    let kInt = "1";
    let dailyPack = { night: [], day: [], daily: [], week: [] };
    let uncover = { inst: [], top: [], date: "" };
    let minutePack = {
      night_1m: [], day_1m: [],
      night_5m: [], day_5m: [],
      night_15m: [], day_15m: [],
    };
    let kchart = null;
    let miniChart = null;
    let hoverIdx = null;
    let holding = false;
    let holdTimer = null;
    let lineHit = null;
    let lastTot = null;
    let liveTimer = null;
    let klineTimer = null;
    let staleHits = 0;
    let probeOnly = false;
    let lastSig = "";
    const LIVE = "https://wtx.19850926.xyz/";
    const LB_KEY = "txfLastBook";
    const STALE_KEY = "txfStalePause";
    const IMB_KEY = "txfImbMin";
    const IMB_SIDE_KEY = "txfImbSide";
    const SID_KEY = "txfSid";
    const TRAFFIC_MODES = ["online", "month", "total"];
    let trafficMode = 0;
    let lastTraffic = null;
    // true＝左外盤右內盤（預設）；false＝左內盤右外盤
    let imbOutLeft = true;
    try {
      const s = localStorage.getItem(IMB_SIDE_KEY);
      if (s === "in-left") imbOutLeft = false;
      else if (s === "out-left") imbOutLeft = true;
    } catch (e) {}
    // 每分鐘 1 根：該分鐘內最後一次 5 秒的 外盤-內盤
    let imbBars = { night: [], day: [] };
    // 當盤開高低追蹤（tick）；不依賴奇摩 stockList 的混盤 OHLC
    let sessTrack = { day: null, night: null };

    const $ = (id) => document.getElementById(id);
    function dateKey(d) {
      if (d == null || d === "") return "";
      return String(d).replace(/-/g, "").slice(0, 8);
    }
    function ymdDash(d) {
      const s = dateKey(d);
      if (s.length < 8) return "";
      return s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8);
    }

    function raw(v) {
      if (v && typeof v === "object") v = v.raw;
      return n(v);
    }

    function n(v) {
      if (v === "" || v == null) return null;
      const x = Number(String(v).replace(/,/g, ""));
      return Number.isFinite(x) ? x : null;
    }
    function fmt(v, d = 0) {
      if (v == null || v === "") return "—";
      const x = Number(v);
      if (!Number.isFinite(x)) return String(v);
      return x.toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    function fmtPlain(v) {
      if (v == null || v === "") return "—";
      const x = Number(v);
      if (!Number.isFinite(x)) return String(v);
      return String(Math.round(x));
    }
    function cls(diff) {
      if (diff == null || diff === 0) return "flat";
      return diff > 0 ? "up" : "dn";
    }
    function arrow(diff) {
      if (diff == null || diff === 0) return "";
      return diff > 0 ? "▲" : "▼";
    }

    function q() {
      if (!snap) return null;
      if (session === "merge") return snap.night || snap.day;
      return snap[session];
    }

    // 當盤開高低：只用「目前盤別」最新交易日的 1 分 K + tick 追蹤
    // 禁：走勢 multi-day minuteSeries、奇摩 regularMarketOpen/High/Low（夜／混盤）
    function touchSessTrack(sk, px) {
      if (px == null || !sk) return;
      const d = tradingDayKey();
      let t = sessTrack[sk];
      if (!t || t.date !== d) {
        sessTrack[sk] = { date: d, o: px, h: px, l: px };
      } else {
        if (px > t.h) t.h = px;
        if (px < t.l) t.l = px;
      }
    }
    function sessOHLC() {
      const sk = sessKey();
      const all = minutePack[sk + "_1m"] || [];
      let rows = [];
      if (all.length) {
        const dLast = dateKey(all[all.length - 1].date) || tradingDayKey();
        rows = all.filter((b) => dateKey(b.date) === dLast);
      }
      let o = null, h = -Infinity, l = Infinity, c = null;
      if (rows.length) {
        o = rows[0].open != null ? rows[0].open : rows[0].close;
        c = rows[rows.length - 1].close;
        rows.forEach((b) => {
          const hh = b.high != null ? b.high : b.close;
          const ll = b.low != null ? b.low : b.close;
          if (hh > h) h = hh;
          if (ll < l) l = ll;
        });
      }
      const tr = sessTrack[sk];
      if (tr && tr.date === tradingDayKey()) {
        if (o == null) o = tr.o;
        if (tr.h > h) h = tr.h;
        if (tr.l < l) l = tr.l;
      }
      const qx = snap && snap[sk];
      const last = n(qx && qx.CLastPrice);
      if (last != null) {
        if (o == null) o = last;
        if (last > h) h = last;
        if (last < l) l = last;
        c = last;
      }
      if (!(h > -Infinity) || o == null) return null;
      if (c == null) c = o;
      return { o, h, l, c };
    }
    function patchQuoteOHLC(sk, lastPx) {
      const so = (() => {
        // 用指定 sk 算（不跟 UI session 走）
        const all = minutePack[(sk || "day") + "_1m"] || [];
        let rows = [];
        if (all.length) {
          const dLast = dateKey(all[all.length - 1].date) || tradingDayKey();
          rows = all.filter((b) => dateKey(b.date) === dLast);
        }
        let o = null, h = -Infinity, l = Infinity;
        if (rows.length) {
          o = rows[0].open != null ? rows[0].open : rows[0].close;
          rows.forEach((b) => {
            if (b.high != null && b.high > h) h = b.high;
            if (b.low != null && b.low < l) l = b.low;
          });
        }
        const tr = sessTrack[sk];
        if (tr && tr.date === tradingDayKey()) {
          if (o == null) o = tr.o;
          if (tr.h > h) h = tr.h;
          if (tr.l < l) l = tr.l;
        }
        if (lastPx != null) {
          if (o == null) o = lastPx;
          if (lastPx > h) h = lastPx;
          if (lastPx < l) l = lastPx;
        }
        if (!(h > -Infinity) || o == null) return null;
        return { o, h, l };
      })();
      if (!so || !snap || !snap[sk]) return;
      snap[sk].COpenPrice = so.o;
      snap[sk].CHighPrice = so.h;
      snap[sk].CLowPrice = so.l;
    }

    function render() {
      const x = q();
      if (!x) {
        $("stamp").textContent = "尚無資料";
        return;
      }
      // 開/高/低：只用 sessOHLC（當盤 1 分+tick）；絕不 fallback 奇摩混盤（否則震幅會變夜盤 696 點）
      const so = sessOHLC();
      const lastLive = n(x.CLastPrice);
      const last = lastLive != null ? lastLive : so ? so.c : null;
      const ref = n(x.CRefPrice);
      let openPx = so ? so.o : null;
      let highPx = so ? so.h : null;
      let lowPx = so ? so.l : null;
      if (so && last != null) {
        highPx = highPx == null ? last : Math.max(highPx, last);
        lowPx = lowPx == null ? last : Math.min(lowPx, last);
      }
      let diff = n(x.CDiff);
      let rate = n(x.CDiffRate);
      if (diff == null && last != null && ref != null) {
        diff = last - ref;
        rate = ref ? (diff / ref) * 100 : 0;
      }
      $("name").textContent = String(x.DispCName || "台指期")
        .replace(/\s*WTX&\s*/g, "")
        .replace(/近一/g, "")
        .trim();
      $("last").className = "px " + cls(diff);
      $("last").textContent = last == null ? "—" : fmt(last, 0);
      $("chgline").className = "sub " + cls(diff);
      $("chgline").textContent =
        last == null ? "" : `${arrow(diff)} ${fmt(Math.abs(diff), 0)} (${diff >= 0 ? "" : ""}${fmt(rate, 2)}%)`;
      $("stamp").textContent = fmtTime(x.CDate, x.CTime);
      $("sumline").innerHTML =
        `<span class="sessico" id="sessToggle" title="${session === "day" ? "日盤，點一下切夜盤" : "夜盤，點一下切日盤"}">${session === "day" ? "☀️" : "🌙"}</span>` +
        `<div class="sumtxt">` +
        `股價 <b>${fmt(last, 0)}</b> <span class="${cls(diff)}">${arrow(diff)} ${fmt(diff, 0)}(${fmt(rate, 2)}%)</span>` +
        `　總口數 ${fmt(x.CTotalVolume)}<br>` +
        `昨 ${fmtPlain(x.CRefPrice)}　開 ${fmtPlain(openPx)}　高 <span class="up">${fmtPlain(highPx)}</span>　低 <span class="dn">${fmtPlain(lowPx)}</span>` +
        `</div>`;

      let bidTot = 0, askTot = 0;
      const levels = [1, 2, 3, 4, 5];
      levels.forEach((i) => {
        bidTot += n(x["CBidSize" + i]) || 0;
        askTot += n(x["CAskSize" + i]) || 0;
      });
      const tot = bidTot + askTot;
      const pinBid = tot ? (bidTot / tot) * 100 : 50;
      const inn = n(x.inMarket), outv = n(x.outMarket);
      // 左右：預設外左／內右；點擊可切換，顏色跟著走
      function paintImbBar(leftVal, rightVal, leftIsOut) {
        const sum = (leftVal || 0) + (rightVal || 0);
        // 真實占比（文字用）
        const pl = sum > 0 ? (leftVal / sum) * 100 : 50;
        const pr = 100 - pl;
        // 橫條視覺：只看 30%~70% 區間，放大中段差距（50 仍居中）
        const lo = 30, hi = 70;
        let plVis = ((pl - lo) / (hi - lo)) * 100;
        if (plVis < 0) plVis = 0;
        if (plVis > 100) plVis = 100;
        const prVis = 100 - plVis;
        const barL = $("barL"), barR = $("barR");
        const txtL = $("txtL"), txtR = $("txtR");
        const pctL = $("pctL"), pctR = $("pctR");
        if (barL) {
          barL.style.width = plVis + "%";
          barL.className = leftIsOut ? "bar-out" : "bar-in";
        }
        if (barR) {
          barR.style.width = prVis + "%";
          barR.className = leftIsOut ? "bar-in" : "bar-out";
        }
        if (txtL) txtL.textContent = (leftIsOut ? "外盤 " : "內盤 ") + fmt(leftVal);
        if (txtR) txtR.textContent = (leftIsOut ? "內盤 " : "外盤 ") + fmt(rightVal);
        if (pctL) {
          pctL.textContent = pl.toFixed(1) + "%";
          pctL.className = leftIsOut ? "imb-l up" : "imb-l dn";
        }
        if (pctR) {

    function liveSess() {

    function ymdOf(d) {

    // 下一個交易日曆日（跳過六日）
    function nextTradingYmd(fromDate) {
      const d = new Date(fromDate.getTime());
      d.setDate(d.getDate() + 1);
      while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
      return ymdOf(d);
    }
    // 曆日交易日 key（僅凌晨夜盤歸前一曆日；周五夜盤不在此處理）
    function tradingDayKey(ts) {
      const d = new Date(ts || Date.now());
      if (d.getHours() < 6) d.setDate(d.getDate() - 1);
      return ymdOf(d);
    }
    // 台指期規則：夜盤交易日＝「下一交易日」
    // 例：周五 15:00 起的夜盤 date／奇摩時間軸＝下周一（8/14 周五夜 → 8/16）
    // 多日走勢必須用此 key 對齊 LIVE，禁把周五夜當成曆日 8/14 的空窗
    function nightTradingYmd(ts) {
      const d = new Date(ts || Date.now());
      const hm = d.getHours() * 100 + d.getMinutes();
      // 凌晨仍屬前一晚夜盤：以「開盤曆日」推下一交易日
      if (hm < 500) {
        const openDay = new Date(d.getTime());
        openDay.setDate(openDay.getDate() - 1); // 回到開盤那天（周五夜→周六凌晨→開盤日周五）
        // 若開盤日是周五，下一交易日周一；其餘開盤日+1 並跳周末
        return nextTradingYmd(openDay);
      }
      // 15:00 後：開盤曆日＝今天，交易日＝下一交易日
      return nextTradingYmd(d);
    }
    function liveTradingYmd() {
      if (liveSess() === "day") return ymdOf(new Date());
      // 優先用夜盤 1 分最後一根的 date（奇摩已標交易日：周五夜→8/16 而非曆推 8/17）
      const rows = minutePack.night_1m || [];
      for (let i = rows.length - 1; i >= 0; i--) {
        const b = rows[i];
        if (!b || !b.date) continue;
        if (b.session && b.session !== "night") continue;
        const dk = dateKey(b.date);
        if (dk) return dk;
      }
      return nightTradingYmd(Date.now());
    }

    /** 每 5 秒寫入；同一分鐘覆寫為最新差值 d=外-內 */
    function recordImb(sk, inn, outv, ts) {
      if (!sk) return;
      if (inn == null || outv == null || isNaN(inn) || isNaN(outv)) return;
      const t = ts || Date.now();
      const slot = Math.floor(t / 60000) * 60000;
      const d = outv - inn;
      const arr = imbBars[sk] || (imbBars[sk] = []);
      const last = arr.length ? arr[arr.length - 1] : null;
      if (last && last.t === slot) {
        last.d = d;
        last.in = inn;
        last.out = outv;
        last.ts = t;
      } else {
        arr.push({ t: slot, d: d, in: inn, out: outv, ts: t });
        if (arr.length > 900) arr.splice(0, arr.length - 900);
      }
      saveImbBars();
    }
    // 內外盤 t 用牆鐘；夜盤價格軸用奇摩「下一交易日」（周五夜 8/14 牆鐘 vs 8/16 棒）
    // 繪圖前把牆鐘對齊到圖軸，否則 t0/t1 一濾全空
    function nightWallOpenMs(ts) {
      const d = new Date(ts);
      const hm = d.getHours() * 100 + d.getMinutes();
      if (hm < 500) d.setDate(d.getDate() - 1);
      d.setHours(15, 0, 0, 0);
      return d.getTime();
    }
    function nightChartOpenMs() {
      const ymd = liveTradingYmd();
      const d0 = parseYmd(ymd);
      if (!d0) return nightWallOpenMs(Date.now());
      return atHm(d0, 15, 0);
    }
    function alignImbChartT(t, sk) {
      if (sk !== "night" || t == null) return t;
      const delta = nightChartOpenMs() - nightWallOpenMs(t);
      if (!delta) return t;
      return t + delta;
    }
    function imbSeries() {
      const sk = sessKey();
      const arr = imbBars[sk] || [];
      if (sk !== "night") return arr;
      return arr.map((b) =>
        b && b.t != null ? Object.assign({}, b, { t: alignImbChartT(b.t, sk) }) : b
      );
    }
    function mergeImbSide(localArr, cloudArr) {
      const map = {};
      (localArr || []).forEach((b) => {
        if (b && b.t != null) map[b.t] = b;
      });
      (cloudArr || []).forEach((b) => {
        if (!b || b.t == null) return;
        const cur = map[b.t];
        if (!cur || (b.ts || 0) >= (cur.ts || 0)) map[b.t] = b;
      });
      return Object.keys(map)
        .map(Number)
        .sort((a, b) => a - b)
        .map((k) => map[k]);
    }
    async function loadImbCloud() {

    function gh(path) {

    function sessKey() {
      if (session === "day") return "day";
      if (session === "night") return "night";
      return liveSess();

    function joinBars(a, b) {
      return (a || []).concat(b || []).sort((x, y) => x.timestamp - y.timestamp);
    }

    function packBars() {
      if (session === "merge" || daySpan >= 2) {
        return {
          m1: joinBars(minutePack.night_1m, minutePack.day_1m),
          m5: joinBars(minutePack.night_5m, minutePack.day_5m),
          m15: joinBars(minutePack.night_15m, minutePack.day_15m),
        };
      }
      const k = sessKey();
      return {
        m1: minutePack[k + "_1m"] || [],
        m5: minutePack[k + "_5m"] || [],
        m15: minutePack[k + "_15m"] || [],
      };

    function lastDates(nDays) {
      const { m1, m5, m15 } = packBars();
      // 日期以 1 分 K 為準（最完整）
      const bars = m1.concat(m5, m15);
      const dates = [];
      for (let i = bars.length - 1; i >= 0 && dates.length < nDays; i--) {
        const d = dateKey(bars[i].date);
        if (d && dates.indexOf(d) < 0) dates.push(d);
      }
      return dates;
    }

    // 走勢粒度：當日 1m｜2 日 5m｜3～5 日 15m
    function resampleBars(bars, stepMs) {
      const sampled = [];
      let cur = null;
      (bars || []).forEach((b) => {
        const slot = Math.floor(b.timestamp / stepMs) * stepMs;
        if (!cur || cur.timestamp !== slot) {
          if (cur) sampled.push(cur);
          cur = {
            timestamp: slot,
            open: b.open, high: b.high, low: b.low, close: b.close,
            volume: b.volume || 0, date: b.date, session: b.session,
          };
        } else {
          cur.high = Math.max(cur.high, b.high);
          cur.low = Math.min(cur.low, b.low);
          cur.close = b.close;
          cur.volume += b.volume || 0;
        }
      });
      if (cur) sampled.push(cur);
      return sampled;
    }
    function minuteSeries() {
      const { m1, m5, m15 } = packBars();
      const n = daySpan < 1 ? 1 : daySpan;
      const keep = lastDates(n);
      const take = (rows) => rows.filter((b) => keep.indexOf(dateKey(b.date)) >= 0);
      // 當日 → 1m
      if (n <= 1) {
        const a = take(m1);
        if (a.length >= 2) return a;
        const b = take(m5);
        if (b.length >= 2) return b;
        return take(m15);
      }
      // 2 日 → 5m；3～5 日 → 15m
      // 有 5m/15m 也要併更細棒：GitHub 5m 常停在日收 13:45，夜盤 live 在 1m
      const want5 = n === 2;
      const primary = want5 ? m5 : m15;
      const stepMs = want5 ? 5 * 60 * 1000 : 15 * 60 * 1000;
      const out = [];
      keep.slice().reverse().forEach((d) => {
        let rows = primary.filter((b) => dateKey(b.date) === d);
        const fine = (want5 ? m1 : m5.concat(m1)).filter((b) => dateKey(b.date) === d);
        if (fine.length) {
          rows = mergeBarLists(rows, resampleBars(fine, stepMs));
        }
        if (rows.length < 2 && want5) {
          rows = m15.filter((b) => dateKey(b.date) === d);
        }
        rows.forEach((b) => out.push(b));
      });
      if (out.length >= 2) {
        out.sort((a, b) => a.timestamp - b.timestamp);
        return out;
      }
      const fb = take(primary);
      if (fb.length >= 2) return fb;
      if (want5) {
        const b15 = take(m15);
        if (b15.length >= 2) return b15;
      }
      return take(m1);
    }

    function mergeBarLists(a, b) {
      const by = {};
      (a || []).concat(b || []).forEach((row) => {
        if (row && row.timestamp) by[row.timestamp] = row;
      });
      return Object.keys(by).sort((x, y) => x - y).map((k) => by[k]);
    }

    // 盤別：日 08:45–13:45、夜 15:00–次日 05:00；休市中不當同盤
    function sessKindAt(ts) {
      const d = new Date(ts);
      const hm = d.getHours() * 60 + d.getMinutes();
      if (hm >= 8 * 60 + 45 && hm < 13 * 60 + 45) return "day";
      if (hm >= 15 * 60 || hm < 5 * 60) return "night";
      return "closed";
    }
    function chartStepMs() {
      const n = daySpan < 1 ? 1 : daySpan;
      if (n <= 1) return 60000;
      if (n === 2) return 5 * 60000;
      return 15 * 60000;
    }
    // 同盤內缺棒：用前收持平補點，避免走勢破圖；跨盤（午休／日夜）不補
    function fillMinutes(bars, stepOverride) {
      if (!bars || bars.length < 2) return bars || [];
      let step = stepOverride || chartStepMs();
      // 有指定 step 就不改（例如 1 分 K 強制 60 秒）；否則用前幾根間距校正
      if (!stepOverride && bars.length >= 3) {
        const ds = [];
        for (let i = 1; i < Math.min(bars.length, 12); i++) {
          const d = bars[i].timestamp - bars[i - 1].timestamp;
          if (d > 0 && d <= 20 * 60000) ds.push(d);
        }
        if (ds.length) {
          ds.sort((a, b) => a - b);
          const med = ds[Math.floor(ds.length / 2)];
          if (med >= 50000) step = Math.max(step, Math.round(med / 60000) * 60000 || med);
        }
      }
      const maxFill = 3 * 60 * 60 * 1000; // 同盤最多補 3 小時洞
      const out = [bars[0]];
      for (let i = 1; i < bars.length; i++) {
        const prev = out[out.length - 1];
        const b = bars[i];
        const hole = b.timestamp - prev.timestamp;
        const sk0 = sessKindAt(prev.timestamp);
        const sk1 = sessKindAt(b.timestamp);
        const sameSess = sk0 !== "closed" && sk0 === sk1;
        if (sameSess && hole > step * 1.5 && hole <= maxFill) {
          const px = prev.close;
          for (let t = prev.timestamp + step; t < b.timestamp - step * 0.4; t += step) {
            if (sessKindAt(t) !== sk0) break;
            out.push({
              timestamp: t,
              open: px, high: px, low: px, close: px,
              volume: 0,
              date: prev.date,
              session: prev.session,
              filled: true,
            });
          }
        }
        out.push(b);
      }
      return out;
    }

    const MIN_KEYS = ["night_1m","day_1m","night_5m","day_5m","night_15m","day_15m"];

    function trimBars(rows, n) {
      if (!rows || rows.length <= n) return rows || [];
      const dates = [];
      for (let i = rows.length - 1; i >= 0 && dates.length < n; i--) {
        const d = dateKey(rows[i].date);
        if (d && dates.indexOf(d) < 0) dates.push(d);
      }
      const keep = {};
      dates.forEach((d) => { keep[d] = 1; });
      return rows.filter((b) => keep[dateKey(b.date)]);
    }

    function save1m() {

    }

    function loadLocal1m() {
      try {
        const j = JSON.parse(localStorage.getItem("txfMin") || localStorage.getItem("txf1m") || "null");
        if (!j) return;
        MIN_KEYS.forEach((k) => {
          const src = j[k] || (k === "night_1m" ? j.night : k === "day_1m" ? j.day : null);
          if (src && src.length) minutePack[k] = mergeBarLists(minutePack[k], src);
        });
      } catch (e) {}
    }

    function barDateAt(ts) {
      const d = new Date(ts);
      const hm = d.getHours() * 100 + d.getMinutes();
      const ymd = (x) =>
        x.getFullYear() +
        String(x.getMonth() + 1).padStart(2, "0") +
        String(x.getDate()).padStart(2, "0");
      // 與 fetch_minute.classify：夜盤 date＝開盤日曆日（凌晨歸前一日）
      if (hm >= 1500 || hm < 500) {
        const d0 = new Date(d.getTime());
        if (hm < 500) d0.setDate(d0.getDate() - 1);
        return ymd(d0);
      }
      return ymd(d);
    }
    function bumpLiveBar() {
      const liveK = liveSess();
      const q0 = (snap && snap[liveK]) || q();
      const px = n(q0 && q0.CLastPrice);
      if (px == null) return;
      const tot = n(q0 && q0.CTotalVolume);
      const key = liveK + "_1m";
      let rows = minutePack[key] || [];
      const slot = Math.floor(Date.now() / 60000) * 60000;
      const dstr = barDateAt(slot) || (q0 && q0.CDate) || "";
      if (!rows.length) {
        rows = [
          {
            timestamp: slot,
            open: px,
            high: px,
            low: px,
            close: px,
            volume: 0,
            date: dstr,
            session: liveK,
          },
        ];
        minutePack[key] = rows;
        if (tot != null) lastTot = tot;
        save1m();
        return;
      }
      const last = rows[rows.length - 1];
      const lastSlot = Math.floor(last.timestamp / 60000) * 60000;
      const dVol = tot != null && lastTot != null && tot >= lastTot ? tot - lastTot : 0;
      if (lastSlot === slot) {
        last.close = px;
        last.high = Math.max(last.high, px);
        last.low = Math.min(last.low, px);
        if (dVol) last.volume = (last.volume || 0) + dVol;
        if (!last.date) last.date = dstr;
      } else if (slot > lastSlot) {
        // 同盤缺分鐘：先用前收補平中間棒，再寫當下分鐘（避免 1 分 K 斷洞破圖）
        const sk0 = sessKindAt(lastSlot);
        const sk1 = sessKindAt(slot);
        const sameSess = sk0 !== "closed" && sk0 === sk1;
        if (sameSess && slot - lastSlot > 60000) {
          for (let t = lastSlot + 60000; t < slot; t += 60000) {
            if (sessKindAt(t) !== sk0) break;
            rows.push({
              timestamp: t,
              open: last.close,
              high: last.close,
              low: last.close,
              close: last.close,
              volume: 0,
              date: last.date || dstr,
              session: liveK,
              filled: true,
            });
          }
        }
        const openPx = sameSess ? last.close : px;
        // 跨盤（日→夜）必須用 slot 的交易日 date，禁沿用昨夜 date（否則 2 日走勢漏夜盤）
        rows.push({
          timestamp: slot,
          open: openPx,
          high: Math.max(openPx, px),
          low: Math.min(openPx, px),
          close: px,
          volume: dVol,
          date: sameSess ? (last.date || dstr) : dstr,
          session: liveK,
        });
        minutePack[key] = rows;
      }
      if (tot != null) lastTot = tot;
      save1m();
    }

    function linePoints() {
      const span = daySpan < 1 ? 1 : daySpan;
      const keep = lastDates(span);
      // 主體＝minuteSeries（當日 1 分／多日 5 或 15 分）
      const mins = fillMinutes(
        minuteSeries().filter((b) => keep.indexOf(dateKey(b.date)) >= 0)
      );
      let pts = mins.map((b) => ({
        px: b.close, vol: b.volume, time: b.timestamp,
        open: b.open, high: b.high, low: b.low, close: b.close,
      }));
      // 尾端即時：當日併當盤 5 秒 tick；多日併日+夜 tick（盤後夜盤也要接到現在）
      {
        const ticks =
          daySpan < 2
            ? hist[sessKey()] || []
            : (hist.day || []).concat(hist.night || []);
        if (ticks.length) {
          const lastT = pts.length ? pts[pts.length - 1].time : 0;
          ticks.forEach((h) => {
            const ts = h.ts;
            if (typeof ts !== "number") return;
            if (ts <= lastT) return;
            const px = h.px;
            if (px == null) return;
            pts.push({
              px, vol: h.vol || 0, time: ts,
              open: px, high: px, low: px, close: px,
            });
          });
        }
        if (daySpan < 2 && pts.length === 1) {
          const qx = q();
          const so = sessOHLC();
          const op = (so && so.o) || pts[0].px;
          pts = [
            {
              px: op, vol: 0, time: pts[0].time - 60000,
              open: op, high: op, low: op, close: op,
            },
            pts[0],
          ];
        }
      }
      // 每 5 秒報價寫進尾端。夜盤棒可能是「下一交易日」時間軸（周五夜→周一 ts）
      // 禁用本機 now 去 max 壞掉奇摩 ts；尾端若已在未來交易日時軸，只改價
      {
        const livePx = n(q() && q().CLastPrice);
        if (livePx != null && pts.length) {
          const now = Date.now();
          const last = pts[pts.length - 1];
          const lastT = last.time || 0;
          // 同一根（2 分內）或尾端已在「未來交易日」時軸上：只更新價
          if (Math.abs(now - lastT) < 120000 || lastT > now + 3600000) {
            last.px = livePx;
            last.close = livePx;
            last.high = Math.max(last.high != null ? last.high : livePx, livePx);
            last.low = Math.min(last.low != null ? last.low : livePx, livePx);
            if (lastT <= now + 3600000) last.time = Math.max(lastT, now - 500);
          } else {
            pts.push({
              px: livePx, vol: 0, time: now,
              open: livePx, high: livePx, low: livePx, close: livePx,
            });
          }
        }
      }
      return pts;
    }

    function parseYmd(ymd) {
      const s = dateKey(ymd);
      if (s.length < 8) return null;
      return new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8), 0, 0, 0, 0);
    }
    function atHm(base, h, m) {
      const d = new Date(base.getTime());
      d.setHours(h, m, 0, 0);
      return d.getTime();
    }
    // 多日 X 軸：只串「有資料或正在進行」的盤段，依時間相鄰鋪滿（連續日）
    // 規則：周五夜盤＝下一交易日（如 8/16）開端；勿為曆日周五夜／下周一上午開空窗
    function sessWindows(pts) {
      const n = daySpan < 1 ? 1 : daySpan;
      let dates = lastDates(n).slice().reverse();
      if (!dates.length && pts && pts.length) {
        const seen = {};
        pts.forEach((p) => {
          const d = new Date(p.time);
          const ymd = dateKey(
            d.getFullYear() +
              String(d.getMonth() + 1).padStart(2, "0") +
              String(d.getDate()).padStart(2, "0")
          );
          if (d.getHours() < 5) {
            // 凌晨棒：交易日＝夜盤歸屬的下一交易日（周五夜→周一）
            const td = nightTradingYmd(p.time);
            if (td) seen[td] = 1;
          } else if (d.getHours() >= 15) {
            const td = nightTradingYmd(p.time);
            if (td) seen[td] = 1;
          } else if (ymd) seen[ymd] = 1;
        });
        dates = Object.keys(seen).sort();
      }
      // 進行中的交易日一定納入（周五夜 → 下周一 ymd）
      const liveTd = liveTradingYmd();
      if (liveTd && dates.indexOf(liveTd) < 0) dates.push(liveTd);
      dates.sort();
      const now = Date.now();
      const wins = [];
      dates.forEach((ymd) => {
        const d0 = parseYmd(ymd);
        if (!d0) return;
        const day0 = atHm(d0, 8, 45);
        const day1 = atHm(d0, 13, 45);
        // 夜盤時間軸：與棒的 timestamp／奇摩一致——交易日 D 的夜＝D 日 15:00～次日 05:00
        // （周五實體開盤在周五晚，但棒 date/ts 已是下周一）
        const n0 = atHm(d0, 15, 0);
        const n1base = new Date(d0.getTime());
        n1base.setDate(n1base.getDate() + 1);
        const n1 = atHm(n1base, 5, 0);
        const dayWin = { t0: day0, t1: day1, kind: "day", date: ymd };
        const nightWin = { t0: n0, t1: n1, kind: "night", date: ymd };
        const hasPts = (w) =>
          !!(pts && pts.some((p) => p.time >= w.t0 && p.time <= w.t1 + 60000));
        // LIVE 以交易日對齊（周五夜 now 在周五、窗在周一 ts）→ 不要求 now>=t0
        const liveHere = (w) => liveSess() === w.kind && liveTd === ymd;
        // 有點或 LIVE 交易日對上就留；禁 n0<=now（周五夜窗在周一 ts，now 仍在周五）
        if (hasPts(dayWin) || liveHere(dayWin)) wins.push(dayWin);
        if (hasPts(nightWin) || liveHere(nightWin)) wins.push(nightWin);
      });
      wins.sort((a, b) => a.t0 - b.t0);
      if (!wins.length && pts && pts.length >= 2) {
        return [{ t0: pts[0].time, t1: pts[pts.length - 1].time, kind: "mix", date: "" }];
      }
      return wins;
    }
    function mapOnWindows(t, wins, padL, cw) {
      if (!wins.length) return padL;
      let total = 0;
      wins.forEach((w) => { total += Math.max(1, w.t1 - w.t0); });
      let acc = 0;
      for (let i = 0; i < wins.length; i++) {
        const w = wins[i];
        const dur = Math.max(1, w.t1 - w.t0);
        if (t < w.t0) return padL + (acc / total) * cw;
        if (t <= w.t1) return padL + ((acc + (t - w.t0)) / total) * cw;
        acc += dur;
      }
      return padL + cw;
    }
    function sessRange(pts) {
      if (daySpan >= 2) {
        const wins = sessWindows(pts);
        if (wins.length) {
          return { t0: wins[0].t0, t1: wins[wins.length - 1].t1, wins };
        }
        if (pts.length >= 2) {
          return { t0: pts[0].time, t1: pts[pts.length - 1].time, wins: [] };
        }
      }
      const tRef = pts.length ? pts[pts.length - 1].time : Date.now();
      const d = new Date(tRef);
      const start = new Date(d);
      const useDay = session === "day" || (session === "merge" && liveSess() === "day");
      if (useDay) {
        start.setHours(8, 45, 0, 0);
        const end = new Date(start);
        end.setHours(13, 45, 0, 0);
        return { t0: start.getTime(), t1: end.getTime(), wins: [] };
      }
      if (d.getHours() < 15) start.setDate(start.getDate() - 1);
      start.setHours(15, 0, 0, 0);
      const days = daySpan < 1 ? 1 : daySpan;
      start.setDate(start.getDate() - (days - 1));
      const end = new Date(start);
      end.setDate(end.getDate() + days);
      end.setHours(5, 0, 0, 0);
      return { t0: start.getTime(), t1: end.getTime(), wins: [] };
    }

    function mergeDaily() {
      const by = {};
      (dailyPack.night || []).concat(dailyPack.day || []).forEach((b) => {
        const d = b.date || b.timestamp;
        if (!by[d]) {
          by[d] = Object.assign({}, b);
          return;
        }
        const o = by[d];
        o.high = Math.max(o.high, b.high);
        o.low = Math.min(o.low, b.low);
        o.close = b.close;
        o.volume = (o.volume || 0) + (b.volume || 0);
        if ((b.timestamp || 0) > (o.timestamp || 0)) o.timestamp = b.timestamp;
      });
      return Object.keys(by).sort().map((k) => by[k]);
    }

    function dailyBars() {
      return dailyPack.daily || dailyPack.night || [];
    }

    function resample(bars, ms) {
      const out = [];
      let cur = null;
      (bars || []).forEach((b) => {
        const slot = Math.floor(b.timestamp / ms) * ms;
        if (!cur || cur.timestamp !== slot) {
          if (cur) out.push(cur);
          cur = {
            timestamp: slot,
            open: b.open, high: b.high, low: b.low, close: b.close,
            volume: b.volume || 0, date: b.date,
          };
        } else {
          cur.high = Math.max(cur.high, b.high);
          cur.low = Math.min(cur.low, b.low);
          cur.close = b.close;
          cur.volume += b.volume || 0;
        }
      });
      if (cur) out.push(cur);
      return out;
    }

    function foldDaily(bars, keyFn) {
      const by = {};
      (bars || []).forEach((b) => {
        const k = keyFn(b);
        if (!by[k]) {
          by[k] = {
            timestamp: b.timestamp,
            open: b.open, high: b.high, low: b.low, close: b.close,
            volume: b.volume || 0, date: b.date,
          };
          return;
        }
        const o = by[k];
        o.high = Math.max(o.high, b.high);
        o.low = Math.min(o.low, b.low);
        o.close = b.close;
        o.volume += b.volume || 0;
      });
      return Object.keys(by).sort().map((k) => by[k]);
    }

    function weekKey(b) {
      const d = new Date(b.timestamp);
      const day = d.getDay();
      const diff = day === 0 ? 6 : day - 1;
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - diff);
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    // 日／夜 1 分合併 → 30 分（含未走完的當根）
    function all1mBars() {
      return joinBars(minutePack.night_1m, minutePack.day_1m);
    }
    function bars30m() {
      const m1 = all1mBars();
      if (m1.length) return resample(m1, 30 * 60 * 1000);
      const m5 = joinBars(minutePack.night_5m, minutePack.day_5m);
      if (m5.length) return resample(m5, 30 * 60 * 1000);
      const m15 = joinBars(minutePack.night_15m, minutePack.day_15m);
      if (m15.length) return resample(m15, 30 * 60 * 1000);
      return [];
    }
    function liveLastPx() {
      const d = n(snap && snap.day && snap.day.CLastPrice);
      const n0 = n(snap && snap.night && snap.night.CLastPrice);
      const sk = liveSess();
      if (sk === "day" && d != null) return d;
      if (sk === "night" && n0 != null) return n0;
      return d != null ? d : n0;
    }
    // 用 30 分合成指定交易日的日 K（開＝首根；高／低／收跟最新；盤中未完也出棒）
    function synthDayBar(ymd8) {
      const want = dateKey(ymd8 || tradingDayKey());
      if (!want) return null;
      let rows = bars30m().filter((b) => dateKey(b.date) === want);
      if (!rows.length) rows = all1mBars().filter((b) => dateKey(b.date) === want);
      if (!rows.length) return null;
      let o = rows[0].open != null ? rows[0].open : rows[0].close;
      let h = -Infinity, l = Infinity, c = rows[rows.length - 1].close, v = 0;
      rows.forEach((b) => {
        const hh = b.high != null ? b.high : b.close;
        const ll = b.low != null ? b.low : b.close;
        if (hh > h) h = hh;
        if (ll < l) l = ll;
        c = b.close;
        v += b.volume || 0;
      });
      const px = liveLastPx();
      if (px != null) {
        if (px > h) h = px;
        if (px < l) l = px;
        c = px;
      }
      if (!(h > -Infinity) || o == null) return null;
      const dash = ymdDash(want);
      const p = dash.split("-");
      const ts = Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 5, 45);
      return { timestamp: ts, open: o, high: h, low: l, close: c, volume: v, date: dash, live: true };
    }
    // 日 K：收盤前用 30 分合成當日；收盤後冷備有該日則用冷備
    function dayBarsLive() {
      const hist = dailyBars().slice();
      const today8 = tradingDayKey();
      const synth = synthDayBar(today8);
      if (!synth) return hist;
      const idx = hist.findIndex((b) => dateKey(b.date) === today8);
      if (!marketOpen() && idx >= 0 && !hist[idx].live) return hist;
      if (idx >= 0) {
        hist[idx] = Object.assign({}, hist[idx], {
          open: synth.open,
          high: synth.high,
          low: synth.low,
          close: synth.close,
          volume: synth.volume || hist[idx].volume,
          live: true,
        });
      } else hist.push(synth);
      return hist;
    }
    // 週 K：冷備 + 本週 30 分合成（未完週也更新上下影）
    function weekBarsLive() {
      let weeks =
        dailyPack.week && dailyPack.week.length
          ? dailyPack.week.slice()
          : foldDaily(dailyBars(), weekKey);
      const m30 = bars30m();
      const src = m30.length ? m30 : all1mBars();
      if (!src.length) return weeks;
      const from30 = foldDaily(src, weekKey);
      if (!from30.length) return weeks;
      const cur = Object.assign({}, from30[from30.length - 1]);
      const px = liveLastPx();
      if (px != null) {
        cur.high = Math.max(cur.high, px);
        cur.low = Math.min(cur.low, px);
        cur.close = px;
      }
      const wk = weekKey(cur);
      const i = weeks.findIndex((b) => weekKey(b) === wk);
      if (i >= 0) {
        weeks[i] = {
          timestamp: weeks[i].timestamp,
          open: weeks[i].open,
          high: Math.max(weeks[i].high, cur.high),
          low: Math.min(weeks[i].low, cur.low),
          close: cur.close,
          volume: weeks[i].volume || 0,
          date: weeks[i].date || cur.date,
        };
      } else weeks.push(cur);
      return weeks;
    }
    // 分 K：永遠日夜併時間軸（不跟 UI ☀️/🌙 過濾）。只畫夜盤會把 05:00→15:00 連成斷崖。
    // 報價列開高低仍用 sessOHLC（當盤）；此處只影響 K 圖資料。
    function klineData() {
      const m1 = joinBars(minutePack.night_1m, minutePack.day_1m);
      const m5 = joinBars(minutePack.night_5m, minutePack.day_5m);
      const m15 = joinBars(minutePack.night_15m, minutePack.day_15m);
      if (kInt === "1") {
        const raw = m1.length ? m1 : m5;
        return fillMinutes(raw, 60000);
      }
      if (kInt === "5") return m5.length ? m5 : resample(m1, 5 * 60 * 1000);
      if (kInt === "15") return m15.length ? m15 : resample(m5.length ? m5 : m1, 15 * 60 * 1000);
      if (kInt === "30") {
        const src = m1.length ? m1 : m5.length ? m5 : m15;
        return resample(src, 30 * 60 * 1000);
      }
      if (kInt === "w") return weekBarsLive();
      return dayBarsLive();
    }

    function fitCanvas(c, cssH) {
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(1, Math.round(c.clientWidth || c.width));
      const h = cssH || Math.max(1, Math.round(c.clientHeight || 280));
      c.style.height = h + "px";
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
      const ctx = c.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, w, h };
    }

    function draw() {
      const lineOn = chartMode === "line";
      $("chart").style.display = lineOn ? "block" : "none";
      $("khost").style.display = lineOn ? "none" : "block";
      if (!lineOn) {
        renderK();
        return;
      }
      const c = $("chart");
      const multi0 = daySpan >= 2;
      const showImb = !multi0;
      const { ctx, w, h } = fitCanvas(c, showImb ? 320 : 280);
      ctx.clearRect(0, 0, w, h);
      const pts = linePoints();
      if (pts.length < 2) {
        ctx.fillStyle = "#9ca3af";
        ctx.font = "14px sans-serif";
        ctx.fillText("走勢累積中…", 16, h / 2);
        return;
      }
      const prices = pts.map((p) => p.px);
      const qx0 = q();
      const so0 = sessOHLC();
      // 開高低用當盤 1 分；平盤線／紅綠分界用該盤昨收（CRefPrice），不是開盤
      const open = daySpan >= 2 ? prices[0] : (so0 && so0.o != null ? so0.o : prices[0]);
      const refPx = daySpan >= 2 ? null : n(qx0 && qx0.CRefPrice);
      const flat = refPx != null ? refPx : open;
      const lastPx = n(qx0 && qx0.CLastPrice);
      let hiBase = so0 && so0.h != null ? so0.h : -Infinity;
      let loBase = so0 && so0.l != null ? so0.l : Infinity;
      const hi = Math.max(...prices, open, flat, hiBase, lastPx != null ? lastPx : -Infinity);
      const lo = Math.min(...prices, open, flat, loBase, lastPx != null ? lastPx : Infinity);
      let yPad = daySpan >= 2 ? 50 : 100;
      let mx = Math.ceil((hi + yPad) / 100) * 100;
      let mn = Math.floor((lo - yPad) / 100) * 100;
      if (!(mx > mn)) { mx = mn + 200; }
      let yStep = 100;
      while ((mx - mn) / yStep > 5) yStep += 100;
      const range = sessRange(pts);
      const { t0, t1 } = range;
      const wins = range.wins || [];
      const multi = daySpan >= 2;
      // 多日不畫底部 X 文字（靠十字線讀時間），只留窄底邊
      const padL = 48, padR = 33, padT = 10, padB = multi ? 8 : 22;
      const imbH = showImb && !multi ? 52 : 0;
      const imbGap = imbH ? 6 : 0;
      const cw = w - padL - padR;
      const ch = h - padT - padB - imbH - imbGap;
      const imbTop = padT + ch + imbGap;
      // 多日仍用日／夜視窗映射 → 未走完的盤右側留白；不當日不塞滿
      const xAtI = (i, t) => multi && wins.length
        ? mapOnWindows(t, wins, padL, cw)
        : padL + ((t - t0) / Math.max(1, t1 - t0)) * cw;
      const yAt = (p) => padT + (1 - (p - mn) / (mx - mn)) * ch;

      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#6b7280";
      ctx.font = "11px sans-serif";
      for (let pv = mn; pv <= mx; pv += yStep) {
        const y = Math.round(yAt(pv)) + 0.5;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(w - padR, y);
        ctx.stroke();
        ctx.fillText(String(Math.round(pv)), 4, y + 4);
      }
      // 僅當日畫小時刻度文字；多日不畫 X 軸文字（避免重疊）
      ctx.textAlign = "center";
      if (!multi) {
        const hour0 = new Date(t0);
        hour0.setMinutes(0, 0, 0);
        if (hour0.getTime() < t0) hour0.setHours(hour0.getHours() + 1);
        const spanMs = t1 - t0;
        const hourStep = spanMs > 72 * 3600000 ? 12 : spanMs > 20 * 3600000 ? 4 : 1;
        for (let t = hour0.getTime(); t <= t1; t += 3600000 * hourStep) {
          const x = Math.round(xAtI(0, t)) + 0.5;
          ctx.beginPath();
          ctx.moveTo(x, padT);
          ctx.lineTo(x, padT + ch);
          ctx.stroke();
          ctx.fillText(String(new Date(t).getHours()).padStart(2, "0"), x, h - 6);
        }
      }
      ctx.textAlign = "left";

      // 平盤虛線＝昨收（日／夜各自 snap 的 CRefPrice）
      const yFlat = Math.round(yAt(flat)) + 0.5;
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = "#9ca3af";
      ctx.beginPath();
      ctx.moveTo(padL, yFlat);
      ctx.lineTo(w - padR, yFlat);
      ctx.stroke();
      ctx.setLineDash([]);

      // 斷線只留給跨盤／跨日大洞；同盤缺棒已由 fillMinutes 補平
      let gap = Infinity;
      {
        let step = chartStepMs();
        if (pts.length >= 2 && pts[1].time && pts[0].time) {
          const d0 = pts[1].time - pts[0].time;
          if (d0 > 0) step = Math.max(step, d0);
        }
        // 午休約 75 分、夜→日約 3.75 時；門檻 45 分即可切開跨盤，又不會因 7 分缺棒破圖
        gap = Math.max(step * 3, 45 * 60000);
      }
      const runs = [];
      let run = [];
      for (let i = 0; i < pts.length; i++) {
        if (i && pts[i].time && pts[i - 1].time && pts[i].time - pts[i - 1].time > gap) {
          if (run.length >= 2) runs.push(run);
          run = [];
        }
        run.push({ x: xAtI(i, pts[i].time), y: yAt(pts[i].px), px: pts[i].px });
      }
      if (run.length >= 2) runs.push(run);

      const gUp = ctx.createLinearGradient(0, padT, 0, yFlat);
      gUp.addColorStop(0, "rgba(211,47,47,0.32)");
      gUp.addColorStop(1, "rgba(211,47,47,0.00)");
      const gDn = ctx.createLinearGradient(0, yFlat, 0, padT + ch);
      gDn.addColorStop(0, "rgba(27,138,62,0.00)");
      gDn.addColorStop(1, "rgba(27,138,62,0.32)");

      function areaPath(seg) {
        ctx.beginPath();
        ctx.moveTo(seg[0].x, yFlat);
        seg.forEach((p) => ctx.lineTo(p.x, p.y));
        ctx.lineTo(seg[seg.length - 1].x, yFlat);
        ctx.closePath();
      }
      runs.forEach((seg) => {
        ctx.save();
        ctx.beginPath();
        ctx.rect(padL, padT, w - padL - padR, Math.max(0, yFlat - padT));
        ctx.clip();
        areaPath(seg);
        ctx.fillStyle = gUp;
        ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.beginPath();
        ctx.rect(padL, yFlat, w - padL - padR, Math.max(0, padT + ch - yFlat));
        ctx.clip();
        areaPath(seg);
        ctx.fillStyle = gDn;
        ctx.fill();
        ctx.restore();
      });

      ctx.lineWidth = 1;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      runs.forEach((seg) => {
        for (let i = 1; i < seg.length; i++) {
          const a = seg[i - 1], b = seg[i];
          if ((a.px - flat) * (b.px - flat) < 0 && b.px !== a.px) {
            const t = (flat - a.px) / (b.px - a.px);
            const xm = a.x + (b.x - a.x) * t;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(xm, yFlat);
            ctx.strokeStyle = a.px >= flat ? "#d32f2f" : "#1b8a3e";
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(xm, yFlat);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = b.px >= flat ? "#d32f2f" : "#1b8a3e";
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = (a.px >= flat || b.px >= flat) ? "#d32f2f" : "#1b8a3e";
            ctx.stroke();
          }
        }
      });

      // 當日走勢 36MA：暖機取「圖上第一點之前」的 1 分收（跨日／跨盤接前一 Session）
      if (!multi && pts.length >= 1) {
        const t0pt = pts[0].time;
        const seedBars = joinBars(minutePack.night_1m, minutePack.day_1m)
          .filter((b) => b && b.timestamp < t0pt && b.close != null)
          .sort((a, b) => a.timestamp - b.timestamp);
        const seed = seedBars.map((b) => b.close).slice(-35);
        ctx.save();
        ctx.strokeStyle = "#f5a66a";
        ctx.lineWidth = 1.25;
        ctx.setLineDash([]);
        ctx.beginPath();
        let started = false;
        for (let i = 0; i < pts.length; i++) {
          const win = seed.concat(pts.slice(0, i + 1).map((p) => p.px));
          const take = win.slice(-36);
          if (!take.length) continue;
          let s = 0;
          for (let j = 0; j < take.length; j++) s += take[j];
          const ma = s / take.length;
          const x = xAtI(i, pts[i].time);
          const y = yAt(ma);
          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else ctx.lineTo(x, y);
        }
        if (started) ctx.stroke();
        ctx.restore();
      }

      let hiI = 0, loI = 0, hiV = -Infinity, loV = Infinity;
      pts.forEach((p, i) => {
        const hv = p.high != null ? p.high : p.px;
        const lv = p.low != null ? p.low : p.px;
        if (hv > hiV) { hiV = hv; hiI = i; }
        if (lv < loV) { loV = lv; loI = i; }
      });
      function markExt(i, val, up) {
        const x = xAtI(i, pts[i].time);
        const y = yAt(val);
        ctx.fillStyle = up ? "#d32f2f" : "#1b8a3e";
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = "11px sans-serif";
        ctx.textAlign = "center";
        const lab = String(Math.round(val));
        const ty = up ? Math.max(padT + 11, y - 8) : Math.min(padT + ch - 2, y + 14);
        ctx.fillText(lab, Math.min(padL + cw - 20, Math.max(padL + 20, x)), ty);
      }
      if (hiV > -Infinity) markExt(hiI, hiV, true);
      if (loV < Infinity) markExt(loI, loV, false);

      const qx = q();
      const soBar = sessOHLC();
      // 右側當日 K 棒：只用 sessOHLC，禁 snap 奇摩混盤開高低
      const o = soBar ? soBar.o : null;
      const barH = soBar ? soBar.h : null;
      const barL = soBar ? soBar.l : null;
      const cl = soBar && soBar.c != null ? soBar.c : n(qx && qx.CLastPrice);
      if ([o, barH, barL, cl].every((v) => v != null)) {
        const mid = Math.round(w - 14) + 0.5;
        const yH = yAt(barH), yL = yAt(barL);
        const yTop = yAt(Math.max(o, cl));
        const yBot = yAt(Math.min(o, cl));
        const col = cl >= o ? "#d32f2f" : "#1b8a3e";
        ctx.strokeStyle = col;
        ctx.fillStyle = col;
        ctx.lineWidth = 2;
        ctx.lineCap = "butt";
        ctx.beginPath();
        ctx.moveTo(mid, yH);
        ctx.lineTo(mid, yL);
        ctx.stroke();
        const bh = Math.max(2, yBot - yTop);
        ctx.fillRect(mid - 6.5, yTop, 13, bh);
      }

      // 副圖：內外盤差面積圖（同主圖遮罩漸層；0 軸上紅下綠）
      if (showImb && !multi && imbH > 0) {
        const ibs = imbSeries().filter((b) => b && b.t >= t0 && b.t <= t1)
          .slice().sort((a, b) => a.t - b.t);
        const zeroY = Math.round(imbTop + imbH / 2) + 0.5;
        // 左緣水平「內外盤」10pt
        ctx.save();
        ctx.fillStyle = "#6b7280";
        ctx.font = "10pt sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText("內外盤", 2, imbTop + imbH / 2);
        ctx.restore();

        ctx.strokeStyle = "#e5e7eb";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padL, zeroY);
        ctx.lineTo(w - padR, zeroY);
        ctx.stroke();

        if (ibs.length >= 1) {
          let maxAbs = 1;
          ibs.forEach((b) => {
            if (Math.abs(b.d) > maxAbs) maxAbs = Math.abs(b.d);
          });
          maxAbs = Math.max(maxAbs * 1.05, 1);
          const half = imbH / 2 - 2;
          const segs = ibs.map((b) => ({
            x: xAtI(0, b.t + 30000),
            y: zeroY - (b.d / maxAbs) * half,
            d: b.d,
          }));

          function imbArea(seg) {
            ctx.beginPath();
            ctx.moveTo(seg[0].x, zeroY);
            seg.forEach((p) => ctx.lineTo(p.x, p.y));
            ctx.lineTo(seg[seg.length - 1].x, zeroY);
            ctx.closePath();
          }

          // 正：0 軸以上紅漸層；負：0 軸以下綠漸層（遮罩同主圖）
          const gUp = ctx.createLinearGradient(0, imbTop, 0, zeroY);
          gUp.addColorStop(0, "rgba(211,47,47,0.40)");
          gUp.addColorStop(1, "rgba(211,47,47,0.02)");
          const gDn = ctx.createLinearGradient(0, zeroY, 0, imbTop + imbH);
          gDn.addColorStop(0, "rgba(27,138,62,0.02)");
          gDn.addColorStop(1, "rgba(27,138,62,0.40)");

          if (segs.length >= 2) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(padL, imbTop, cw, Math.max(0, zeroY - imbTop));
            ctx.clip();
            imbArea(segs);
            ctx.fillStyle = gUp;
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.beginPath();
            ctx.rect(padL, zeroY, cw, Math.max(0, imbTop + imbH - zeroY));
            ctx.clip();
            imbArea(segs);
            ctx.fillStyle = gDn;
            ctx.fill();
            ctx.restore();

            // 折線：跨 0 切色
            ctx.lineWidth = 1.25;
            ctx.lineJoin = "round";
            ctx.lineCap = "round";
            for (let i = 1; i < segs.length; i++) {
              const a = segs[i - 1], b = segs[i];
              if (a.d * b.d < 0 && b.d !== a.d) {
                const t = (0 - a.d) / (b.d - a.d);
                const xm = a.x + (b.x - a.x) * t;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(xm, zeroY);
                ctx.strokeStyle = a.d >= 0 ? "#d32f2f" : "#1b8a3e";
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(xm, zeroY);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = b.d >= 0 ? "#d32f2f" : "#1b8a3e";
                ctx.stroke();
              } else {
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = (a.d >= 0 || b.d >= 0) ? "#d32f2f" : "#1b8a3e";
                ctx.stroke();
              }
            }
          } else if (segs.length === 1) {
            // 僅 1 點：畫小圓
            const p = segs[0];
            ctx.fillStyle = p.d >= 0 ? "#d32f2f" : "#1b8a3e";
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }

          // 最新差值標在「最後一點」旁（非角落）
          const last = ibs[ibs.length - 1];
          const lp = segs[segs.length - 1];
          if (last && lp) {
            const lab = (last.d > 0 ? "+" : "") + Math.round(last.d) + "口";
            ctx.font = "10pt sans-serif";
            ctx.fillStyle = last.d >= 0 ? "#d32f2f" : "#1b8a3e";
            ctx.textBaseline = "middle";
            const tw = ctx.measureText(lab).width;
            let tx = lp.x + 6;
            let ty = lp.y;
            // 右側空間不足 → 標在點左側
            if (tx + tw > w - padR - 2) {
              tx = lp.x - 6;
              ctx.textAlign = "right";
            } else {
              ctx.textAlign = "left";
            }
            // 勿超出副圖上下
            ty = Math.min(imbTop + imbH - 2, Math.max(imbTop + 8, ty));
            // 小白底避免貼線看不清
            const padX = 2;
            const bx = ctx.textAlign === "right" ? tx - tw - padX : tx - padX;
            ctx.fillStyle = "rgba(255,255,255,0.85)";
            ctx.fillRect(bx, ty - 7, tw + padX * 2, 14);
            ctx.fillStyle = last.d >= 0 ? "#d32f2f" : "#1b8a3e";
            ctx.fillText(lab, tx, ty);
            // 端點小圓
            ctx.beginPath();
            ctx.arc(lp.x, lp.y, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
      }
      lineHit = { pts, xs: pts.map((p, i) => xAtI(i, p.time)) };
      if (holding && hoverIdx != null && pts[hoverIdx]) {
        const hp = pts[hoverIdx];
        const hx = xAtI(hoverIdx, hp.time);
        const hy = yAt(hp.px);
        ctx.save();
        ctx.strokeStyle = "#111827";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(hx + 0.5, padT);
        ctx.lineTo(hx + 0.5, padT + ch);
        ctx.moveTo(padL, hy + 0.5);
        ctx.lineTo(padL + cw, hy + 0.5);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(hx, hy, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = "#111827";
        ctx.fill();
        ctx.restore();
        const d = new Date(hp.time);
        const ds = (d.getMonth() + 1) + "/" + d.getDate() + " "
          + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
        const tip = ds + " " + Math.round(Number(hp.close != null ? hp.close : hp.px) || 0);
        ctx.font = "12px sans-serif";
        const tw = ctx.measureText(tip).width;
        let tx = hx + 8;
        if (tx + tw + 10 > w - 8) tx = hx - tw - 12;
        if (tx < padL) tx = padL;
        const ty = padT + 4;
        ctx.fillStyle = "rgba(255,255,255,0.92)";
        ctx.fillRect(tx - 4, ty, tw + 8, 18);
        ctx.fillStyle = "#111827";
        ctx.textAlign = "left";
        ctx.fillText(tip, tx, ty + 13);
      }
    }

    function nearestLine(clientX) {
      if (!lineHit || !lineHit.xs.length) return 0;
      const x = clientX - $("chart").getBoundingClientRect().left;
      let best = 0, bestD = 1e15;
      lineHit.xs.forEach((px, i) => {
        const d = Math.abs(px - x);
        if (d < bestD) { bestD = d; best = i; }
      });
      return best;
    }

    function bindLineHold() {
      const c = $("chart");
      if (!c || c.dataset.hold) return;
      c.dataset.hold = "1";
      c.addEventListener("pointerdown", (e) => {
        if (chartMode !== "line") return;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => {
          holding = true;
          hoverIdx = nearestLine(e.clientX);
          try { c.setPointerCapture(e.pointerId); } catch (err) {}
          draw();
        }, 320);
      });
      c.addEventListener("pointermove", (e) => {
        if (!holding) return;
        hoverIdx = nearestLine(e.clientX);
        draw();
      });
      function endHold() {
        clearTimeout(holdTimer);
        if (!holding) return;
        holding = false;
        hoverIdx = null;
        draw();
      }
      c.addEventListener("pointerup", endHold);
      c.addEventListener("pointercancel", endHold);
    }

    function liveDayBar() {
      // 迷你日 K 與主圖日 K 同源：30 分合成當日（含夜／日）
      return synthDayBar(tradingDayKey());
    }

    function miniBars() {
      return dayBarsLive();
    }

    function miniFit36() {
      const el = $("minik");
      if (!miniChart || !el) return;
      const w = el.clientWidth || 300;
      const space = Math.max(4, (w - 60) / 36);
      miniChart.setBarSpace(space);
    }

    function drawMiniK() {
      if (typeof klinecharts === "undefined") return;
      const el = $("minik");
      if (!el) return;
      const bars = miniBars();
      if (bars.length < 2) return;
      if (!miniChart) {
        if (el.clientWidth < 40 || el.clientHeight < 40) {
          setTimeout(drawMiniK, 80);
          return;
        }
        miniChart = klinecharts.init(el, { styles: miniStyles() });
        if (!miniChart) return;
        if (miniChart.setPrecision) miniChart.setPrecision({ price: 0, volume: 0 });
        else if (miniChart.setPriceVolumePrecision) miniChart.setPriceVolumePrecision(0, 0);
        miniChart.setOffsetRightDistance(3);
        miniFit36();
        miniChart.applyNewData(bars);
        if (miniChart.resize) miniChart.resize();
        miniFit36();
        return;
      }
      const have = miniChart.getDataList ? miniChart.getDataList().length : 0;
      if (have < bars.length - 1) {
        miniChart.applyNewData(bars);
        if (miniChart.resize) miniChart.resize();
        return;
      }
      const liveBar = liveDayBar();
      if (liveBar) {
        const last = bars[bars.length - 1];
        if (last) liveBar.timestamp = last.timestamp;
        miniChart.updateData(liveBar);
      }
    }

    function twStyles() {

        candle: {
          bar: {
            upColor: "#d32f2f", downColor: "#1b8a3e", noChangeColor: "#888888",
            upBorderColor: "#d32f2f", downBorderColor: "#1b8a3e", noChangeBorderColor: "#888888",
            upWickColor: "#d32f2f", downWickColor: "#1b8a3e", noChangeWickColor: "#888888",
          },
          tooltip: {

              if (!c) return [];

              return [
                { title: "開" + z(c.open), value: "" },
                { title: "高" + z(c.high), value: "" },
                { title: "低" + z(c.low), value: "" },

          },

      s.indicator.tooltip = { showRule: "none" };

      s.yAxis = {
