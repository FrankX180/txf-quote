<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台指期 TXF — 即時看盤</title>
  <style>
    :root {
      --up: #d32f2f;
      --dn: #1b8a3e;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f3f4f6;
      --card: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: #111827;
    }
    .wrap { max-width: 1060px; margin: 10px auto; padding: 0 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 10px;
    }
    .chipline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
    .rowlab { font-size: 13px; font-weight: 800; color: #111; min-width: 2.4em; }
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 10px;
      align-items: start;
    }
    .hero-head { min-width: 0; }
    .hero-mid { min-width: 0; }
    .title-row { display: flex; align-items: center; gap: 8px; }
    .title { font-size: 20px; font-weight: 800; }
    .pxrow { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
    .pxmeta { padding-bottom: 0; }
    #minik {
      position: relative;
      width: 100%;
      height: 118px;
    }
    .px { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin: 2px 0 0; }
    .sub { font-size: 13px; color: var(--muted); }
    .sessico {
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; width: 56px; cursor: pointer;
      font-size: 30px; line-height: 1; user-select: none;
    }
    .sumtxt { flex: 1; min-width: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .side, .side table, .side .sub, .side .oi, .side .bar-labs {
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    .side { display: flex; flex-direction: column; gap: 8px; }
    .side-top {
      display: block;
    }
    .side-oi {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
      gap: 10px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
    }
    .meta {
      display: flex;
      align-items: center;
      gap: 0;
      font-size: 13px;
      line-height: 1.7;
      color: #374151;
    }
    canvas { width: 100%; height: 280px; display: block; }
    .chips { margin: 4px 0 8px; }
    .chip, .mode {
      background: #f3f4f6; border: 0; border-radius: 4px; padding: 4px 10px;
      font-size: 13px; cursor: pointer; font-weight: 600; color: #374151;
    }
    .chip.on, .mode.on { background: #b91c1c; color: #fff; }
    #khost { width: 100%; height: 320px; display: none; }
    table.q { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.q td { padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
    table.q td:nth-child(2), table.q td:nth-child(4) { text-align: right; font-variant-numeric: tabular-nums; }
    table.q td:nth-child(2) { padding-right: 8px; }
    table.q td:nth-child(3) { padding-left: 8px; }
    .oi { margin-top: 0; font-size: 13px; }
    .oi h4 { margin: 0 0 4px; font-size: 13px; }
    .oi table { width: 100%; border-collapse: collapse; }
    .oi td, .oi th { padding: 3px 2px; border-bottom: 1px solid #f3f4f6; text-align: right; font-variant-numeric: tabular-nums; }
    .oi td:first-child, .oi th:first-child { text-align: left; color: #6b7280; }
    table.q td.lab { color: #6b7280; }
    .ob { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 0; table-layout: fixed; }
    .ob col.c-qty { width: 18px; }
    .ob col.c-bar { width: auto; }
    .ob col.c-px { width: 58px; }
    .ob td { padding: 2px 3px; font-variant-numeric: tabular-nums; }
    .ob .bid { color: var(--up); }
    .ob .ask { color: var(--dn); }
    .ob .lab.bid { color: var(--up); text-align: left; }
    .ob .lab.ask { color: var(--dn); text-align: right; }
    .ob .qty.bid { text-align: left; }
    .ob .qty.ask { text-align: right; }
    .ob .bar-bid { text-align: right; }
    .ob .bar-ask { text-align: left; }
    .ob .pxb { color: var(--up); text-align: right; white-space: nowrap; font-size: 12px; }
    .ob .pxa { color: var(--dn); text-align: left; white-space: nowrap; font-size: 12px; }
    .bar-wrap {
      position: relative;
      display: flex;
      height: 22px;
      border-radius: 4px;
      overflow: hidden;
      margin: 4px 0 2px;
      background: #eee;
    }
    .bar-in { background: var(--dn); }
    .bar-out { background: var(--up); }
    .bar-labs {
      position: absolute; inset: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 8px; font-size: 12px; font-weight: 700; color: #fff;
      pointer-events: none;
    }
    .up { color: var(--up); }
    .dn { color: var(--dn); }
    .flat { color: #111; }
    .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
    .live { font-size: 11px; margin-left: 8px; color: #9ca3af; }
    .live.on { color: #16a34a; }
    .szbar { display: block; height: 14px; background: var(--dn); max-width: 100%; }
    .szbar.r { background: var(--up); margin-left: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="hero" id="hero">
        <div class="hero-head">
          <div class="title-row">
            <div class="title" id="name">台指期</div>
            <span class="live" id="live">未連線</span>
          </div>
          <div class="pxrow">
            <div class="px flat" id="last">—</div>
            <div class="pxmeta">
              <div class="sub" id="chgline"></div>
              <div class="sub" id="stamp">載入中…</div>
            </div>
          </div>
        </div>
        <div class="hero-mid">
          <div id="minik"></div>
        </div>
      </div>
    </div>

    <div class="card board">
      <div class="grid">
        <div>
          <div class="chips">
            <div class="chipline">
              <span class="rowlab">Ｋ線</span>
              <button class="chip" data-k="1" type="button">１分</button>
              <button class="chip" data-k="5" type="button">５分</button>
              <button class="chip" data-k="15" type="button">１５</button>
              <button class="chip" data-k="30" type="button">３０</button>
              <button class="chip" data-k="d" type="button">日Ｋ</button>
              <button class="chip" data-k="w" type="button">週Ｋ</button>
            </div>
            <div class="chipline">
              <span class="rowlab">走勢</span>
              <button class="chip on" data-line="0" type="button">當日</button>
              <button class="chip" data-line="2" type="button">２日</button>
              <button class="chip" data-line="3" type="button">３日</button>
              <button class="chip" data-line="4" type="button">４日</button>
              <button class="chip" data-line="5" type="button">５日</button>
            </div>
          </div>
          <div class="meta" id="sumline"></div>
          <canvas id="chart" width="720" height="280"></canvas>
          <div id="khost"></div>
        </div>
        <div class="side">
          <div class="side-top">
            <div>
              <table class="ob" id="ob"></table>
              <div class="bar-wrap">
                <div class="bar-in" id="barIn" style="width:50%"></div>
                <div class="bar-out" id="barOut" style="width:50%"></div>
                <div class="bar-labs">
                  <span id="inTxt">內盤 —</span>
                  <span id="outTxt">外盤 —</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="side-oi">
        <div class="oi" id="oi-inst"></div>
        <div class="oi" id="oi-top"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/klinecharts@9/dist/umd/klinecharts.min.js"></script>
  <script>
    let session = "night";
    let snap = null;
    let hist = { night: [], day: [] };
    let live = false;
    let daySpan = 0;
    let chartMode = "line";
    let kInt = "1";
    let dailyPack = { night: [], day: [], daily: [], week: [] };
    let uncover = { inst: [], top: [], date: "" };
    let minutePack = {
      night_1m: [], day_1m: [],
      night_5m: [], day_5m: [],
      night_15m: [], day_15m: [],
    };
    let kchart = null;
    let miniChart = null;
    const LIVE = "https://wtx.19850926.xyz/";

    const $ = (id) => document.getElementById(id);

    function raw(v) {
      if (v && typeof v === "object") v = v.raw;
      return n(v);
    }

    function n(v) {
      if (v === "" || v == null) return null;
      const x = Number(String(v).replace(/,/g, ""));
      return Number.isFinite(x) ? x : null;
    }
    function fmt(v, d = 0) {
      if (v == null || v === "") return "—";
      const x = Number(v);
      if (!Number.isFinite(x)) return String(v);
      return x.toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    function cls(diff) {
      if (diff == null || diff === 0) return "flat";
      return diff > 0 ? "up" : "dn";
    }
    function arrow(diff) {
      if (diff == null || diff === 0) return "";
      return diff > 0 ? "▲" : "▼";
    }

    function q() {
      if (!snap) return null;
      if (session === "merge") return snap.night || snap.day;
      return snap[session];
    }

    function render() {
      const x = q();
      if (!x) {
        $("stamp").textContent = "尚無資料";
        return;
      }
      const last = n(x.CLastPrice);
      const ref = n(x.CRefPrice);
      let diff = n(x.CDiff);
      let rate = n(x.CDiffRate);
      if (diff == null && last != null && ref != null) {
        diff = last - ref;
        rate = ref ? (diff / ref) * 100 : 0;
      }
      $("name").textContent = String(x.DispCName || "台指期")
        .replace(/\s*WTX&\s*/g, "")
        .replace(/近一/g, "")
        .trim();
      $("last").className = "px " + cls(diff);
      $("last").textContent = last == null ? "—" : fmt(last, 0);
      $("chgline").className = "sub " + cls(diff);
      $("chgline").textContent =
        last == null ? "" : `${arrow(diff)} ${fmt(Math.abs(diff), 0)} (${diff >= 0 ? "" : ""}${fmt(rate, 2)}%)`;
      $("stamp").textContent = fmtTime(x.CDate, x.CTime);
      $("sumline").innerHTML =
        `<span class="sessico" id="sessToggle" title="${session === "day" ? "日盤，點一下切夜盤" : "夜盤，點一下切日盤"}">${session === "day" ? "☀️" : "🌙"}</span>` +
        `<div class="sumtxt">` +
        `股價 <b>${fmt(last, 0)}</b> <span class="${cls(diff)}">${arrow(diff)} ${fmt(diff, 0)}(${fmt(rate, 2)}%)</span>` +
        `　總口數 ${fmt(x.CTotalVolume)}<br>` +
        `昨收 ${fmt(x.CRefPrice)}　開盤 ${fmt(x.COpenPrice)}　最高 <span class="up">${fmt(x.CHighPrice)}</span>　最低 <span class="dn">${fmt(x.CLowPrice)}</span>` +
        `</div>`;

      let bidTot = 0, askTot = 0;
      const levels = [1, 2, 3, 4, 5];
      levels.forEach((i) => {
        bidTot += n(x["CBidSize" + i]) || 0;
        askTot += n(x["CAskSize" + i]) || 0;
      });
      const tot = bidTot + askTot;
      const pin = tot ? (bidTot / tot) * 100 : 50;
      $("barIn").style.width = pin + "%";
      $("barOut").style.width = (100 - pin) + "%";
      const inn = n(x.inMarket), outv = n(x.outMarket);
      if (inn != null && outv != null && inn + outv > 0) {
        const pin2 = (inn / (inn + outv)) * 100;
        $("barIn").style.width = pin2 + "%";
        $("barOut").style.width = (100 - pin2) + "%";
        $("inTxt").textContent = "內盤 " + fmt(inn);
        $("outTxt").textContent = "外盤 " + fmt(outv);
      } else {
        $("inTxt").textContent = "委買 " + fmt(bidTot);
        $("outTxt").textContent = "委賣 " + fmt(askTot);
      }

      let maxSz = 1;
      levels.forEach((i) => {
        maxSz = Math.max(maxSz, n(x["CBidSize" + i]) || 0, n(x["CAskSize" + i]) || 0);
      });
      let ob = `<colgroup><col class="c-qty"><col class="c-bar"><col class="c-px"><col class="c-px"><col class="c-bar"><col class="c-qty"></colgroup>`;
      ob += `<tr><td class="lab bid">口</td><td></td><td class="pxb">買價</td><td class="pxa">賣價</td><td></td><td class="lab ask">口</td></tr>`;
      levels.forEach((i) => {
        const bs = n(x["CBidSize" + i]) || 0;
        const asz = n(x["CAskSize" + i]) || 0;
        const bw = Math.round((bs / maxSz) * 100);
        const aw = Math.round((asz / maxSz) * 100);
        ob += `<tr>
          <td class="qty bid">${fmt(x["CBidSize" + i])}</td>
          <td class="bar-bid"><span class="szbar r" style="width:${bw}%"></span></td>
          <td class="pxb">${fmt(x["CBidPrice" + i])}</td>
          <td class="pxa">${fmt(x["CAskPrice" + i])}</td>
          <td class="bar-ask"><span class="szbar" style="width:${aw}%"></span></td>
          <td class="qty ask">${fmt(x["CAskSize" + i])}</td>
        </tr>`;
      });
      $("ob").innerHTML = ob;
      $("live").className = "live" + (live ? " on" : "");
      $("live").textContent = live ? "LIVE" : "快照";
      renderOi();
      drawMiniK();
      draw();
    }

    function signed(v) {
      if (v == null) return "—";
      const x = Number(v);
      const c = x > 0 ? "up" : x < 0 ? "dn" : "flat";
      return `<span class="${c}">${fmt(x)}</span>`;
    }

    function renderOi() {
      const left = $("oi-inst");
      const right = $("oi-top");
      if (!left || !right) return;
      const inst = uncover.inst || [];
      const top = uncover.top || [];
      if (inst.length) {
        let h = `<h4>法人未平倉 ${uncover.date || ""}</h4>`;
        h += `<table><tr><th>項目</th><th>多單</th><th>空單</th><th>淨額</th></tr>`;
        inst.forEach((r) => {
          const nm = String(r.name || "")
            .replace("外資及陸資", "外")
            .replace("投信", "投")
            .replace("自營商", "自")
            .replace("三大法人合計", "合計");
          h += `<tr><td>${nm}</td><td class="up">${fmt(r.long)}</td><td class="dn">${fmt(r.short)}</td><td>${signed(r.net)}</td></tr>`;
        });
        h += `</table>`;
        left.innerHTML = h;
      } else left.innerHTML = "";
      if (top.length) {
        const r = top[0];
        let h = `<h4>${r.type || "前十大交易人合計"}</h4>`;
        h += `<table><tr><th></th><th>部位數</th><th>百分比</th></tr>`;
        h += `<tr><td>買方</td><td>${fmt(r.long)}</td><td>${r.longPct == null ? "—" : fmt(r.longPct, 1) + "%"}</td></tr>`;
        h += `<tr><td>賣方</td><td>${fmt(r.short)}</td><td>${r.shortPct == null ? "—" : fmt(r.shortPct, 1) + "%"}</td></tr>`;
        const net = (n(r.long) || 0) - (n(r.short) || 0);
        h += `<tr><td>淨部位</td><td>${signed(net)}</td><td></td></tr>`;
        if (r.open != null) h += `<tr><td>非沖銷部位</td><td>${fmt(r.open)}</td><td></td></tr>`;
        h += `</table>`;
        right.innerHTML = h;
      } else right.innerHTML = "";
    }

    function fmtTime(d, t) {
      if (!d) return "—";
      const ds = String(d);
      const ts = String(t || "000000").padStart(6, "0");
      return `${ds.slice(4, 6)}/${ds.slice(6, 8)} ${ts.slice(0, 2)}:${ts.slice(2, 4)}:${ts.slice(4, 6)}`;
    }

    function liveSess() {
      const hm = new Date().getHours() * 100 + new Date().getMinutes();
      return hm >= 845 && hm < 1500 ? "day" : "night";
    }
    function sessKey() {
      if (session === "day") return "day";
      if (session === "night") return "night";
      return liveSess();
    }

    function joinBars(a, b) {
      return (a || []).concat(b || []).sort((x, y) => x.timestamp - y.timestamp);
    }

    function packBars() {
      if (session === "merge") {
        return {
          m1: joinBars(minutePack.night_1m, minutePack.day_1m),
          m5: joinBars(minutePack.night_5m, minutePack.day_5m),
          m15: joinBars(minutePack.night_15m, minutePack.day_15m),
        };
      }
      const k = sessKey();
      return {
        m1: minutePack[k + "_1m"] || [],
        m5: minutePack[k + "_5m"] || [],
        m15: minutePack[k + "_15m"] || [],
      };
    }

    function lastDates(nDays) {
      const { m1, m5, m15 } = packBars();
      const bars = m15.concat(m5, m1);
      const dates = [];
      for (let i = bars.length - 1; i >= 0 && dates.length < nDays; i--) {
        const d = bars[i].date;
        if (d && dates.indexOf(d) < 0) dates.push(d);
      }
      return dates;
    }

    function minuteSeries() {
      const { m1, m5, m15 } = packBars();
      const n = daySpan < 1 ? 1 : daySpan;
      const keep = lastDates(n);
      const take = (rows) => rows.filter((b) => keep.indexOf(b.date) >= 0);
      if (n <= 1) {
        const a = take(m1);
        return a.length >= 2 ? a : take(m5);
      }
      const have5 = {};
      m5.forEach((b) => { have5[b.date] = true; });
      const out = [];
      keep.slice().reverse().forEach((d) => {
        const src = have5[d] ? m5 : m15;
        src.forEach((b) => { if (b.date === d) out.push(b); });
      });
      if (out.length >= 2) return out;
      const t15 = take(m15);
      if (t15.length >= 2) return t15;
      return take(m5).length ? take(m5) : take(m1);
    }

    function mergeBarLists(a, b) {
      const by = {};
      (a || []).concat(b || []).forEach((row) => {
        if (row && row.timestamp) by[row.timestamp] = row;
      });
      return Object.keys(by).sort((x, y) => x - y).map((k) => by[k]);
    }

    function fillMinutes(bars) {
      if (!bars || bars.length < 2) return bars || [];
      const step = 60000;
      const out = [bars[0]];
      for (let i = 1; i < bars.length; i++) {
        const prev = out[out.length - 1];
        const b = bars[i];
        const hole = b.timestamp - prev.timestamp;
        if (hole > step * 1.5 && hole <= 150000) {
          for (let t = prev.timestamp + step; t < b.timestamp - 30000; t += step) {
            out.push({
              timestamp: t, open: prev.close, high: prev.close, low: prev.close, close: prev.close,
              volume: 0, date: prev.date, session: prev.session,
            });
          }
        }
        out.push(b);
      }
      return out;
    }

    function save1m() {
      try {
        localStorage.setItem("txf1m", JSON.stringify({
          night: minutePack.night_1m, day: minutePack.day_1m, t: Date.now(),
        }));
      } catch (e) {}
    }

    function loadLocal1m() {
      try {
        const j = JSON.parse(localStorage.getItem("txf1m") || "null");
        if (!j) return;
        minutePack.night_1m = mergeBarLists(minutePack.night_1m, j.night);
        minutePack.day_1m = mergeBarLists(minutePack.day_1m, j.day);
      } catch (e) {}
    }

    function bumpLiveBar() {
      const px = n(q() && q().CLastPrice);
      if (px == null) return;
      const key = sessKey() + "_1m";
      const rows = minutePack[key] || [];
      if (!rows.length) return;
      const slot = Math.floor(Date.now() / 60000) * 60000;
      const last = rows[rows.length - 1];
      const lastSlot = Math.floor(last.timestamp / 60000) * 60000;
      if (lastSlot === slot) {
        last.close = px;
        last.high = Math.max(last.high, px);
        last.low = Math.min(last.low, px);
      } else if (slot > lastSlot && slot - lastSlot <= 150000) {
        rows.push({
          timestamp: slot, open: last.close, high: Math.max(last.close, px),
          low: Math.min(last.close, px), close: px, volume: 0,
          date: last.date, session: sessKey(),
        });
        minutePack[key] = rows;
      }
      save1m();
    }

    function linePoints() {
      const keep = lastDates(daySpan < 1 ? 1 : daySpan);
      const mins = fillMinutes(minuteSeries().filter((b) => keep.indexOf(b.date) >= 0));
      return mins.map((b) => ({ px: b.close, vol: b.volume, time: b.timestamp }));
    }

    function sessRange(pts) {
      const tRef = pts.length ? pts[pts.length - 1].time : Date.now();
      const d = new Date(tRef);
      const start = new Date(d);
      const useDay = session === "day" || (session === "merge" && liveSess() === "day");
      if (useDay) {
        start.setHours(8, 45, 0, 0);
        const end = new Date(start);
        end.setHours(13, 45, 0, 0);
        return { t0: start.getTime(), t1: end.getTime() };
      }
      if (d.getHours() < 15) start.setDate(start.getDate() - 1);
      start.setHours(15, 0, 0, 0);
      const days = daySpan < 1 ? 1 : daySpan;
      start.setDate(start.getDate() - (days - 1));
      const end = new Date(start);
      end.setDate(end.getDate() + days);
      end.setHours(5, 0, 0, 0);
      return { t0: start.getTime(), t1: end.getTime() };
    }

    function mergeDaily() {
      const by = {};
      (dailyPack.night || []).concat(dailyPack.day || []).forEach((b) => {
        const d = b.date || b.timestamp;
        if (!by[d]) {
          by[d] = Object.assign({}, b);
          return;
        }
        const o = by[d];
        o.high = Math.max(o.high, b.high);
        o.low = Math.min(o.low, b.low);
        o.close = b.close;
        o.volume = (o.volume || 0) + (b.volume || 0);
        if ((b.timestamp || 0) > (o.timestamp || 0)) o.timestamp = b.timestamp;
      });
      return Object.keys(by).sort().map((k) => by[k]);
    }

    function dailyBars() {
      return dailyPack.daily || dailyPack.night || [];
    }

    function resample(bars, ms) {
      const out = [];
      let cur = null;
      (bars || []).forEach((b) => {
        const slot = Math.floor(b.timestamp / ms) * ms;
        if (!cur || cur.timestamp !== slot) {
          if (cur) out.push(cur);
          cur = {
            timestamp: slot,
            open: b.open, high: b.high, low: b.low, close: b.close,
            volume: b.volume || 0, date: b.date,
          };
        } else {
          cur.high = Math.max(cur.high, b.high);
          cur.low = Math.min(cur.low, b.low);
          cur.close = b.close;
          cur.volume += b.volume || 0;
        }
      });
      if (cur) out.push(cur);
      return out;
    }

    function foldDaily(bars, keyFn) {
      const by = {};
      (bars || []).forEach((b) => {
        const k = keyFn(b);
        if (!by[k]) {
          by[k] = {
            timestamp: b.timestamp,
            open: b.open, high: b.high, low: b.low, close: b.close,
            volume: b.volume || 0, date: b.date,
          };
          return;
        }
        const o = by[k];
        o.high = Math.max(o.high, b.high);
        o.low = Math.min(o.low, b.low);
        o.close = b.close;
        o.volume += b.volume || 0;
      });
      return Object.keys(by).sort().map((k) => by[k]);
    }

    function weekKey(b) {
      const d = new Date(b.timestamp);
      const day = d.getDay();
      const diff = day === 0 ? 6 : day - 1;
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - diff);
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    function klineData() {
      const { m1, m5, m15 } = packBars();
      if (kInt === "1") return m1.length ? m1 : m5;
      if (kInt === "5") return m5.length ? m5 : resample(m1, 5 * 60 * 1000);
      if (kInt === "15") return m15.length ? m15 : resample(m5.length ? m5 : m1, 15 * 60 * 1000);
      if (kInt === "30") return resample(m15.length ? m15 : (m5.length ? m5 : m1), 30 * 60 * 1000);
      if (kInt === "w") return dailyPack.week && dailyPack.week.length ? dailyPack.week : foldDaily(dailyBars(), weekKey);
      return dailyBars();
    }

    function fitCanvas(c, cssH) {
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(1, Math.round(c.clientWidth || c.width));
      const h = cssH || Math.max(1, Math.round(c.clientHeight || 280));
      c.style.height = h + "px";
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
      const ctx = c.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, w, h };
    }

    function draw() {
      const lineOn = chartMode === "line";
      $("chart").style.display = lineOn ? "block" : "none";
      $("khost").style.display = lineOn ? "none" : "block";
      if (!lineOn) {
        renderK();
        return;
      }
      const c = $("chart");
      const { ctx, w, h } = fitCanvas(c, 280);
      ctx.clearRect(0, 0, w, h);
      const pts = linePoints();
      if (pts.length < 2) {
        ctx.fillStyle = "#9ca3af";
        ctx.font = "14px sans-serif";
        ctx.fillText("走勢累積中…", 16, h / 2);
        return;
      }
      const prices = pts.map((p) => p.px);
      const qx0 = q();
      const open = n(qx0 && qx0.COpenPrice) || prices[0];
      const hi = Math.max(...prices, open, n(qx0 && qx0.CHighPrice) ?? -Infinity);
      const lo = Math.min(...prices, open, n(qx0 && qx0.CLowPrice) ?? Infinity);
      let mx = Math.ceil((hi + 100) / 100) * 100;
      let mn = Math.floor((lo - 100) / 100) * 100;
      if (!(mx > mn)) { mx = mn + 200; }
      const { t0, t1 } = sessRange(pts);
      const padL = 56, padR = 33, padT = 10, padB = 26;
      const cw = w - padL - padR;
      const ch = h - padT - padB;
      const xAtT = (t) => padL + ((t - t0) / (t1 - t0)) * cw;
      const yAt = (p) => padT + (1 - (p - mn) / (mx - mn)) * ch;

      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#6b7280";
      ctx.font = "11px sans-serif";
      for (let pv = mn; pv <= mx; pv += 100) {
        const y = Math.round(yAt(pv)) + 0.5;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(w - padR, y);
        ctx.stroke();
        ctx.fillText(pv.toLocaleString("zh-TW"), 4, y + 4);
      }
      const hour0 = new Date(t0);
      hour0.setMinutes(0, 0, 0);
      if (hour0.getTime() < t0) hour0.setHours(hour0.getHours() + 1);
      const hourStep = (t1 - t0) > 20 * 3600000 ? 2 : 1;
      ctx.textAlign = "center";
      for (let t = hour0.getTime(); t <= t1; t += 3600000 * hourStep) {
        const x = Math.round(xAtT(t)) + 0.5;
        ctx.beginPath();
        ctx.moveTo(x, padT);
        ctx.lineTo(x, padT + ch);
        ctx.stroke();
        const hh = new Date(t).getHours();
        ctx.fillText(String(hh).padStart(2, "0"), x, h - 6);
      }
      ctx.textAlign = "left";

      const yOpen = Math.round(yAt(open)) + 0.5;
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = "#9ca3af";
      ctx.beginPath();
      ctx.moveTo(padL, yOpen);
      ctx.lineTo(w - padR, yOpen);
      ctx.stroke();
      ctx.setLineDash([]);

      const fills = [];
      const lines = [];
      function paintSeg(x0, y0, p0, x1, y1, p1) {
        if ((p0 - open) * (p1 - open) < 0 && p1 !== p0) {
          const t = (open - p0) / (p1 - p0);
          const xm = x0 + (x1 - x0) * t;
          paintSeg(x0, y0, p0, xm, yOpen, open);
          paintSeg(xm, yOpen, open, x1, y1, p1);
          return;
        }
        const above = p0 > open || p1 > open || (p0 === open && p1 >= open);
        fills.push({ x0, y0, x1, y1, above });
        lines.push({ x0, y0, x1, y1, above });
      }
      const gap = daySpan < 1 ? 150000 : 20 * 60 * 1000;
      for (let i = 1; i < pts.length; i++) {
        const tA = pts[i - 1].time, tB = pts[i].time;
        if (!tA || !tB || tB - tA > gap) continue;
        paintSeg(xAtT(tA), yAt(pts[i - 1].px), pts[i - 1].px, xAtT(tB), yAt(pts[i].px), pts[i].px);
      }
      fills.forEach((s) => {
        ctx.beginPath();
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(s.x1, s.y1);
        ctx.lineTo(s.x1, yOpen);
        ctx.lineTo(s.x0, yOpen);
        ctx.closePath();
        ctx.fillStyle = s.above ? "rgba(211,47,47,0.10)" : "rgba(27,138,62,0.10)";
        ctx.fill();
      });
      ctx.lineWidth = 1;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      lines.forEach((s) => {
        ctx.beginPath();
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(s.x1, s.y1);
        ctx.strokeStyle = s.above ? "#d32f2f" : "#1b8a3e";
        ctx.stroke();
      });

      const qx = q();
      const o = n(qx && qx.COpenPrice), barH = n(qx && qx.CHighPrice), barL = n(qx && qx.CLowPrice), cl = n(qx && qx.CLastPrice);
      if ([o, barH, barL, cl].every((v) => v != null)) {
        const mid = Math.round(w - 14) + 0.5;
        const yH = yAt(barH), yL = yAt(barL);
        const yTop = yAt(Math.max(o, cl));
        const yBot = yAt(Math.min(o, cl));
        const col = cl >= o ? "#d32f2f" : "#1b8a3e";
        ctx.strokeStyle = col;
        ctx.fillStyle = col;
        ctx.lineWidth = 2;
        ctx.lineCap = "butt";
        ctx.beginPath();
        ctx.moveTo(mid, yH);
        ctx.lineTo(mid, yL);
        ctx.stroke();
        const bh = Math.max(2, yBot - yTop);
        ctx.fillRect(mid - 6.5, yTop, 13, bh);
      }
    }

    function liveDayBar() {
      const x = q();
      if (!x) return null;
      const c = n(x.CLastPrice);
      if (c == null) return null;
      const o = n(x.COpenPrice);
      const h = n(x.CHighPrice);
      const l = n(x.CLowPrice);
      const ds = String(x.CDate || "");
      const date = ds.length === 8 ? ds.slice(0, 4) + "-" + ds.slice(4, 6) + "-" + ds.slice(6, 8) : "";
      if (!date) return null;
      const p = date.split("-");
      const ts = Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 5, 45);
      return {
        timestamp: ts,
        open: o == null ? c : o,
        high: h == null ? c : h,
        low: l == null ? c : l,
        close: c,
        volume: n(x.CTotalVolume) || 0,
        date,
      };
    }

    function miniBars() {
      const all = dailyBars().slice();
      const liveBar = liveDayBar();
      if (liveBar) {
        const last = all[all.length - 1];
        if (last && last.date === liveBar.date) all[all.length - 1] = Object.assign({}, last, liveBar, { timestamp: last.timestamp });
        else all.push(liveBar);
      }
      return all;
    }

    function miniFit36() {
      const el = $("minik");
      if (!miniChart || !el) return;
      const w = el.clientWidth || 300;
      const space = Math.max(4, (w - 60) / 36);
      miniChart.setBarSpace(space);
    }

    function drawMiniK() {
      if (typeof klinecharts === "undefined") return;
      const el = $("minik");
      if (!el) return;
      const bars = miniBars();
      if (bars.length < 2) return;
      if (!miniChart) {
        if (el.clientWidth < 40 || el.clientHeight < 40) {
          setTimeout(drawMiniK, 80);
          return;
        }
        miniChart = klinecharts.init(el, { styles: miniStyles() });
        if (!miniChart) return;
        if (miniChart.setPrecision) miniChart.setPrecision({ price: 0, volume: 0 });
        else if (miniChart.setPriceVolumePrecision) miniChart.setPriceVolumePrecision(0, 0);
        miniChart.setOffsetRightDistance(3);
        miniFit36();
        miniChart.applyNewData(bars);
        if (miniChart.resize) miniChart.resize();
        miniFit36();
        return;
      }
      const have = miniChart.getDataList ? miniChart.getDataList().length : 0;
      if (have < bars.length - 1) {
        miniChart.applyNewData(bars);
        if (miniChart.resize) miniChart.resize();
        return;
      }
      const liveBar = liveDayBar();
      if (liveBar) {
        const last = bars[bars.length - 1];
        if (last) liveBar.timestamp = last.timestamp;
        miniChart.updateData(liveBar);
      }
    }

    function twStyles() {
      return {
        candle: {
          bar: {
            upColor: "#d32f2f", downColor: "#1b8a3e", noChangeColor: "#888888",
            upBorderColor: "#d32f2f", downBorderColor: "#1b8a3e", noChangeBorderColor: "#888888",
            upWickColor: "#d32f2f", downWickColor: "#1b8a3e", noChangeWickColor: "#888888",
          },
          tooltip: {
            title: { show: false },
            legend: {
              template: [
                { title: "開 ", value: "{open}" },
                { title: "高 ", value: "{high}" },
                { title: "低 ", value: "{low}" },
                { title: "收 ", value: "{close}" },
              ],
            },
          },
        },
        indicator: {
          bars: [{ upColor: "#d32f2f", downColor: "#1b8a3e", noChangeColor: "#888" }],
          tooltip: { showRule: "none" },
        },
      };
    }

    function miniStyles() {
      const s = twStyles();
      s.candle.tooltip = { showRule: "none" };
      s.indicator.tooltip = { showRule: "none" };
      s.xAxis = { size: 18, tickText: { size: 10, color: "#6b7280" }, axisLine: { show: false } };
      s.yAxis = {
        size: 52,
        inside: false,
        tickText: { size: 10, color: "#6b7280", marginStart: 4 },
        axisLine: { show: false },
      };
      s.grid = { show: true, horizontal: { color: "#eee" }, vertical: { color: "#f3f4f6" } };
      return s;
    }

    function renderK() {
      if (typeof klinecharts === "undefined") return;
      const data = klineData();
      if (!kchart) {
        kchart = klinecharts.init("khost", { styles: twStyles() });
        if (kchart.setPrecision) kchart.setPrecision({ price: 0, volume: 0 });
        else if (kchart.setPriceVolumePrecision) kchart.setPriceVolumePrecision(0, 0);
      }
      kchart.applyNewData(data.length ? data : []);
    }

    function slimYahoo(d) {
      const last = raw(d.price);
      const ref = raw(d.regularMarketPreviousClose);
      let diff = raw(d.change);
      if (diff == null && last != null && ref != null) diff = last - ref;
      let rate = null;
      const cp = d.changePercent;
      if (typeof cp === "string" && cp.endsWith("%")) rate = parseFloat(cp);
      if (rate == null && diff != null && ref) rate = (diff / ref) * 100;
      const now = new Date();
      const q = {
        SymbolID: d.symbol || "WTX&",
        DispCName: d.symbolName || "台指期近一",
        DispEName: d.symbol || "WTX&",
        CLastPrice: last,
        COpenPrice: raw(d.regularMarketOpen),
        CHighPrice: raw(d.regularMarketDayHigh),
        CLowPrice: raw(d.regularMarketDayLow),
        CRefPrice: ref,
        CDiff: diff,
        CDiffRate: rate,
        CTotalVolume: raw(d.volume) != null ? raw(d.volume) : Math.round((raw(d.volumeK) || 0) * 1000),
        CDate: now.getFullYear() + String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0"),
        CTime: String(now.getHours()).padStart(2, "0") + String(now.getMinutes()).padStart(2, "0") + String(now.getSeconds()).padStart(2, "0"),
        inMarket: raw(d.inMarket) != null ? Math.round(raw(d.inMarket) * 1000) : "",
        outMarket: raw(d.outMarket) != null ? Math.round(raw(d.outMarket) * 1000) : "",
      };
      const book = d.orderbook || [];
      for (let i = 0; i < 5; i++) {
        const lvl = book[i] || {};
        q["CBidPrice" + (i + 1)] = raw(lvl.bid);
        q["CBidSize" + (i + 1)] = raw(lvl.bidVol);
        q["CAskPrice" + (i + 1)] = raw(lvl.ask);
        q["CAskSize" + (i + 1)] = raw(lvl.askVol);
      }
      return q;
    }

    function applyLive(rows) {
      const wtx = rows.find((x) => x.symbol === "WTX&") || rows[0];
      if (!wtx) return;
      const q0 = slimYahoo(wtx);
      snap = {
        fetchedAt: new Date().toLocaleString("zh-TW", { hour12: false }),
        source: "yahoo via wtx.19850926.xyz",
        night: q0,
        day: q0,
      };
      const px = n(q0.CLastPrice);
      if (px) {
        const pt = { t: snap.fetchedAt, ts: Date.now(), time: q0.CTime, px, vol: n(q0.CTotalVolume) || 0 };
        const h = hist.night;
        if (!h.length || h[h.length - 1].px !== px || h[h.length - 1].time !== pt.time) {
          h.push(pt);
          if (h.length > 800) h.splice(0, h.length - 800);
          hist.day = h;
        }
      }
      live = true;
      bumpLiveBar();
      render();
    }

    async function pollLive() {
      try {
        const rows = await fetch(LIVE + "?t=" + Date.now()).then((r) => r.json());
        if (Array.isArray(rows) && rows.length) applyLive(rows);
      } catch (e) {
        live = false;
        if ($("live")) {
          $("live").className = "live";
          $("live").textContent = "快照";
        }
      }
    }

    async function load() {
      const [s, hn, hd] = await Promise.all([
        fetch("data/snapshot.json?t=" + Date.now()).then((r) => r.json()),
        fetch("data/history-night.json?t=" + Date.now()).then((r) => (r.ok ? r.json() : [])).catch(() => []),
        fetch("data/history-day.json?t=" + Date.now()).then((r) => (r.ok ? r.json() : [])).catch(() => []),
      ]);
      if (!live) {
        snap = s;
        hist.night = hn;
        hist.day = hd;
        render();
      }
    }

    function setSession(s) {
      session = s === "day" ? "day" : "night";
      render();
    }
    $("sumline").onclick = (e) => {
      if (e.target.id === "sessToggle" || e.target.closest("#sessToggle")) {
        setSession(session === "day" ? "night" : "day");
      }
    };
    function markChips() {
      document.querySelectorAll(".chip[data-k]").forEach((b) => {
        b.classList.toggle("on", chartMode === "k" && b.getAttribute("data-k") === kInt);
      });
      document.querySelectorAll(".chip[data-line]").forEach((b) => {
        b.classList.toggle("on", chartMode === "line" && Number(b.getAttribute("data-line")) === daySpan);
      });
    }

    document.querySelectorAll(".chip[data-k]").forEach((btn) => {
      btn.onclick = () => {
        chartMode = "k";
        kInt = btn.getAttribute("data-k");
        markChips();
        draw();
      };
    });
    document.querySelectorAll(".chip[data-line]").forEach((btn) => {
      btn.onclick = () => {
        chartMode = "line";
        daySpan = Number(btn.getAttribute("data-line"));
        markChips();
        draw();
      };
    });

    function classifyTs(tsSec) {
      const dt = new Date(tsSec * 1000);
      const hm = dt.getHours() * 100 + dt.getMinutes();
      const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      if (hm >= 1500 || hm < 500) {
        const d = new Date(dt);
        if (hm < 500) d.setDate(d.getDate() - 1);
        return { sess: "night", date: iso(d) };
      }
      if (hm >= 845 && hm <= 1345) return { sess: "day", date: iso(dt) };
      return null;
    }

    function applyYahoo1m(chart) {
      const tsList = chart.timestamp || [];
      const q = (((chart.indicators || {}).quote) || [{}])[0] || {};
      const opens = q.open || [], highs = q.high || [], lows = q.low || [], closes = q.close || [], vols = q.volume || [];
      const night = [], day = [];
      tsList.forEach((ts, i) => {
        const c = closes[i];
        if (c == null) return;
        const hit = classifyTs(ts);
        if (!hit) return;
        const row = {
          timestamp: ts * 1000,
          open: opens[i] != null ? opens[i] : c,
          high: highs[i] != null ? highs[i] : c,
          low: lows[i] != null ? lows[i] : c,
          close: c,
          volume: Math.round((vols[i] || 0) * 1000),
          date: hit.date,
          session: hit.sess,
        };
        (hit.sess === "night" ? night : day).push(row);
      });
      if (night.length) minutePack.night_1m = mergeBarLists(minutePack.night_1m, night);
      if (day.length) minutePack.day_1m = mergeBarLists(minutePack.day_1m, day);
      save1m();
      draw();
    }

    async function poll1m() {
      try {
        const j = await fetch(LIVE + "?kind=1m&t=" + Date.now()).then((r) => r.json());
        if (j && (j.timestamp || []).length) applyYahoo1m(j);
      } catch (e) {}
    }

    async function loadKline() {
      try {
        const pack = await fetch("data/kline-daily.json?t=" + Date.now()).then((r) => r.json());
        dailyPack.night = pack.night || [];
        dailyPack.day = pack.day || [];
        dailyPack.daily = pack.daily || pack.night || [];
        dailyPack.week = pack.week || [];
      } catch (e) {}
      try {
        const m = await fetch("data/kline-minute.json?t=" + Date.now()).then((r) => r.json());
        ["night_1m","day_1m","night_5m","day_5m","night_15m","day_15m"].forEach((k) => {
          minutePack[k] = mergeBarLists(minutePack[k], m[k] || []);
        });
        loadLocal1m();
        save1m();
        if (!minutePack.night_1m.length && (m.night || []).length) {
          minutePack.night_1m = m.night;
          minutePack.day_1m = m.day || [];
        }
      } catch (e) {}
      try {
        uncover = await fetch("data/uncovered.json?t=" + Date.now()).then((r) => r.json());
      } catch (e) {
        uncover = { inst: [], top: [], date: "" };
      }
      renderOi();
      drawMiniK();
      draw();
    }

    window.addEventListener("resize", () => {
      if (miniChart && miniChart.resize) miniChart.resize();
      miniFit36();
      if (kchart && kchart.resize) kchart.resize();
      draw();
    });
    session = liveSess();
    markChips();
    loadLocal1m();
    load();
    loadKline();
    pollLive();
    poll1m();
    setInterval(pollLive, 5000);
    setInterval(poll1m, 10000);
    setInterval(loadKline, 60000);
  </script>
