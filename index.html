<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台指期 TXF — 即時看盤</title>
  <style>
    :root {
      --up: #d32f2f;
      --dn: #1b8a3e;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f3f4f6;
      --card: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: #111827;
    }
    .wrap { max-width: 1100px; margin: 16px auto; padding: 0 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 12px;
    }
    #daychips { display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
    #daychips.show { display: flex; }
    .hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
    @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
    .title-row { display: flex; align-items: center; gap: 8px; }
    .title { font-size: 22px; font-weight: 800; }
    .related { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .rel {
      border: 2px solid #2563eb;
      border-radius: 8px;
      padding: 8px 12px;
      min-width: 168px;
      background: #f8fbff;
    }
    .rel .n { font-size: 13px; font-weight: 700; color: #1e3a8a; }
    .rel .p { font-size: 22px; font-weight: 800; margin: 2px 0; }
    .rel .c { font-size: 12px; }
    .badge {
      font-size: 12px; background: #fef3c7; color: #92400e;
      border-radius: 4px; padding: 2px 6px; font-weight: 700;
    }
    .px { font-size: 40px; font-weight: 800; letter-spacing: -1px; margin: 8px 0 4px; }
    .sub { font-size: 13px; color: var(--muted); }
    .tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
    .tab {
      background: none; border: 0; padding: 10px 2px 8px;
      font-size: 15px; cursor: pointer; color: #374151; font-weight: 600;
    }
    .tab.on { color: #b91c1c; border-bottom: 2px solid #b91c1c; }
    .grid { display: grid; grid-template-columns: 1.35fr 0.95fr; gap: 16px; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    .meta { font-size: 13px; line-height: 1.7; color: #374151; }
    canvas { width: 100%; height: 280px; display: block; }
    .chips { display: flex; gap: 8px; margin: 6px 0 10px; flex-wrap: wrap; }
    .chip, .mode {
      background: #f3f4f6; border: 0; border-radius: 4px; padding: 4px 10px;
      font-size: 13px; cursor: pointer; font-weight: 600; color: #374151;
    }
    .chip.on, .mode.on { background: #b91c1c; color: #fff; }
    #khost { width: 100%; height: 320px; display: none; }
    table.q { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.q td { padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
    table.q td:nth-child(2), table.q td:nth-child(4) { text-align: right; font-variant-numeric: tabular-nums; }
    table.q td.lab { color: #6b7280; }
    .ob { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .ob td { padding: 4px 6px; font-variant-numeric: tabular-nums; }
    .ob .bid { color: var(--dn); text-align: right; }
    .ob .ask { color: var(--up); }
    .bar-wrap { display: flex; height: 10px; border-radius: 4px; overflow: hidden; margin: 8px 0; background: #eee; }
    .bar-in { background: var(--dn); }
    .bar-out { background: var(--up); }
    .up { color: var(--up); }
    .dn { color: var(--dn); }
    .flat { color: #111; }
    .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
    .live { font-size: 11px; margin-left: 8px; color: #9ca3af; }
    .live.on { color: #16a34a; }
    .szbar { display: inline-block; height: 10px; vertical-align: middle; background: #fecaca; }
    .szbar.g { background: #bbf7d0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="hero">
        <div>
          <div class="title-row">
            <div class="title" id="name">台指期 TXF</div>
            <span class="badge">期貨</span>
            <span class="live" id="live">未連線</span>
          </div>
          <div class="px flat" id="last">—</div>
          <div class="sub" id="chgline"></div>
          <div class="sub" id="stamp">載入中…</div>
        </div>
        <div class="related" id="related"></div>
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab" id="tab-day" type="button">日盤</button>
        <button class="tab on" id="tab-night" type="button">夜盤</button>
      </div>
      <div class="grid">
        <div>
          <div class="chips">
            <button class="mode on" id="mode-k" type="button">K線</button>
            <button class="mode" id="mode-line" type="button">走勢</button>
            <span id="daychips">
              <button class="chip on" data-days="1" type="button">當日</button>
              <button class="chip" data-days="2" type="button">二日</button>
              <button class="chip" data-days="3" type="button">三日</button>
              <button class="chip" data-days="4" type="button">四日</button>
              <button class="chip" data-days="5" type="button">五日</button>
            </span>
          </div>
          <div class="meta" id="sumline"></div>
          <canvas id="chart" width="720" height="280"></canvas>
          <div id="khost"></div>
        </div>
        <div>
          <table class="q" id="stats"></table>
          <div class="bar-wrap" title="僅買一／賣一口數近似，非正式內外盤">
            <div class="bar-in" id="barIn" style="width:50%"></div>
            <div class="bar-out" id="barOut" style="width:50%"></div>
          </div>
          <div class="sub" id="inoutlab">買一口數 —　賣一口數 —</div>
          <table class="ob" id="ob"></table>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/klinecharts@9/dist/umd/klinecharts.min.js"></script>
  <script>
    let session = "night";
    let snap = null;
    let hist = { night: [], day: [] };
    let live = false;
    let daySpan = 1;
    let chartMode = "k";
    let dailyPack = { night: [], day: [] };
    let minutePack = {
      night_1m: [], day_1m: [],
      night_5m: [], day_5m: [],
      night_15m: [], day_15m: [],
    };
    let kchart = null;
    const LIVE = "https://wtx.19850926.xyz/";

    const $ = (id) => document.getElementById(id);

    function raw(v) {
      if (v && typeof v === "object") v = v.raw;
      return n(v);
    }

    function n(v) {
      if (v === "" || v == null) return null;
      const x = Number(String(v).replace(/,/g, ""));
      return Number.isFinite(x) ? x : null;
    }
    function fmt(v, d = 0) {
      if (v == null || v === "") return "—";
      const x = Number(v);
      if (!Number.isFinite(x)) return String(v);
      return x.toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    function cls(diff) {
      if (diff == null || diff === 0) return "flat";
      return diff > 0 ? "up" : "dn";
    }
    function arrow(diff) {
      if (diff == null || diff === 0) return "";
      return diff > 0 ? "▲" : "▼";
    }

    function q() {
      return snap && snap[session];
    }

    function render() {
      const x = q();
      if (!x) {
        $("stamp").textContent = "尚無資料";
        return;
      }
      const last = n(x.CLastPrice);
      const ref = n(x.CRefPrice);
      let diff = n(x.CDiff);
      let rate = n(x.CDiffRate);
      if (diff == null && last != null && ref != null) {
        diff = last - ref;
        rate = ref ? (diff / ref) * 100 : 0;
      }
      $("name").textContent = (x.DispCName || "台指期") + " " + (x.DispEName || "TXF");
      $("last").className = "px " + cls(diff);
      $("last").textContent = last == null ? "—" : fmt(last, 0);
      $("chgline").className = "sub " + cls(diff);
      $("chgline").textContent =
        last == null ? "" : `${arrow(diff)} ${fmt(Math.abs(diff), 0)} (${diff >= 0 ? "" : ""}${fmt(rate, 2)}%)`;
      $("stamp").textContent =
        `報價 ${fmtTime(x.CDate, x.CTime)}　快照 ${snap.fetchedAt}　${x.SymbolID || ""}`;
      $("sumline").innerHTML =
        `股價 ${fmt(last, 2)} <span class="${cls(diff)}">${arrow(diff)} ${fmt(diff, 0)}(${fmt(rate, 2)}%)</span>` +
        `　交易量 ${fmt(x.CTotalVolume)}<br>` +
        `開盤 ${fmt(x.COpenPrice)}　昨收 ${fmt(x.CRefPrice)}　最高 ${fmt(x.CHighPrice)}　最低 ${fmt(x.CLowPrice)}`;

      const rows = [
        ["成交", fmt(x.CLastPrice), "漲跌幅", (rate == null ? "—" : fmt(rate, 2) + "%")],
        ["開盤", fmt(x.COpenPrice), "漲跌", fmt(x.CDiff)],
        ["最高", fmt(x.CHighPrice), "買價", fmt(x.CBidPrice1)],
        ["最低", fmt(x.CLowPrice), "賣價", fmt(x.CAskPrice1)],
        ["昨收", fmt(x.CRefPrice), "總量", fmt(x.CTotalVolume)],
      ];
      $("stats").innerHTML = rows
        .map((r) => `<tr><td class="lab">${r[0]}</td><td>${r[1]}</td><td class="lab">${r[2]}</td><td>${r[3]}</td></tr>`)
        .join("");

      let bidTot = 0, askTot = 0;
      const levels = [1, 2, 3, 4, 5];
      levels.forEach((i) => {
        bidTot += n(x["CBidSize" + i]) || 0;
        askTot += n(x["CAskSize" + i]) || 0;
      });
      const tot = bidTot + askTot;
      const pin = tot ? (bidTot / tot) * 100 : 50;
      $("barIn").style.width = pin + "%";
      $("barOut").style.width = (100 - pin) + "%";
      const inn = n(x.inMarket), outv = n(x.outMarket);
      if (inn != null && outv != null && inn + outv > 0) {
        const pin2 = (inn / (inn + outv)) * 100;
        $("barIn").style.width = pin2 + "%";
        $("barOut").style.width = (100 - pin2) + "%";
        $("inoutlab").innerHTML =
          `<span class="dn">內盤 ${fmt(inn)}</span>　<span class="up">外盤 ${fmt(outv)}</span>`;
      } else {
        $("inoutlab").innerHTML =
          `<span class="dn">委買 ${fmt(bidTot)}</span>　<span class="up">委賣 ${fmt(askTot)}</span>`;
      }

      const maxSz = Math.max(bidTot, askTot, 1);
      let ob = `<tr><td class="lab">委買量</td><td></td><td>買價</td><td>賣價</td><td></td><td class="lab">委賣量</td></tr>`;
      levels.forEach((i) => {
        const bs = n(x["CBidSize" + i]) || 0;
        const asz = n(x["CAskSize" + i]) || 0;
        const bw = Math.round((bs / maxSz) * 72);
        const aw = Math.round((asz / maxSz) * 72);
        ob += `<tr>
          <td class="bid">${fmt(x["CBidSize" + i])}</td>
          <td><span class="szbar g" style="width:${bw}px"></span></td>
          <td class="bid">${fmt(x["CBidPrice" + i])}</td>
          <td class="ask">${fmt(x["CAskPrice" + i])}</td>
          <td><span class="szbar" style="width:${aw}px"></span></td>
          <td class="ask">${fmt(x["CAskSize" + i])}</td>
        </tr>`;
      });
      $("ob").innerHTML = ob;
      $("live").className = "live" + (live ? " on" : "");
      $("live").textContent = live ? "LIVE" : "快照";
      renderRelated();
      draw();
    }

    function renderRelated() {
      const box = $("related");
      if (!box) return;
      const items = (snap && snap.related) || [];
      box.innerHTML = items.map((r) => {
        const diff = n(r.diff);
        return `<div class="rel">
          <div class="n">${r.name || r.symbol}</div>
          <div class="p ${cls(diff)}">${fmt(r.last)}</div>
          <div class="c ${cls(diff)}">${arrow(diff)} ${fmt(Math.abs(diff))} (${fmt(n(r.rate), 2)}%)</div>
        </div>`;
      }).join("");
    }

    function fmtTime(d, t) {
      if (!d) return "—";
      const ds = String(d);
      const ts = String(t || "000000").padStart(6, "0");
      return `${ds.slice(4, 6)}/${ds.slice(6, 8)} ${ts.slice(0, 2)}:${ts.slice(2, 4)}:${ts.slice(4, 6)}`;
    }

    function sessKey() { return session === "night" ? "night" : "day"; }

    function resample(bars, minutes) {
      if (!bars || minutes <= 1) return bars || [];
      const ms = minutes * 60 * 1000;
      const out = [];
      let cur = null;
      bars.forEach((b) => {
        const t = Math.floor(b.timestamp / ms) * ms;
        if (!cur || cur.timestamp !== t) {
          if (cur) out.push(cur);
          cur = {
            timestamp: t,
            open: b.open, high: b.high, low: b.low, close: b.close,
            volume: b.volume || 0, date: b.date, session: b.session,
          };
        } else {
          cur.high = Math.max(cur.high, b.high);
          cur.low = Math.min(cur.low, b.low);
          cur.close = b.close;
          cur.volume += (b.volume || 0);
        }
      });
      if (cur) out.push(cur);
      return out;
    }

    function minuteSeries() {
      const m1 = minutePack[sessKey() + "_1m"] || [];
      return resample(m1, daySpan);
    }

    function lastDates(nDays) {
      const bars = (minutePack[sessKey() + "_1m"] || []).concat(dailyPack[sessKey()] || []);
      const dates = [];
      for (let i = bars.length - 1; i >= 0 && dates.length < nDays; i--) {
        const d = bars[i].date;
        if (d && dates.indexOf(d) < 0) dates.push(d);
      }
      return dates;
    }

    function linePoints() {
      const keep = lastDates(daySpan);
      const mins = minuteSeries().filter((b) => keep.indexOf(b.date) >= 0);
      const pts = mins.map((b) => ({ px: b.close, vol: b.volume, time: b.timestamp }));
      const livePts = hist[session] || [];
      const lastTs = pts.length ? pts[pts.length - 1].time : 0;
      livePts.forEach((p) => {
        const ts = Date.parse(String(p.t).replace(/-/g, "/")) || 0;
        if (p.px && ts > lastTs) pts.push({ px: p.px, vol: p.vol, time: ts });
      });
      return pts;
    }

    function klineData() {
      const m1 = minutePack[sessKey() + "_1m"] || [];
      const keep = lastDates(1);
      const mins = m1.filter((b) => keep.indexOf(b.date) >= 0);
      if (mins.length) return mins;
      return dailyPack[sessKey()] || [];
    }

    function draw() {
      const lineOn = chartMode === "line";
      $("chart").style.display = lineOn ? "block" : "none";
      $("khost").style.display = lineOn ? "none" : "block";
      if (!lineOn) {
        renderK();
        return;
      }
      const c = $("chart");
      const ctx = c.getContext("2d");
      const w = c.width, h = c.height;
      ctx.clearRect(0, 0, w, h);
      const pts = linePoints();
      if (pts.length < 2) {
        ctx.fillStyle = "#9ca3af";
        ctx.font = "14px sans-serif";
        ctx.fillText("走勢累積中…", 16, h / 2);
        return;
      }
      const prices = pts.map((p) => p.px);
      const ref = n(q() && q().CRefPrice) || prices[0];
      let mn = Math.min(...prices, ref);
      let mx = Math.max(...prices, ref);
      if (mx === mn) { mx += 10; mn -= 10; }
      const padL = 56, padR = 10, padT = 10, padB = 22;
      const cw = w - padL - padR;
      const ch = h - padT - padB;
      const xAt = (i) => padL + (i / (pts.length - 1)) * cw;
      const yAt = (p) => padT + (1 - (p - mn) / (mx - mn)) * ch;

      ctx.strokeStyle = "#e5e7eb";
      ctx.fillStyle = "#6b7280";
      ctx.font = "11px sans-serif";
      for (let i = 0; i < 5; i++) {
        const pv = mn + ((mx - mn) * i) / 4;
        const y = yAt(pv);
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(w - padR, y);
        ctx.stroke();
        ctx.fillText(Math.round(pv).toLocaleString("zh-TW"), 4, y + 4);
      }

      ctx.beginPath();
      pts.forEach((p, i) => {
        const x = xAt(i), y = yAt(p.px);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.strokeStyle = prices[prices.length - 1] >= ref ? "#ff4444" : "#44bb44";
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.lineTo(xAt(pts.length - 1), padT + ch);
      ctx.lineTo(xAt(0), padT + ch);
      ctx.closePath();
      ctx.fillStyle = prices[prices.length - 1] >= ref ? "rgba(255,68,68,0.12)" : "rgba(68,187,68,0.12)";
      ctx.fill();
    }

    function twStyles() {
      return {
        candle: {
          bar: {
            upColor: "#ff4444", downColor: "#44bb44", noChangeColor: "#888888",
            upBorderColor: "#ff4444", downBorderColor: "#44bb44", noChangeBorderColor: "#888888",
            upWickColor: "#ff4444", downWickColor: "#44bb44", noChangeWickColor: "#888888",
          },
        },
        indicator: { bars: [{ upColor: "#ff4444", downColor: "#44bb44", noChangeColor: "#888" }] },
      };
    }

    function renderK() {
      if (typeof klinecharts === "undefined") return;
      const data = klineData();
      if (!kchart) {
        kchart = klinecharts.init("khost", { styles: twStyles() });
        kchart.createIndicator("VOL", false, { id: "vol_pane" });
      }
      kchart.applyNewData(data.length ? data : []);
    }

    function slimYahoo(d) {
      const last = raw(d.price);
      const ref = raw(d.regularMarketPreviousClose);
      let diff = raw(d.change);
      if (diff == null && last != null && ref != null) diff = last - ref;
      let rate = null;
      const cp = d.changePercent;
      if (typeof cp === "string" && cp.endsWith("%")) rate = parseFloat(cp);
      if (rate == null && diff != null && ref) rate = (diff / ref) * 100;
      const now = new Date();
      const q = {
        SymbolID: d.symbol || "WTX&",
        DispCName: d.symbolName || "台指期近一",
        DispEName: d.symbol || "WTX&",
        CLastPrice: last,
        COpenPrice: raw(d.regularMarketOpen),
        CHighPrice: raw(d.regularMarketDayHigh),
        CLowPrice: raw(d.regularMarketDayLow),
        CRefPrice: ref,
        CDiff: diff,
        CDiffRate: rate,
        CTotalVolume: raw(d.volume) != null ? raw(d.volume) : Math.round((raw(d.volumeK) || 0) * 1000),
        CDate: now.getFullYear() + String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0"),
        CTime: String(now.getHours()).padStart(2, "0") + String(now.getMinutes()).padStart(2, "0") + String(now.getSeconds()).padStart(2, "0"),
        inMarket: raw(d.inMarket) != null ? Math.round(raw(d.inMarket) * 1000) : "",
        outMarket: raw(d.outMarket) != null ? Math.round(raw(d.outMarket) * 1000) : "",
      };
      const book = d.orderbook || [];
      for (let i = 0; i < 5; i++) {
        const lvl = book[i] || {};
        q["CBidPrice" + (i + 1)] = raw(lvl.bid);
        q["CBidSize" + (i + 1)] = raw(lvl.bidVol);
        q["CAskPrice" + (i + 1)] = raw(lvl.ask);
        q["CAskSize" + (i + 1)] = raw(lvl.askVol);
      }
      return q;
    }

    function miniYahoo(d) {
      const last = raw(d.price);
      const ref = raw(d.regularMarketPreviousClose);
      let diff = raw(d.change);
      if (diff == null && last != null && ref != null) diff = last - ref;
      let rate = null;
      const cp = d.changePercent;
      if (typeof cp === "string" && cp.endsWith("%")) rate = parseFloat(cp);
      if (rate == null && diff != null && ref) rate = (diff / ref) * 100;
      return { symbol: d.symbol, name: d.symbolName, last, diff, rate };
    }

    function applyLive(rows) {
      const wtx = rows.find((x) => x.symbol === "WTX&") || rows[0];
      if (!wtx) return;
      const q0 = slimYahoo(wtx);
      const related = rows.filter((x) => x.symbol === "WCDF&" || x.symbol === "WCCF&").map(miniYahoo);
      snap = {
        fetchedAt: new Date().toLocaleString("zh-TW", { hour12: false }),
        source: "yahoo via wtx.19850926.xyz",
        night: q0,
        day: q0,
        related,
      };
      const px = n(q0.CLastPrice);
      if (px) {
        const pt = { t: snap.fetchedAt, time: q0.CTime, px, vol: n(q0.CTotalVolume) || 0 };
        const h = hist.night;
        if (!h.length || h[h.length - 1].px !== px || h[h.length - 1].time !== pt.time) {
          h.push(pt);
          if (h.length > 800) h.splice(0, h.length - 800);
          hist.day = h;
        }
      }
      live = true;
      render();
    }

    async function pollLive() {
      try {
        const rows = await fetch(LIVE + "?t=" + Date.now()).then((r) => r.json());
        if (Array.isArray(rows) && rows.length) applyLive(rows);
      } catch (e) {
        live = false;
        if ($("live")) {
          $("live").className = "live";
          $("live").textContent = "快照";
        }
      }
    }

    async function load() {
      const [s, hn, hd] = await Promise.all([
        fetch("data/snapshot.json?t=" + Date.now()).then((r) => r.json()),
        fetch("data/history-night.json?t=" + Date.now()).then((r) => (r.ok ? r.json() : [])).catch(() => []),
        fetch("data/history-day.json?t=" + Date.now()).then((r) => (r.ok ? r.json() : [])).catch(() => []),
      ]);
      if (!live) {
        snap = s;
        hist.night = hn;
        hist.day = hd;
        render();
      }
    }

    $("tab-day").onclick = () => {
      session = "day";
      $("tab-day").classList.add("on");
      $("tab-night").classList.remove("on");
      render();
    };
    $("tab-night").onclick = () => {
      session = "night";
      $("tab-night").classList.add("on");
      $("tab-day").classList.remove("on");
      render();
    };
    function syncDayChips() {
      const el = $("daychips");
      if (!el) return;
      if (chartMode === "line") el.classList.add("show");
      else el.classList.remove("show");
    }

    $("mode-line").onclick = () => {
      chartMode = "line";
      $("mode-line").classList.add("on");
      $("mode-k").classList.remove("on");
      syncDayChips();
      draw();
    };
    $("mode-k").onclick = () => {
      chartMode = "k";
      $("mode-k").classList.add("on");
      $("mode-line").classList.remove("on");
      syncDayChips();
      draw();
    };
    document.querySelectorAll(".chip[data-days]").forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll(".chip[data-days]").forEach((b) => b.classList.remove("on"));
        btn.classList.add("on");
        daySpan = Number(btn.getAttribute("data-days"));
        draw();
      };
    });

    async function loadKline() {
      try {
        const pack = await fetch("data/kline-daily.json?t=" + Date.now()).then((r) => r.json());
        dailyPack.night = pack.night || [];
        dailyPack.day = pack.day || [];
      } catch (e) {}
      try {
        const m = await fetch("data/kline-minute.json?t=" + Date.now()).then((r) => r.json());
        ["night_1m","day_1m","night_5m","day_5m","night_15m","day_15m"].forEach((k) => {
          minutePack[k] = m[k] || [];
        });
        if (!minutePack.night_1m.length && (m.night || []).length) {
          minutePack.night_1m = m.night;
          minutePack.day_1m = m.day || [];
        }
      } catch (e) {}
      draw();
    }

    syncDayChips();
    load();
    loadKline();
    pollLive();
    setInterval(pollLive, 5000);
    setInterval(loadKline, 60000);
  </script>
</body>
</html>
